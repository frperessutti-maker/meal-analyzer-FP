<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meal Analyzer</title><!-- v24 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root{
      --rose:oklch(60% 0.16 340); --rose-soft:oklch(94% 0.03 340);
      --good:oklch(58% 0.13 150); --good-soft:oklch(94% 0.04 150);
      --warn:oklch(70% 0.14 70); --warn-soft:oklch(94% 0.045 70);
      --bad:oklch(55% 0.17 25); --bad-soft:oklch(94% 0.045 25);
      --ink:oklch(20% 0.01 340); --ink-soft:oklch(45% 0.012 340); --ink-faint:oklch(55% 0.012 340);
      --gray:oklch(75% 0.02 340); --track:oklch(90% 0.008 340);
      --page-bg:oklch(96% 0.006 340); --card-bg:#fff; --border:oklch(90% 0.008 340); --border-soft:oklch(93% 0.006 340);
      --serif:'Source Serif 4',Georgia,serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--page-bg);-webkit-font-smoothing:antialiased}
    .app{max-width:640px;margin:0 auto;padding:20px 16px 124px}
    h1{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink)} .sub{font-size:14px;color:var(--ink-soft);margin-top:4px}
    .h-page{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);text-wrap:balance}
    .tog{display:flex;background:var(--page-bg);border-radius:12px;padding:3px;margin-bottom:16px}
    .tog button{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;background:transparent;color:var(--ink-soft);border-radius:10px}
    .tog button.on{background:#fff;color:var(--ink)}
    textarea{width:100%;min-height:90px;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;resize:vertical;outline:none;background:#fff}
    textarea:focus{border-color:var(--rose)}
    input[type=text],input[type=number],input[type=time],select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
    input:focus,select:focus{border-color:var(--rose)}
    .btn{padding:14px 0;background:var(--ink);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-rose{background:var(--rose)}
    .btn-s{padding:9px 14px;font-size:13px;width:auto;margin-top:0;border-radius:10px}
    .btn-o{background:#fff;color:var(--ink-soft);border:1px solid var(--border)}
    .btn-d{background:var(--bad);color:#fff;border:none}
    .btn-do{background:#fff;color:var(--bad);border:1px solid oklch(80% 0.1 25)}
    .btn-x{background:none;border:none;color:var(--gray);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
    .upl{background:#fff;border-radius:14px;border:1.5px dashed var(--gray);padding:32px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
    .prev{width:100%;max-height:280px;object-fit:cover;border-radius:14px;border:1px solid var(--border)}
    .card{background:var(--page-bg);border-radius:12px;padding:12px;text-align:center}
    .card-l{font-size:11px;color:var(--ink-soft);font-weight:500;margin-bottom:4px}
    .card-v{font-size:20px;font-weight:600} .card-s{font-size:11px;color:var(--gray);margin-top:2px}
    .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px}
    .gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:32px}
    .pbg{width:100%;height:6px;background:var(--track);border-radius:4px;overflow:hidden}
    .pf{height:100%;border-radius:4px;transition:width .4s ease}
    .stit{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
    .slab{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
    .mi{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--border)}
    .mn{font-weight:500;font-size:14px} .mm{font-size:12px;color:var(--ink-soft);margin-top:4px}
    .err{background:var(--bad-soft);border:1px solid oklch(80% 0.1 25);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--bad)}
    .info{background:var(--warn-soft);border:1px solid oklch(85% 0.08 70);border-radius:16px;padding:16px;margin-bottom:24px;font-size:13px;color:oklch(38% 0.09 60);line-height:1.5}
    .defb{background:var(--bad-soft);border:1px solid oklch(85% 0.1 25);border-radius:16px;padding:16px;margin-bottom:24px}
    .deft{font-size:14px;font-weight:600;color:var(--bad);margin-bottom:8px}
    .deftags{display:flex;flex-wrap:wrap;gap:8px}
    .deftag{font-size:13px;background:#fff;border:1px solid oklch(85% 0.1 25);padding:4px 12px;border-radius:100px;color:var(--bad);font-weight:500}
    .dc{background:#fff;border:1px solid var(--border);border-radius:20px;padding:0;margin-bottom:12px;overflow:hidden}
    .pill{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:500;display:inline-block;margin:2px}
    .fr{display:flex;gap:8px} .fc{display:flex;flex-direction:column;gap:8px}
    .field{margin-bottom:16px} .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp{display:inline-block;width:20px;height:20px;border:2px solid var(--track);border-top-color:var(--ink);border-radius:50%;animation:spin .6s linear infinite}
    .collapse-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink-soft);font-weight:600;padding:0;display:flex;align-items:center;gap:4px}
    .panel{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--border)}
    .chip{padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
    .chip.on{background:var(--rose-soft);color:var(--rose);border-color:var(--rose)}
    .switch{width:46px;height:28px;border-radius:16px;padding:3px;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;flex-shrink:0;transition:background .15s}
    .switch-knob{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:margin .15s}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px}
    .toggle-row+.toggle-row{border-top:1px solid var(--border-soft)}
    .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);max-width:640px;margin:0 auto}
    .tab{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;cursor:pointer;background:none;border:none;padding:10px 0;min-height:52px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .tab-dot{width:24px;height:3px;border-radius:2px;background:transparent}
    .tab.on .tab-dot{background:var(--rose)}
    .tab-label{font-size:14px;font-weight:500;color:var(--gray)}
    .tab.on .tab-label{font-weight:700;color:var(--ink)}
    .chev{transition:transform .15s;flex-shrink:0}
    .chev.open{transform:rotate(0deg)} .chev.closed{transform:rotate(-90deg)}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   PERFORMANCE REPORT BUNDLE — for inline injection into index.html

   Exposes on window:
     window.buildPerformanceReport(state) → report object
     window.renderReportPDF(report)       → jsPDF doc

   REQUIRES: jsPDF loaded via CDN as window.jspdf.jsPDF
   ───────────────────────────────────────────────────────────── */
(function () {
  const MACROS = ["calories", "protein", "fat", "carbs", "fiber"];
  const TRAINING_TYPES = ["strength", "hiit", "endurance", "skill", "recovery", "other"];
  const HABIT_VARS = [
    { key: "sun_freq",       label: "Sun exposure frequency" },
    { key: "hydration_freq", label: "Hydration frequency" },
    { key: "sleep_quality",  label: "Sleep quality (% well-slept)" },
    { key: "avg_protein",    label: "Average daily protein" },
    { key: "avg_carbs",      label: "Average daily carbs" },
    { key: "avg_calories",   label: "Average daily calories" },
    { key: "avg_fiber",      label: "Average daily fiber" },
  ];

  function parseDateTime(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    const [h, m] = timeStr.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const d = new Date(dateStr + "T00:00:00");
    d.setHours(h, m, 0, 0);
    return d;
  }
  function addHours(date, hours) { return new Date(date.getTime() + hours * 3600 * 1000); }
  function daysBetween(a, b) { return Math.floor((b - a) / (1000 * 60 * 60 * 24)); }
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T12:00:00");
    d.setDate(d.getDate() + delta);
    return isoDate(d);
  }

  function spearman(xs, ys) {
    if (!xs || !ys || xs.length !== ys.length || xs.length < 3) return null;
    const n = xs.length;
    const rankOf = (arr) => {
      const indexed = arr.map((v, i) => ({ v, i }));
      indexed.sort((a, b) => a.v - b.v);
      const ranks = new Array(n);
      let i = 0;
      while (i < n) {
        let j = i;
        while (j + 1 < n && indexed[j + 1].v === indexed[i].v) j++;
        const avgRank = (i + j) / 2 + 1;
        for (let k = i; k <= j; k++) ranks[indexed[k].i] = avgRank;
        i = j + 1;
      }
      return ranks;
    };
    const rx = rankOf(xs); const ry = rankOf(ys);
    const allSame = (arr) => arr.every((v) => v === arr[0]);
    if (allSame(rx) || allSame(ry)) return null;
    const meanX = rx.reduce((a, b) => a + b, 0) / n;
    const meanY = ry.reduce((a, b) => a + b, 0) / n;
    let num = 0, denX = 0, denY = 0;
    for (let i = 0; i < n; i++) {
      const dx = rx[i] - meanX; const dy = ry[i] - meanY;
      num += dx * dy; denX += dx * dx; denY += dy * dy;
    }
    const den = Math.sqrt(denX * denY);
    return den === 0 ? null : num / den;
  }

  function mean(arr) { if (!arr || arr.length === 0) return 0; return arr.reduce((a, b) => a + b, 0) / arr.length; }
  function correlationConfidence(rho, n) {
    return Math.round(Math.min(n / 15, 1) * Math.min(Math.abs(rho) / 0.6, 1) * 100);
  }
  function meanDiffConfidence(delta, nMin) {
    return Math.round(Math.min(nMin / 10, 1) * Math.min(Math.abs(delta) / 2, 1) * 100);
  }

  function extractSessions(history, rpp) {
    const sessionDates = Object.keys(rpp)
      .filter((d) => { const r = rpp[d]; if (!r || typeof r !== "object") return false; return r.score > 0 && r.trainingTime && r.trainingType; })
      .sort();
    const sessions = [];
    for (let i = 0; i < sessionDates.length; i++) {
      const date = sessionDates[i];
      const r = rpp[date];
      const trainingDT = parseDateTime(date, r.trainingTime);
      if (!trainingDT) continue;
      const W1_start = addHours(trainingDT, -3);
      const W1_end = trainingDT;
      const W2_start = addHours(trainingDT, -12);
      const W2_end = W1_start;
      let W3_start = null, W3_end = null;
      if (i > 0) {
        const prevDate = sessionDates[i - 1];
        const prevR = rpp[prevDate];
        const prevDT = parseDateTime(prevDate, prevR.trainingTime);
        if (prevDT && daysBetween(prevDT, trainingDT) <= 2) {
          W3_start = prevDT; W3_end = addHours(prevDT, 24);
        }
      }
      const relevantDates = new Set([date, addDays(date, -1)]);
      if (W3_start) relevantDates.add(isoDate(W3_start));
      const meals = [];
      relevantDates.forEach((d) => {
        (history[d] || []).forEach((m) => {
          const mealDT = parseDateTime(m.date || d, m.time);
          if (mealDT) meals.push({ ...m, _dt: mealDT });
        });
      });
      const inRange = (dt, start, end) => dt >= start && dt < end;
      const sumMacros = (mealSubset) => {
        const totals = {}; MACROS.forEach((k) => (totals[k] = 0));
        mealSubset.forEach((m) => { MACROS.forEach((k) => { const v = Number(m[k]); totals[k] += isNaN(v) ? 0 : v; }); });
        return totals;
      };
      const W1_meals = meals.filter((m) => inRange(m._dt, W1_start, W1_end));
      const W2_meals = meals.filter((m) => inRange(m._dt, W2_start, W2_end));
      const W3_meals = W3_start ? meals.filter((m) => inRange(m._dt, W3_start, W3_end)) : [];
      sessions.push({
        date, score: r.score, trainingTime: r.trainingTime, trainingType: r.trainingType,
        W1: sumMacros(W1_meals), W2: sumMacros(W2_meals), W3: W3_start ? sumMacros(W3_meals) : null,
        W1_count: W1_meals.length, W2_count: W2_meals.length, W3_count: W3_meals.length,
      });
    }
    return sessions;
  }

  function tier1(sessions) {
    const findings = {};
    TRAINING_TYPES.forEach((type) => {
      const typeSessions = sessions.filter((s) => s.trainingType === type);
      if (typeSessions.length < 5) return;
      const perType = [];
      ["W1", "W2", "W3"].forEach((window) => {
        const valid = typeSessions.filter((s) => s[window] !== null);
        if (valid.length < 5) return;
        MACROS.forEach((macro) => {
          const xs = valid.map((s) => s[window][macro]);
          const ys = valid.map((s) => s.score);
          const rho = spearman(xs, ys);
          if (rho === null) return;
          const confidence = correlationConfidence(rho, valid.length);
          if (Math.abs(rho) < 0.3 || confidence < 25) return;
          const sortedByX = valid.slice().sort((a, b) => a[window][macro] - b[window][macro]);
          const mid = Math.floor(sortedByX.length / 2);
          const lowGroup = sortedByX.slice(0, mid);
          const highGroup = sortedByX.slice(sortedByX.length - mid);
          perType.push({
            window, macro,
            rho: Math.round(rho * 100) / 100, n: valid.length, confidence,
            direction: rho > 0 ? "positive" : "negative",
            groups: {
              low: { rppAvg: Math.round(mean(lowGroup.map((s) => s.score)) * 10) / 10, macroAvg: Math.round(mean(lowGroup.map((s) => s[window][macro]))), n: lowGroup.length },
              high: { rppAvg: Math.round(mean(highGroup.map((s) => s.score)) * 10) / 10, macroAvg: Math.round(mean(highGroup.map((s) => s[window][macro]))), n: highGroup.length },
            },
          });
        });
      });
      perType.sort((a, b) => Math.abs(b.rho) - Math.abs(a.rho));
      if (perType.length > 0) findings[type] = { n: typeSessions.length, findings: perType.slice(0, 3) };
    });
    return findings;
  }

  function tier2(sessions, sunlight, sleep, hydration) {
    const results = {};
    const check = (name, predicate) => {
      const withTrue = sessions.filter((s) => predicate(s.date) === true);
      const withFalse = sessions.filter((s) => predicate(s.date) !== true);
      if (withTrue.length < 3 || withFalse.length < 3) return null;
      const meanTrue = mean(withTrue.map((s) => s.score));
      const meanFalse = mean(withFalse.map((s) => s.score));
      const delta = meanTrue - meanFalse;
      if (Math.abs(delta) < 0.5) return null;
      const confidence = meanDiffConfidence(delta, Math.min(withTrue.length, withFalse.length));
      return { meanTrue: Math.round(meanTrue * 10) / 10, meanFalse: Math.round(meanFalse * 10) / 10, nTrue: withTrue.length, nFalse: withFalse.length, delta: Math.round(delta * 10) / 10, confidence };
    };
    const sun = check("sun", (d) => !!sunlight[d]); if (sun) results.sun = sun;
    const hyd = check("hydration", (d) => !!hydration[d]); if (hyd) results.hydration = hyd;
    const slp = check("sleep", (d) => sleep[d] === true); if (slp) results.sleep = slp;
    return results;
  }

  function tier3(history, sleep, sunlight, rpp) {
    const sleepDates = Object.keys(sleep).filter((d) => sleep[d] === true || sleep[d] === false);
    if (sleepDates.length < 6) return null;
    const nights = sleepDates.map((d) => {
      const dayMeals = history[d] || [];
      const dayR = rpp[d];
      const trainingDT = dayR && typeof dayR === "object" && dayR.trainingTime ? parseDateTime(d, dayR.trainingTime) : null;
      const totals = {}; MACROS.forEach((k) => (totals[k] = 0));
      dayMeals.forEach((m) => { MACROS.forEach((k) => { const v = Number(m[k]); totals[k] += isNaN(v) ? 0 : v; }); });
      let lastMealHour = null;
      dayMeals.forEach((m) => {
        if (m.time) { const [h, mm] = m.time.split(":").map(Number); const total = h + mm / 60; if (lastMealHour === null || total > lastMealHour) lastMealHour = total; }
      });
      const lateTraining = trainingDT ? trainingDT.getHours() >= 20 : false;
      return { date: d, slept_well: sleep[d] === true, carbs: totals.carbs, calories: totals.calories, last_meal_hour: lastMealHour, late_training: lateTraining, sun: !!sunlight[d] };
    });
    const well = nights.filter((n) => n.slept_well);
    const poor = nights.filter((n) => !n.slept_well);
    if (well.length < 3 || poor.length < 3) return null;
    const factors = {};
    const contFactors = [{ key: "carbs", label: "Daily carbs" }, { key: "calories", label: "Daily calories" }];
    contFactors.forEach(({ key, label }) => {
      const wellVals = well.map((n) => n[key]).filter((v) => v > 0);
      const poorVals = poor.map((n) => n[key]).filter((v) => v > 0);
      if (wellVals.length < 3 || poorVals.length < 3) return;
      const wellMean = mean(wellVals); const poorMean = mean(poorVals);
      const relDelta = poorMean === 0 ? 0 : (wellMean - poorMean) / poorMean;
      if (Math.abs(relDelta) < 0.15) return;
      factors[key] = { label, wellMean: Math.round(wellMean), poorMean: Math.round(poorMean), nWell: wellVals.length, nPoor: poorVals.length, confidence: Math.round(Math.min(Math.min(wellVals.length, poorVals.length) / 10, 1) * Math.min(Math.abs(relDelta) / 0.5, 1) * 100) };
    });
    const lmhWell = well.map((n) => n.last_meal_hour).filter((v) => v !== null);
    const lmhPoor = poor.map((n) => n.last_meal_hour).filter((v) => v !== null);
    if (lmhWell.length >= 3 && lmhPoor.length >= 3) {
      const wm = mean(lmhWell); const pm = mean(lmhPoor);
      if (Math.abs(wm - pm) >= 0.5) {
        factors.last_meal_hour = { label: "Last meal time (hour)", wellMean: Math.round(wm * 10) / 10, poorMean: Math.round(pm * 10) / 10, nWell: lmhWell.length, nPoor: lmhPoor.length, confidence: Math.round(Math.min(Math.min(lmhWell.length, lmhPoor.length) / 10, 1) * Math.min(Math.abs(wm - pm) / 2, 1) * 100) };
      }
    }
    const checkBinary = (key, label) => {
      const wellRate = well.filter((n) => n[key]).length / well.length;
      const poorRate = poor.filter((n) => n[key]).length / poor.length;
      if (Math.abs(wellRate - poorRate) < 0.15) return;
      factors[key] = { label, wellRate: Math.round(wellRate * 100), poorRate: Math.round(poorRate * 100), nWell: well.length, nPoor: poor.length, confidence: Math.round(Math.min(Math.min(well.length, poor.length) / 10, 1) * Math.min(Math.abs(wellRate - poorRate) / 0.4, 1) * 100) };
    };
    checkBinary("late_training", "Late training (after 20:00)");
    checkBinary("sun", "Sun exposure that day");
    return { nWell: well.length, nPoor: poor.length, factors };
  }

  function buildDailySeries(history, rpp, sunlight, sleep, hydration) {
    const dates = new Set();
    Object.keys(history).forEach((d) => dates.add(d));
    Object.keys(rpp).forEach((d) => dates.add(d));
    Object.keys(sunlight).forEach((d) => dates.add(d));
    Object.keys(sleep).forEach((d) => dates.add(d));
    Object.keys(hydration).forEach((d) => dates.add(d));
    if (dates.size === 0) return { dates: [], series: {} };
    const sorted = [...dates].sort();
    const first = sorted[0]; const last = sorted[sorted.length - 1];
    const full = []; let cursor = first;
    while (cursor <= last) { full.push(cursor); cursor = addDays(cursor, 1); }
    const series = { sun_freq: [], hydration_freq: [], sleep_quality: [], avg_protein: [], avg_carbs: [], avg_calories: [], avg_fiber: [], rpp: [] };
    full.forEach((d) => {
      series.sun_freq.push(sunlight[d] === true ? 1 : 0);
      series.hydration_freq.push(hydration[d] === true ? 1 : 0);
      series.sleep_quality.push(sleep[d] === true ? 1 : sleep[d] === false ? 0 : null);
      const meals = history[d] || [];
      const dm = { protein: 0, carbs: 0, calories: 0, fiber: 0 };
      meals.forEach((m) => { dm.protein += Number(m.protein) || 0; dm.carbs += Number(m.carbs) || 0; dm.calories += Number(m.calories) || 0; dm.fiber += Number(m.fiber) || 0; });
      const hasMeals = meals.length > 0;
      series.avg_protein.push(hasMeals ? dm.protein : null);
      series.avg_carbs.push(hasMeals ? dm.carbs : null);
      series.avg_calories.push(hasMeals ? dm.calories : null);
      series.avg_fiber.push(hasMeals ? dm.fiber : null);
      const r = rpp[d]; const score = r && typeof r === "object" ? r.score : (r || 0);

  function rollingMean(arr, window, endIdx) {
    const start = Math.max(0, endIdx - window + 1);

    return slice.reduce((a, b) => a + b, 0) / slice.length;
  }
  function tier4(history, rpp, sunlight, sleep, hydration) {
    const { dates, series } = buildDailySeries(history, rpp, sunlight, sleep, hydration);
    if (dates.length < 60) return { changes: [], note: "Need at least 60 days of history for habit-change detection." };
    const WINDOW = 28, MIN_PERSIST = 14, REL_THRESHOLD = 0.20, RPP_THRESHOLD = 0.4;
    const changes = [];
    HABIT_VARS.forEach((v) => {
      const s = series[v.key];

      for (let i = WINDOW; i < dates.length - MIN_PERSIST; i++) {
        const before = rolling[i - WINDOW]; const after = rolling[i];
        if (before === null || after === null) continue;
        if (before === 0) continue;
        const relChange = (after - before) / Math.abs(before);

        const persistIdx = Math.min(i + MIN_PERSIST, dates.length - 1);
        const persistVal = rolling[persistIdx];

  function giSection(history, giDistress) {
    const daysWithData = Object.keys(history).filter((d) => history[d] && history[d].length > 0);
    const giDates = Object.keys(giDistress).filter((d) => giDistress[d]);
    const okDays = daysWithData.filter((d) => !giDistress[d]);
    if (giDates.length < 1 || daysWithData.length < 3) return null;
    const stopWords = ["with", "and", "the", "for", "cup", "some", "two", "one", "per", "from"];
    const extractKeywords = (meals) => {
      const words = new Set();
      (meals || []).forEach((m) => {
        const name = (m.mealName || "").toLowerCase().replace(/[^a-zàèéìòùäöü\s]/g, "");
        name.split(/\s+/).filter((w) => w.length > 2 && !stopWords.includes(w)).forEach((w) => words.add(w));
      });
      return words;
    };
    // Flat list of every logged meal with a resolvable timestamp, so we can pull
    // "what was eaten in the 24h before this GI report" regardless of which
    // calendar day(s) those meals actually fall on.
    const allMeals = [];
    Object.keys(history).forEach((d) => {
      (history[d] || []).forEach((m) => {
        const dt = parseDateTime(m.date || d, m.time);
        if (dt) allMeals.push({ mealName: m.mealName, _dt: dt });
      });
    });
    const giKeywords = {}, okKeywords = {};
    giDates.forEach((d) => {
      const clickDT = typeof giDistress[d] === "string" ? parseDateTime(d, giDistress[d]) : null;
      let suspectMeals;
      if (clickDT) {
        const windowStart = new Date(clickDT.getTime() - 24 * 3600 * 1000);
        suspectMeals = allMeals.filter((m) => m._dt >= windowStart && m._dt < clickDT);
      } else {
        // No click time recorded (older data logged before this fix) — fall back to the whole day.
        suspectMeals = history[d] || [];
      }
      extractKeywords(suspectMeals).forEach((w) => { giKeywords[w] = (giKeywords[w] || 0) + 1; });
    });
    okDays.forEach((d) => extractKeywords(history[d]).forEach((w) => { okKeywords[w] = (okKeywords[w] || 0) + 1; }));
    const baseRate = giDates.length / daysWithData.length;
    const triggers = [];
    Object.keys(giKeywords).forEach((word) => {
      const giCount = giKeywords[word]; const okCount = okKeywords[word] || 0;
      const total = giCount + okCount;
      if (total < 2) return;
      const giRate = giCount / total; const lift = giRate / baseRate;
      const sampleFactor = Math.min(total / 5, 1); const liftScore = Math.min((lift - 1) / 3, 1);
      const confidence = Math.round(sampleFactor * liftScore * 100);
      if (lift > 1.5 && confidence > 15) triggers.push({ word, giCount, total, lift: Math.round(lift * 10) / 10, confidence });
    });
    triggers.sort((a, b) => b.confidence - a.confidence);
    return { giDays: giDates.length, totalDays: daysWithData.length, triggers: triggers.slice(0, 5) };
  }

  function buildReport(state) {
    const { history = {}, rpp = {}, sunlight = {}, sleep = {}, hydration = {}, giDistress = {} } = state;
    const sessions = extractSessions(history, rpp);
    const activeDays = Object.keys(history).filter((d) => history[d] && history[d].length > 0);
    return {
      meta: {
        generatedAt: new Date().toISOString(),
        totalDaysLogged: activeDays.length,
        totalSessions: sessions.length,
        sessionsByType: TRAINING_TYPES.reduce((acc, t) => { acc[t] = sessions.filter((s) => s.trainingType === t).length; return acc; }, {}),
      },
      tier1: tier1(sessions),
      tier2: tier2(sessions, sunlight, sleep, hydration),
      tier3: tier3(history, sleep, sunlight, rpp),
      tier4: tier4(history, rpp, sunlight, sleep, hydration),
      gi: giSection(history, giDistress),
    };
  }

  /* ─── PDF RENDERER ─── */
  const TRAINING_LABELS = { strength: "Strength", hiit: "HIIT / Conditioning", endurance: "Endurance", skill: "Skill / Technical", recovery: "Recovery / Mobility", other: "Other" };
  const TRAINING_ICONS = { strength: "STR", hiit: "HIT", endurance: "END", skill: "SKL", recovery: "REC", other: "OTH" };
  const WINDOW_LABELS = { W1: "the 3 hours before training", W2: "the 3-12 hours before training", W3: "the 24-hour recovery window after the previous session" };
  const WINDOW_SHORT = { W1: "before the session", W2: "3-12 hours before the session", W3: "during the previous 24 hours of recovery" };
  const MACRO_LABELS = { calories: "calories", protein: "protein", fat: "fat", carbs: "carbs", fiber: "fiber" };
  const MACRO_UNITS = { calories: "kcal", protein: "g", fat: "g", carbs: "g", fiber: "g" };
  const SLEEP_FACTOR_UNITS = { carbs: "g", calories: "kcal", protein: "g", fiber: "g" };

  function confidenceLabel(c) { if (c >= 75) return "high"; if (c >= 50) return "medium"; if (c >= 25) return "low"; return "preliminary"; }
  function filledDots(c) { return c >= 75 ? 4 : c >= 50 ? 3 : c >= 25 ? 2 : 1; }
  function drawDots(doc, x, y, conf, color) {
    const filled = filledDots(conf); const r = 0.9; const gap = 2.4;
    for (let i = 0; i < 4; i++) {
      const cx = x + i * gap;
      if (i < filled) { doc.setFillColor(...color); doc.circle(cx, y - 1.2, r, "F"); }
      else { doc.setDrawColor(...color); doc.setLineWidth(0.2); doc.circle(cx, y - 1.2, r, "S"); }

  }
  function formatDate(iso) { if (!iso) return ""; const d = new Date(iso + (iso.includes("T") ? "" : "T12:00:00")); return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); }
  function hourToClock(h) { if (h === null || h === undefined) return ""; const hh = Math.floor(h); const mm = Math.round((h - hh) * 60); return `${hh.toString().padStart(2, "0")}:${mm.toString().padStart(2, "0")}`; }

  const PAGE_W = 210, PAGE_H = 297, MARGIN = 20, CONTENT_W = PAGE_W - MARGIN * 2;
  const COLORS = { ink: [26,26,26], soft: [90,90,90], faint: [150,150,150], rule: [220,220,220], positive: [22,163,74], negative: [220,38,38], neutral: [100,100,100], accent: [59,130,246] };

  function createWriter(doc) {

    const ensureSpace = (needed) => { if (y + needed > PAGE_H - MARGIN) { doc.addPage(); y = MARGIN; } };
    return {
      get y() { return y; }, set y(v) { y = v; },
      space(mm) { y += mm; },
      ensureSpace,
      hr() { ensureSpace(6); doc.setDrawColor(...COLORS.rule); doc.setLineWidth(0.2); doc.line(MARGIN, y, PAGE_W - MARGIN, y); y += 4; },
      title(text) { ensureSpace(12); doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...COLORS.ink); doc.text(text, MARGIN, y); y += 8; },
      section(text) { ensureSpace(14); y += 4; doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...COLORS.ink); doc.text(text.toUpperCase(), MARGIN, y); y += 2; doc.setDrawColor(...COLORS.ink); doc.setLineWidth(0.4); doc.line(MARGIN, y, MARGIN + 20, y); y += 6; },

        doc.text(`${confidence}% confidence · ${confidenceLabel(confidence)}`, afterDotsX + 2, y);
        y += 4;
        doc.setFontSize(10); doc.setTextColor(...COLORS.ink);
        const wrapped = doc.splitTextToSize(text, CONTENT_W - indent);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN + indent, y); y += 4.2; });
        y += 3;
      },

        ensureSpace(10); y += 2;
        doc.setFillColor(...COLORS.ink);
        const startY = y;

        const blockHeight = wrapped.length * 4.2 + 4;
        doc.rect(MARGIN, startY - 3, 1.2, blockHeight, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...COLORS.faint);
        doc.text("KEY TAKEAWAY", MARGIN + 4, y); y += 4;
        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...COLORS.ink);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN + 4, y); y += 4.2; });
        y += 2;
      },
      empty(text) {
        doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(...COLORS.faint);
        const wrapped = doc.splitTextToSize(text, CONTENT_W);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN, y); y += 4.2; });
        y += 1;

  function tier1Sentence(f) {
    const macro = MACRO_LABELS[f.macro]; const unit = MACRO_UNITS[f.macro]; const window = WINDOW_LABELS[f.window];
    const dir = f.direction === "positive" ? "higher" : "lower";
    const opp = f.direction === "positive" ? "lower" : "higher";
    const strong = f.direction === "positive" ? f.groups.high : f.groups.low;
    const weak = f.direction === "positive" ? f.groups.low : f.groups.high;
    return `Your best sessions averaged RPP ${strong.rppAvg} and followed ${dir} ${macro} (${strong.macroAvg} ${unit}) in ${window}. Sessions with ${opp} ${macro} (${weak.macroAvg} ${unit}) averaged RPP ${weak.rppAvg}.`;
  }
  function tier2Sentence(name, data) {
    const labels = { sun: { yes: "days you logged sun exposure", no: "days without" }, hydration: { yes: "days you logged hydration", no: "days without" }, sleep: { yes: "sessions after a well-slept night", no: "sessions after poor sleep" } };
    const l = labels[name] || { yes: `days with ${name}`, no: `days without` };
    const diff = Math.abs(data.delta); const direction = data.delta > 0 ? "higher" : "lower";
    return `On the ${data.nTrue} ${l.yes} your average RPP was ${data.meanTrue} — ${diff} points ${direction} than the ${data.nFalse} ${l.no}, for which you averaged ${data.meanFalse}.`;
  }
  function tier3Sentence(name, f) {

    if (name === "last_meal_hour") return `Nights of good sleep followed days for which the average last meal time was ${hourToClock(f.wellMean)}. Poor-sleep nights followed days for which last meal was on average at ${hourToClock(f.poorMean)}.`;
    const unit = SLEEP_FACTOR_UNITS[name] || ""; const unitStr = unit ? ` ${unit}` : "";

  function tier4Sentence(c) {

  }

  function tier1Takeaway(tier1) {

      const macro = MACRO_LABELS[s.macro]; const dir = s.direction === "positive" ? "higher" : "lower";
      const win = WINDOW_SHORT[s.window]; const verb = s.direction === "positive" ? "improve" : "hurt";

  }
  function tier2Takeaway(t2) {
    const pos = [], neg = [];
    const labelFor = (n) => n === "sun" ? "sun exposure" : n === "sleep" ? "a well-slept night" : n === "hydration" ? "hydration" : n;
    Object.entries(t2 || {}).forEach(([n, d]) => (d.delta > 0 ? pos : neg).push(labelFor(n)));
    const parts = [];
    if (pos.length) parts.push(`${pos.join(" and ")} seem${pos.length === 1 ? "s" : ""} to improve performance`);
    if (neg.length) parts.push(`${neg.join(" and ")} seem${neg.length === 1 ? "s" : ""} to hurt performance`);
    if (parts.length === 0) return null;
    const s = parts.join("; ");

  }
  function tier3Takeaway(t3) {

  function tier4Takeaway(t4) {

      let lx = MARGIN;
      doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(...COLORS.faint);
      doc.text("Confidence:", lx, legendY); lx += 17;
      const legendItems = [{conf:80,label:"high"},{conf:60,label:"medium"},{conf:30,label:"low"},{conf:10,label:"preliminary"}];
      legendItems.forEach((it, i) => {
        lx = drawDots(doc, lx, legendY, it.conf, COLORS.neutral) + 1.5;
        doc.text(it.label, lx, legendY);
        lx += doc.getTextWidth(it.label) + 4;
        if (i < legendItems.length - 1) doc.text("·", lx - 2, legendY);
      });
      doc.text(`${p} / ${pageCount}`, PAGE_W - MARGIN, legendY, { align: "right" });
    }
    return doc;
  }

  window.buildPerformanceReport = buildReport;
  window.renderReportPDF = renderPDF;
})();

function calcTDEE(p){
  let bmr;
  if(p.gender==="male")bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)+5;
  else bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)-161;
  const h=p.trainingHours||0;
  const af=h<=0.5?1.4:h<=1?1.6:h<=1.5?1.7:h<=2?1.8:h<=3?1.9:2.0;
  return Math.round(bmr*af);
}
function calcHydration(p){return Math.round((35*p.weight+600*(p.trainingHours||0))/100)/10}

function calcTargets(p){
  const goal=GOALS.find(g=>g.id===p.goal)||GOALS[0];
  const baseCal=calcTDEE(p);
  const cal=baseCal+goal.calAdj;
  const prot=Math.round(p.weight*goal.protMult);
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.max(Math.round((cal-prot*4-fat*9)/4),50);
  const fiber=p.gender==="male"?35:28;
  const t={calories:cal,protein:prot,fat,carbs,fiber};
  MICROS.forEach(m=>{t[m.key]=m.target});
  if(p.gender==="female"){t.iron=18;t.vitaminA=700;t.vitaminC=75}
  // Overlay any user-set macro targets on top of the automatic calculation.
  // Protein is stored as g/kg so it rescales if weight changes; fat/carbs are stored as grams.
  // Fiber and micros are never overridden — they always stay automatic.
  if(p.custom){
    if(p.custom.protein!=null)t.protein=Math.round(p.custom.protein*p.weight);
    if(p.custom.fat!=null)t.fat=Math.round(p.custom.fat);
    if(p.custom.carbs!=null)t.carbs=Math.round(p.custom.carbs);
    t.calories=Math.round(t.protein*4+t.carbs*4+t.fat*9);
  }
  return t;
}

function today(){return new Date().toISOString().slice(0,10)}
function nowTime(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function minsOf(t){if(!t)return null;const[h,m]=String(t).split(":").map(Number);return(isNaN(h)||isNaN(m))?null:h*60+m}
// People usually log a main meal a while after eating it, so the first main meal logged
// in each window gets that meal's canonical time rather than the moment it was typed in.
// Everything else is stamped with the entry time. Two guards keep this honest:
//   - a canonical time is only used once it has passed, so nothing is stamped in the
//     future (logging at 00:30 stays 00:30 instead of jumping to 08:00);
//   - a light snack is always stamped with the entry time and never claims a window,
//     so an apple at 11:45 doesn't stop the real lunch from being placed at 12:30.
// Snacks are detected by calories, which works regardless of the language meals are
// typed in. Every time remains editable afterwards.
const SNACK_MAX_CALORIES=250;
const MEAL_WINDOWS=[
  {end:11*60+30,at:8*60},      // morning   -> breakfast 08:00
  {end:19*60,   at:12*60+30},  // midday    -> lunch     12:30
  {end:23*60+30,at:19*60},     // evening   -> dinner    19:00
];
const hhmm=mins=>String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
const isSnack=m=>{const c=Number(m&&m.calories);return c>0&&c<SNACK_MAX_CALORIES};
function defaultMealTime(todayMeals,meal){
  if(isSnack(meal))return nowTime();
  const d=new Date();const now=d.getHours()*60+d.getMinutes();
  let start=0;
  for(const w of MEAL_WINDOWS){
    if(now<w.end){
      // Only a main meal claims the window — snacks already logged in it don't count.
      const taken=(todayMeals||[]).some(m=>{const v=minsOf(m.time);return v!==null&&v>=start&&v<w.end&&!isSnack(m)});
      if(taken||now<w.at)return nowTime();
      return hhmm(w.at);
    }
    start=w.end;
  }
  return nowTime();
}
// Backfilling a past day has no meaningful "entry time", so meals are placed by
// position instead: first is breakfast, second lunch, third dinner. Anything beyond
// that is left blank for the user to set.
function defaultPastMealTime(dayMeals){
  const n=(dayMeals||[]).length;
  return n<MEAL_WINDOWS.length?hhmm(MEAL_WINDOWS[n].at):"";
}
function last7(){const d=[];for(let i=0;i<7;i++){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().slice(0,10))}return d}
function last10(){const d=[];for(let i=0;i<10;i++){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().slice(0,10))}return d}

function cleanUrl(text){

}

async function doAnalyze(text,img,prompt){
  const c=[];
  if(img){const mt=img.startsWith("data:image/png")?"image/png":"image/jpeg";c.push({type:"image",source:{type:"base64",media_type:mt,data:img.split(",")[1]}})}
  let cleanText=text?cleanUrl(text):text;
  // If URL found, fetch its content and include as context
  const urlMatch=cleanText&&cleanText.match(/https?:\/\/[^\s]+/);
  let pageContext="";
  if(urlMatch){
    const content=await fetchUrlContent(urlMatch[0]);
    if(content)pageContext=`\n\nPRODUCT PAGE CONTENT (use this for exact nutritional values):\n${content}`;
    cleanText=cleanText.replace(urlMatch[0],"").trim();
  }
  c.push({type:"text",text:`${prompt}${pageContext}\n\nMeal: ${cleanText}`});
  const body={model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:c}],userKey:currentUserKey,kind:"meal_analysis"};
  const r=await fetch(`${API_URL}/analyze`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  const allText=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const match=allText.match(/\{[^{}]*"mealName"[^{}]*\}/);
  if(match)return JSON.parse(match[0]);
  const broad=allText.match(/\{[\s\S]*\}/);
  if(broad)return JSON.parse(broad[0]);
  throw new Error("Analysis failed. Try describing the product manually.");
}

  const toggleIntol=(id)=>setIntol(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const[useCustom,setUseCustom]=useState(!!initial?.custom);

      </div>
    </div>}
    <button className="btn btn-rose" onClick={()=>{
      const weightChanged=initial?+weight!==initial.weight:false;

    <h3 className="stit">Macros today</h3>

}

/* ── HISTORY ── */
function HistoryPage({history,onAdd,onDel,onUpd,sunlight,giDistress,hydration,rpp,setRpp,sleep,templates,skipped,DT,prompt,profile}){
  const[editTimeKey,setEditTimeKey]=useState(null);
  const[suggestions,setSuggestions]=useState(null),[sugIdx,setSugIdx]=useState(0),[sugLd,setSugLd]=useState(false),[sugErr,setSugErr]=useState(null);
  const[ad,setAd]=useState(null),[ex,setEx]=useState(null),[di,setDi]=useState(""),[ld,setLd]=useState(false),[err,setErr]=useState(null);
  const[rppEditDate,setRppEditDate]=useState(null);
  const[editHistDate,setEditHistDate]=useState(null),[editHistIdx,setEditHistIdx]=useState(null),[editHistTxt,setEditHistTxt]=useState(""),[editHistLd,setEditHistLd]=useState(false);
  const[avgOpen,setAvgOpen]=useState(false);

  // 7-day window: averages cover all 7 (today included), the day cards cover the 6

  const days=last7();const baseline=sum(templates);

  const allN=[{label:"Calories",key:"calories",target:DT.calories,unit:""},{label:"Protein",key:"protein",target:DT.protein,unit:"g"},{label:"Fat",key:"fat",target:DT.fat,unit:"g"},{label:"Carbs",key:"carbs",target:DT.carbs,unit:"g"},{label:"Fiber",key:"fiber",target:DT.fiber,unit:"g"},...MICROS.map(m=>({label:m.name,key:m.key,target:DT[m.key],unit:m.unit}))];
  const dd=days.map(d=>({date:d,totals:history[d]?sum(history[d]):null,mc:history[d]?history[d].length:0,base:dayBaseline(d)}));
  const breakdownDD=dd.filter(d=>d.date!==today());
  const wd=dd.filter(d=>d.totals);
  const avg={};allN.forEach(n=>{avg[n.key]=wd.length>0?wd.reduce((s,d)=>s+((n.key==="vitaminD"&&sunlight[d.date])?sunVitD(d.date)+(d.totals[n.key]||0):(d.totals[n.key]||0)),0)/wd.length+(baseline[n.key]||0):0});
  const def=allN.filter(n=>Math.round((avg[n.key]/n.target)*100)<70&&wd.length>=2);
  const fmt=ds=>{const t=today();if(ds===t)return"Today";const y=new Date();y.setDate(y.getDate()-1);if(ds===y.toISOString().slice(0,10))return"Yesterday";return new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})};
  const pc=p=>p>=90?"#16a34a":p>=70?"#ca8a04":"#dc2626";


  const[chartNutrient,setChartNutrient]=useState("calories");
  const chartN=allN.find(n=>n.key===chartNutrient)||allN[0];
  // slice() first — dd is ordered newest-first, and reverse() mutates in place.
  const chartDays=dd.slice().reverse().map(d=>({
    date:d.date,
    v:d.totals?(d.totals[chartNutrient]||0)+(d.base[chartNutrient]||0)+(chartNutrient==="vitaminD"&&sunlight[d.date]?sunVitD(d.date):0):null,
    isToday:d.date===today(),
    shortLabel:d.date===today()?"Today":new Date(d.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}),
  }));
  const maxV=Math.max(...chartDays.map(d=>d.v||0),chartN.target,1)*1.05;

  return<div>
    {def.length>0&&<div className="defb"><div className="deft">Consistent deficiencies detected</div><p style={{fontSize:13,color:"#991b1b",margin:"0 0 10px"}}>Based on {wd.length}-day average:</p><div className="deftags">{def.map(n=><span key={n.key} className="deftag">{n.label}: {Math.round((avg[n.key]/n.target)*100)}% avg</span>)}</div></div>}
    <h3 className="stit" style={{marginTop:8}}>Lifestyle suggestions</h3>
    {(()=>{
      const days=last10();const wd=days.filter(d=>history[d]);

      const avg={};AK.forEach(k=>{avg[k]=wd.reduce((s,d)=>s+(k==="vitaminD"&&sunlight[d]?sunVitD(d)+(sum(history[d])[k]||0):(sum(history[d])[k]||0)),0)/wd.length+(baseline[k]||0)});
      const allN=[{l:"Calories",k:"calories",t:DT.calories,u:"kcal"},{l:"Protein",k:"protein",t:DT.protein,u:"g"},{l:"Fat",k:"fat",t:DT.fat,u:"g"},{l:"Carbs",k:"carbs",t:DT.carbs,u:"g"},{l:"Fiber",k:"fiber",t:DT.fiber,u:"g"},...MICROS.map(m=>({l:m.name,k:m.key,t:DT[m.key],u:m.unit}))];
      const defs=allN.filter(n=>Math.round((avg[n.k]/n.t)*100)<70);
      const excesses=allN.filter(n=>Math.round((avg[n.k]/n.t)*100)>200);
      if(defs.length===0&&excesses.length===0)return<div className="panel" style={{marginBottom:24,textAlign:"center",fontSize:14,color:"var(--good)",fontWeight:500}}>✓ No major deficiencies or excesses over the last {wd.length} days</div>;
      const defText=defs.map(d=>`${d.l}: ${Math.round(avg[d.k])}/${d.t}${d.u} (${Math.round((avg[d.k]/d.t)*100)}%)`).join(", ");
const getSug=async()=>{setSugLd(true);setSugIdx(0);setSugErr(null);try{const dietLabel=DIETS.find(d=>d.id===profile.diet)?.label||"Omnivore";const intolList=(profile.intolerances||[]).map(i=>INTOLERANCES.find(x=>x.id===i)?.label).filter(Boolean);const r=await fetch(`${API_URL}/analyze`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:`You are a practical nutrition advisor. Based on the deficiencies below, suggest 3 SIMPLE lifestyle food habits — not complex recipes, but easy daily additions like "add a handful of almonds as a snack", "have a yogurt with berries after training", "add pasta or bread to your meals". Keep it practical and easy to include in a daily routine.

User: ${profile.weight}kg ${profile.gender}, ${profile.trainingHours}h/day training, goal: ${profile.goal||"maintain"}.
Diet: ${dietLabel}.${intolList.length>0?`\nIntolerances/allergies: ${intolList.join(", ")}. NEVER suggest foods containing these.`:""}
${defs.length>0?`\nDeficiencies: ${defText}`:""}
${excesses.length>0?`\nExcesses (>200%): ${excesses.map(e=>`${e.l}: ${Math.round((avg[e.k]/e.t)*100)}%`).join(", ")}`:""}

IMPORTANT: All suggestions MUST be compatible with the user's ${dietLabel} diet${intolList.length>0?` and avoid ${intolList.join(", ")}`:""}. Respond ONLY with a JSON array (no markdown, no backticks):
[{"tip":"simple habit","helps":"what it addresses"},{"tip":"...","helps":"..."},{"tip":"...","helps":"..."}]`}],userKey:currentUserKey,kind:"lifestyle_suggestion"})});const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));const allText=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");const match=allText.match(/\[[\s\S]*\]/);if(!match)throw new Error("Could not parse suggestions");setSuggestions(JSON.parse(match[0]))}catch(e){setSuggestions(null);setSugErr(e.message)}finally{setSugLd(false)}};
      return<div className="panel" style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>

        {sugLd&&<div style={{textAlign:"center",padding:12,fontSize:14,color:"var(--ink-soft)"}}>Thinking…</div>}
        {suggestions&&<div>

            <div style={{display:"flex",gap:6}}>{suggestions.map((_,i)=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:i===sugIdx?"var(--rose)":"var(--track)"}}/>)}</div>

        {(()=>{const r=rpp[d.date];const s=typeof r==="object"?r.score:r||0;const t=typeof r==="object"?r.trainingTime:"";const ty=typeof r==="object"?r.trainingType:"";const tt=TRAINING_TYPES.find(x=>x.id===ty);const isEditing=rppEditDate===d.date;return<span onClick={()=>setRppEditDate(isEditing?null:d.date)} style={{fontSize:13,cursor:"pointer",color:s>=8?"var(--good)":s>=5?"var(--warn)":s>0?"var(--bad)":"var(--ink-soft)",fontWeight:s>0?600:400}}>💪 Rate of Perceived Performance{s>0?`: ${s}/10${t?" @ "+t:""}${tt?" · "+tt.icon+" "+tt.short:""}`:": tap to set"}</span>})()}

  ?<input type="time" autoFocus value={m.time||""} onChange={e=>onUpd(d.date,mi,{time:e.target.value})} onBlur={()=>setEditTimeKey(null)} style={{width:92,padding:"4px 7px",fontSize:11.5}}/>
  :<span onClick={()=>setEditTimeKey(d.date+"#"+mi)} title="Edit time" style={{fontSize:11.5,fontWeight:600,color:m.time?"var(--ink-soft)":"var(--gray)",background:"var(--page-bg)",border:"1px solid var(--border)",padding:"5px 9px",borderRadius:100,cursor:"pointer",whiteSpace:"nowrap"}}>{m.time||"set time"}</span>}<span onClick={()=>{setEditHistDate(d.date);setEditHistIdx(mi);setEditHistTxt(m.mealName)}} style={{cursor:"pointer"}}>✏️</span><span onClick={()=>onDel(d.date,mi)} style={{cursor:"pointer",color:"var(--bad)",fontSize:16}}>×</span></div></div>)}
        {ad===d.date
          ?<div className="panel" style={{padding:14}}><textarea value={di} onChange={e=>setDi(e.target.value)} placeholder="e.g., Grilled chicken 200g, rice" style={{minHeight:60,marginBottom:8}}/>{err&&<div className="err">{err}</div>}<div className="fr"><button className="btn btn-rose btn-s" onClick={async()=>{if(!di.trim())return;setLd(true);setErr(null);try{const m=await doAnalyze(di,null,prompt);m.date=d.date;m.time=d.date===today()?defaultMealTime(history[d.date]||[],m):defaultPastMealTime(history[d.date]||[]);onAdd(d.date,m);setAd(null);setDi("")}catch(e){setErr("Failed: "+e.message)}finally{setLd(false)}}} disabled={ld||!di.trim()}>{ld?"Analyzing…":"Add meal"}</button><button className="btn btn-o btn-s" onClick={()=>{setAd(null);setErr(null)}}>Cancel</button></div></div>
          :<button className="btn btn-o btn-s" style={{alignSelf:"flex-start"}} onClick={()=>{setAd(d.date);setDi("");setErr(null)}}>+ Add meal</button>}
        {d.totals&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px"}}>{[{l:"Proteins",v:(d.totals.protein||0)+(d.base.protein||0),t:DT.protein,c:"var(--rose)"},{l:"Fats",v:(d.totals.fat||0)+(d.base.fat||0),t:DT.fat,c:"var(--gray)"},{l:"Carbs",v:(d.totals.carbs||0)+(d.base.carbs||0),t:DT.carbs,c:"var(--ink)"},{l:"Fibers",v:(d.totals.fiber||0)+(d.base.fiber||0),t:DT.fiber,c:"var(--good)"}].map(m=><div key={m.l}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{fontWeight:500}}>{m.l}</span><span style={{color:"var(--ink-soft)"}}>{Math.round(m.v)}/{m.t}g</span></div><PB value={m.v} max={m.t} color={m.c}/></div>)}</div>
        {(()=>{const flags=MICROS.map(m=>{const val=(d.totals[m.key]||0)+(d.base[m.key]||0)+(m.key==="vitaminD"&&hasSun?sunVitD(d.date):0);const p=Math.round((val/DT[m.key])*100);return{m,p}}).filter(x=>x.p<90);return flags.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,paddingTop:6,borderTop:"1px solid var(--border-soft)"}}>{flags.map(({m,p})=><span key={m.key} className="pill" style={{background:p>=70?"var(--warn-soft)":"var(--bad-soft)",color:pc(p)}}>{m.name} · {p}%</span>)}</div>;})()}
        </>}

/* ── WEEKLY REPORT ── */
function ReportPage({history,rpp,sunlight,sleep,hydration,giDistress,lastReportWindowStart,setLastReportWindowStart}){
  const[showToast,setShowToast]=useState(false);
  const toastTimer=useRef(null);
  const activeDaysLogged=Object.keys(history).filter(d=>history[d]&&history[d].length>0).length;
  const reportState=(()=>{
    if(!lastReportWindowStart){
      if(activeDaysLogged<10){const x=10-activeDaysLogged;return{enabled:false,label:`First report available in ${x} day${x!==1?"s":""}`}}
      return{enabled:true,label:"Report available — download now"};
    }
    const daysSince=Math.floor((new Date(today()+"T12:00:00")-new Date(lastReportWindowStart+"T12:00:00"))/86400000);
    if(daysSince<10){const z=10-daysSince;return{enabled:false,label:`Next report available in ${z} day${z!==1?"s":""}`}}
    if(daysSince<12){const y=12-daysSince;return{enabled:true,label:`Report available (expires in ${y} day${y!==1?"s":""})`}}
    return{enabled:true,label:"Report available — download now"};
  })();
  const downloadReport=()=>{
    try{
      const report=window.buildPerformanceReport({history,rpp,sunlight,sleep,hydration,giDistress});
      const doc=window.renderReportPDF(report);
      doc.save(`performance-report-${today()}.pdf`);
      setLastReportWindowStart(today());
      setShowToast(true);clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setShowToast(false),2600);
    }catch(e){alert("Couldn't generate the report: "+e.message)}
  };
  const preview=(()=>{try{return window.buildPerformanceReport({history,rpp,sunlight,sleep,hydration,giDistress})}catch{return null}})();
  const t2Label={sun:"sun exposure",hydration:"hydration",sleep:"a well-slept night"};
  const bestT2=preview&&preview.tier2?Object.entries(preview.tier2).sort((a,b)=>b[1].confidence-a[1].confidence)[0]:null;
  const bestT3=preview&&preview.tier3&&preview.tier3.factors?Object.entries(preview.tier3.factors).sort((a,b)=>b[1].confidence-a[1].confidence)[0]:null;
  const bestGi=preview&&preview.gi&&preview.gi.triggers&&preview.gi.triggers.length>0?preview.gi.triggers[0]:null;
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:20}}>
      <p className="sub" style={{marginTop:0}}>Based on {activeDaysLogged} logged day{activeDaysLogged!==1?"s":""}</p>
      <button className="btn" disabled={!reportState.enabled} onClick={reportState.enabled?downloadReport:undefined} style={{width:"auto",flexShrink:0,padding:"11px 16px",fontSize:12,borderRadius:100,marginTop:0}}>⬇ Full report</button>
    </div>
    {!reportState.enabled&&<div className="info" style={{fontSize:13}}>{reportState.label}</div>}
    {showToast&&<div style={{background:"var(--ink)",color:"#fff",fontSize:12.5,fontWeight:500,padding:"10px 14px",borderRadius:12,marginBottom:16}}>✓ Detailed PDF report downloaded</div>}

    <h3 className="stit">Performance</h3>
    <div className="panel" style={{marginBottom:20,display:"flex",flexDirection:"column",gap:12}}>
      <div style={{fontSize:15,fontWeight:700,color:"var(--ink)",fontFamily:"var(--serif)"}}>Lifestyle &amp; performance</div>
      {bestT2?<>
        <div style={{fontSize:13,color:"var(--ink-soft)",lineHeight:1.5}}>On the {bestT2[1].nTrue} days you logged {t2Label[bestT2[0]]||bestT2[0]}, your average performance was <b style={{color:"var(--ink)"}}>{bestT2[1].meanTrue}</b> — {Math.abs(bestT2[1].delta)} points {bestT2[1].delta>0?"higher":"lower"} than the {bestT2[1].nFalse} days without ({bestT2[1].meanFalse}).</div>
        <div style={{display:"flex",gap:20,alignItems:"flex-end",height:64,padding:"0 10px"}}>
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}><div style={{width:40,borderRadius:"6px 6px 2px 2px",background:"var(--good)",height:`${Math.max(6,bestT2[1].meanTrue/10*100)}%`}}/><div style={{fontSize:10,color:"var(--ink-soft)"}}>with</div></div>
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6,height:"100%",justifyContent:"flex-end"}}><div style={{width:40,borderRadius:"6px 6px 2px 2px",background:"var(--bad)",height:`${Math.max(6,bestT2[1].meanFalse/10*100)}%`}}/><div style={{fontSize:10,color:"var(--ink-soft)"}}>without</div></div>
        </div>
      </>:<div style={{fontSize:13,color:"var(--gray)"}}>Not enough data yet to correlate lifestyle factors with performance.</div>}
    </div>

    <h3 className="stit">Sleep</h3>
    <div className="panel" style={{marginBottom:20,display:"flex",flexDirection:"column",gap:12}}>
      <div style={{fontSize:15,fontWeight:700,color:"var(--ink)",fontFamily:"var(--serif)"}}>Habits &amp; sleep</div>
      {bestT3?<>
        <div style={{fontSize:13,color:"var(--ink-soft)",lineHeight:1.5}}>{bestT3[1].wellRate!==undefined?
          `${bestT3[1].label} occurred on ${bestT3[1].wellRate}% of well-slept nights vs ${bestT3[1].poorRate}% of poor-sleep nights.`
          :`Well-slept nights averaged ${bestT3[1].wellMean} for ${bestT3[1].label.toLowerCase()}, vs ${bestT3[1].poorMean} on poor-sleep nights.`}</div>
        <div className="pbg" style={{height:10}}><div className="pf" style={{width:`${bestT3[1].wellRate!==undefined?bestT3[1].wellRate:Math.min(100,Math.round(preview.tier3.nWell/(preview.tier3.nWell+preview.tier3.nPoor)*100))}%`,background:"var(--good)"}}/></div>
      </>:<div style={{fontSize:13,color:"var(--gray)"}}>Not enough sleep data yet, or no factor showed a meaningful pattern.</div>}
    </div>

    <h3 className="stit">GI distress</h3>
    <div className="panel" style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{fontSize:15,fontWeight:700,color:"var(--ink)",fontFamily:"var(--serif)"}}>Nutrition &amp; GI distress</div>
      {bestGi?<>
        <div style={{fontSize:13,color:"var(--ink-soft)",lineHeight:1.5}}>"{bestGi.word}" appeared in {bestGi.total} meals; {bestGi.giCount} of those were on days you reported GI distress ({Math.round(bestGi.giCount/bestGi.total*100)}%).</div>
        <div className="pbg" style={{height:10}}><div className="pf" style={{width:`${bestGi.confidence}%`,background:"var(--bad)"}}/></div>
      </>:<div style={{fontSize:13,color:"var(--gray)"}}>{preview&&preview.gi?"A pattern was logged but no food keyword stood out yet.":"Not enough GI-distress reports yet to look for a pattern."}</div>}
    </div>
  </div>
}

/* ── MAIN APP ── */
function App(){
  const[userKey_,setUserKey]=useState(()=>ls("nt-user-key",null));
  useEffect(()=>{currentUserKey=userKey_},[userKey_]);
  const[profile,setProfile]=useState(()=>ls("nt-profile",null));
  const[tab,setTab]=useState("log");
  const[onboardingDone,setOnboardingDone]=useState(false);
  const[editProfile,setEditProfile]=useState(false);
  const[editGoal,setEditGoal]=useState(false);
  const[isAdmin,setIsAdmin]=useState(false);
  const[newFirstName,setNewFirstName]=useState("");
  const[newLastName,setNewLastName]=useState("");
  const[newKey,setNewKey]=useState("");
  const[meals,setMeals_]=useState(()=>{const d=ls("nt-meals",{});return d.date===today()?(d.meals||[]):[]});
  const[templates,setTemplates_]=useState(()=>ls("nt-templates",[]));
  const[history,setHistory_]=useState(()=>ls("nt-history",{}));
  const[sunlight,setSunlight_]=useState(()=>ls("nt-sunlight",{}));
  const[giDistress,setGiDistress_]=useState(()=>ls("nt-gi",{}));
  const[rpp,setRpp_]=useState(()=>ls("nt-rpp",{}));
  const[skipped,setSkipped_]=useState(()=>ls("nt-skipped",{}));
  const[hydration,setHydration_]=useState(()=>ls("nt-hydration",{}));
  const[sleep,setSleep_]=useState(()=>ls("nt-sleep",{}));
  const[lastReportWindowStart,setLastReportWindowStart_]=useState(()=>ls("nt-last-report-window",null));
  const[showWeightModal,setShowWeightModal]=useState(false);
  const[weightInput,setWeightInput]=useState("");
  const[weightErr,setWeightErr]=useState(null);
  const[showSleepPrompt,setShowSleepPrompt]=useState(false);
  const[syncing,setSyncing]=useState(false);

  // Pull the latest data from the cloud and merge it in. Runs on login/mount, and
  // again whenever the app comes back into view — otherwise a device left open in the
  // background would never see changes made on another device.
  const fetchAndMergeCloud=useCallback(()=>{
    if(!userKey_)return;
    setSyncing(true);
    // Try current key first, then try migrating old key (without PIN) to new format
    const tryKey=async(key)=>{
      const data=await cloudGet(key);
      if(data&&data.profile)return data;
      // Migration: if key has PIN format but no data, try old format without PIN
      const oldKey=key.replace(/-\d{4}$/,"");
      if(oldKey!==key){const old=await cloudGet(oldKey);if(old&&old.profile){await cloudPut(key,old);return old}}
      return null;
    };
    tryKey(userKey_).then(data=>{
      if(data&&data.profile){
        setProfile(data.profile);lss("nt-profile",data.profile);
        const m=data.meals||{};
        const hist={...(data.history||{})};
        let todayMeals=[];
        if(m.meals&&m.meals.length>0){
          // Check individual meal dates if available, otherwise use container date
          const reallyToday=m.meals.filter(meal=>!meal.date||meal.date===today());
          const stale=m.meals.filter(meal=>meal.date&&meal.date!==today());
          if(stale.length>0){
            // Move stale meals to history under their date
            stale.forEach(meal=>{const d=meal.date;hist[d]=[...(hist[d]||[]),meal]});
          }
          if(m.date===today()&&reallyToday.length>0){
            todayMeals=reallyToday;
          }else if(m.date!==today()&&m.meals.length>0&&stale.length===0){
            // Old meals without date field - move all to history under container date
            hist[m.date]=[...(hist[m.date]||[]),...m.meals];
          }else{
            todayMeals=reallyToday;
          }
        }
        setMeals_(todayMeals);lss("nt-meals",{meals:todayMeals,date:today()});
        setTemplates_(data.templates||[]);lss("nt-templates",data.templates||[]);
        // Clean history - move misplaced meals to their correct date and deduplicate
        const cleanHist={};
        Object.entries(hist).forEach(function(entry){
          const hDate=entry[0];const hMeals=entry[1];
          (hMeals||[]).forEach(function(meal){
            const correctDate=meal.date||hDate;
            if(!cleanHist[correctDate])cleanHist[correctDate]=[];
            cleanHist[correctDate].push(meal);
          });
        });
        // Deduplicate meals per day by mealName+time+calories
        Object.keys(cleanHist).forEach(function(d){
          const seen={};const unique=[];
          cleanHist[d].forEach(function(meal){
            const key=(meal.mealName||"")+"_"+(meal.time||"")+"_"+Math.round(meal.calories||0);
            if(!seen[key]){seen[key]=true;unique.push(meal)}
          });
          cleanHist[d]=unique;
        });
        // Keep only last 180 days
        const keep=last180();const trimmed={};
        Object.keys(cleanHist).forEach(function(d){if(keep.includes(d))trimmed[d]=cleanHist[d]});
        setHistory_(trimmed);lss("nt-history",trimmed);
        setSunlight_(data.sunlight||{});lss("nt-sunlight",data.sunlight||{});
        setGiDistress_(data.gi||{});lss("nt-gi",data.gi||{});
        setRpp_(data.rpp||{});lss("nt-rpp",data.rpp||{});
        setSkipped_(data.skipped||{});lss("nt-skipped",data.skipped||{});
        setHydration_(data.hydration||{});lss("nt-hydration",data.hydration||{});
        setSleep_(data.sleep||{});lss("nt-sleep",data.sleep||{});
        setLastReportWindowStart_(data.lastReportWindow||null);lss("nt-last-report-window",data.lastReportWindow||null);
        cloudPut(userKey_,{profile:data.profile,meals:{meals:todayMeals,date:today()},templates:data.templates||[],history:trimmed,sunlight:data.sunlight||{},gi:data.gi||{},rpp:data.rpp||{},skipped:data.skipped||{},hydration:data.hydration||{},sleep:data.sleep||{},lastReportWindow:data.lastReportWindow||null})
      }
      setSyncing(false);
    }).catch(function(){setSyncing(false)});
  },[userKey_]);

  useEffect(()=>{fetchAndMergeCloud()},[userKey_]);

  // Remaining meal-analysis balance, shown as a counter in the Log tab. Refreshed on
  // login and after each analysis; the worker is the source of truth.
  const[quota,setQuota]=useState(null);
  const refreshQuota=useCallback(()=>{
    if(!userKey_)return;
    fetch(`${API_URL}/quota?key=${encodeURIComponent(userKey_)}`).then(r=>r.json()).then(d=>{if(d&&d.meal)setQuota(d)}).catch(()=>{});
  },[userKey_]);
  useEffect(()=>{refreshQuota()},[userKey_]);

  // Re-pull from the cloud whenever the app regains focus (tab switch, unlocking the
  // phone, reopening a PWA) — not just on a fresh page load.
  useEffect(()=>{
    const onVisible=()=>{if(document.visibilityState==="visible")fetchAndMergeCloud()};
    document.addEventListener("visibilitychange",onVisible);
    return()=>document.removeEventListener("visibilitychange",onVisible);
  },[fetchAndMergeCloud]);

  const DT=profile?calcTargets(profile):{calories:2500,protein:120,fat:70,carbs:300,fiber:30,iron:8,zinc:11,magnesium:400,potassium:3500,vitaminD:2000,vitaminB6:1.5,vitaminB12:2.4,folate:400,calcium:1000,omega3:1.5};
  const prompt=profile?buildPrompt(profile):"";

  const syncTimer=useRef(null);
  const syncToCloud=useCallback((opts)=>{if(!userKey_)return;cloudPut(userKey_,{profile:ls("nt-profile",null),meals:ls("nt-meals",{}),templates:ls("nt-templates",[]),history:ls("nt-history",{}),sunlight:ls("nt-sunlight",{}),gi:ls("nt-gi",{}),rpp:ls("nt-rpp",{}),skipped:ls("nt-skipped",{}),hydration:ls("nt-hydration",{}),sleep:ls("nt-sleep",{}),lastReportWindow:ls("nt-last-report-window",null)},opts)},[userKey_]);
  const scheduleSync=()=>{if(syncTimer.current)clearTimeout(syncTimer.current);syncTimer.current=setTimeout(syncToCloud,3000)};

  // A change can be sitting in the 3s debounce when the tab is closed or backgrounded —
  // very common right after logging a meal — and that pending write would otherwise be
  // lost. Flush it immediately (keepalive so it survives the page tearing down) whenever
  // the app is hidden, covers both closing the tab and backgrounding on mobile.
  useEffect(()=>{
    const flush=()=>{
      if(syncTimer.current){clearTimeout(syncTimer.current);syncTimer.current=null;syncToCloud({keepalive:true})}
    };
    const onVisibility=()=>{if(document.visibilityState==="hidden")flush()};
    document.addEventListener("visibilitychange",onVisibility);
    window.addEventListener("pagehide",flush);
    return()=>{document.removeEventListener("visibilitychange",onVisibility);window.removeEventListener("pagehide",flush)};
  },[syncToCloud]);

  const update=(nm)=>{const t=today();setMeals_(nm);lss("nt-meals",{meals:nm,date:t});setHistory_(p=>{const u={...p,[t]:nm};const k=last180();const tr={};k.forEach(d=>{if(u[d])tr[d]=u[d]});lss("nt-history",tr);scheduleSync();return tr})};
  const wrap=fn=>{const nm=typeof fn==="function"?fn(meals):fn;update(nm)};
  useEffect(()=>{lss("nt-templates",templates);scheduleSync()},[templates]);
  useEffect(()=>{if(profile){lss("nt-profile",profile);scheduleSync()}},[profile]);
  const toggleSun=(date)=>{setSunlight_(p=>{const u={...p,[date]:!p[date]};lss("nt-sunlight",u);scheduleSync();return u})};
  const toggleGi=(date)=>{setGiDistress_(p=>{const u={...p};if(u[date]){delete u[date]}else{u[date]=nowTime()}lss("nt-gi",u);scheduleSync();return u})};
  const setSleep=(date,val)=>{setSleep_(p=>{const u={...p,[date]:val};lss("nt-sleep",u);scheduleSync();return u})};
  const setLastReportWindowStart=(v)=>{setLastReportWindowStart_(v);lss("nt-last-report-window",v);scheduleSync()};
  const setRpp=(date,val)=>{setRpp_(p=>{const u={...p,[date]:val};lss("nt-rpp",u);scheduleSync();return u})};
  const toggleSkip=(date,idx)=>{setSkipped_(p=>{const daySkips=p[date]||[];const u={...p,[date]:daySkips.includes(idx)?daySkips.filter(x=>x!==idx):[...daySkips,idx]};lss("nt-skipped",u);scheduleSync();return u})};
  const toggleHydration=(date)=>{setHydration_(p=>{const u={...p,[date]:!p[date]};lss("nt-hydration",u);scheduleSync();return u})};
  const getActiveBaseline=(date)=>{const daySkips=skipped[date]||[];return sum(templates.filter((_,i)=>!daySkips.includes(i)))};
  const addToday=m=>update([...meals,{...m}]);
  const addHist=(date,meal)=>{if(date===today()){addToday(meal)}else{setHistory_(p=>{const u={...p,[date]:[...(p[date]||[]),meal]};lss("nt-history",u);scheduleSync();return u})}};
  const delHist=(date,idx)=>{if(date===today()){update(meals.filter((_,i)=>i!==idx))}else{setHistory_(p=>{const dm=[...(p[date]||[])];dm.splice(idx,1);const u={...p};if(dm.length)u[date]=dm;else delete u[date];lss("nt-history",u);scheduleSync();return u})}};
  // Patch one meal in place (used to edit a logged meal's time on any day).
  const updHist=(date,idx,patch)=>{if(date===today()){update(meals.map((m,i)=>i===idx?{...m,...patch}:m))}else{setHistory_(p=>{const dm=[...(p[date]||[])];if(!dm[idx])return p;dm[idx]={...dm[idx],...patch};const u={...p,[date]:dm};lss("nt-history",u);scheduleSync();return u})}};

  // Prompt "Did you sleep well?" once per day — only after cloud sync finishes,
  // so a fresh device doesn't ask again for an answer that's already saved in the cloud.
  useEffect(()=>{if(userKey_&&profile&&!syncing&&sleep[today()]===undefined)setShowSleepPrompt(true);else if(sleep[today()]!==undefined)setShowSleepPrompt(false)},[userKey_,profile,syncing,sleep]);

  // 10-day weight check — sequenced to appear only after the sleep prompt has been
  // resolved (answered or dismissed), never simultaneously with it.
  const weightCheckDue=profile?.lastCalibration?Math.floor((new Date()-new Date(profile.lastCalibration))/(1000*60*60*24))>=10:false;
  useEffect(()=>{
    if(!profile?.lastCalibration||showSleepPrompt){setShowWeightModal(false);return}
    const diff=Math.floor((new Date()-new Date(profile.lastCalibration))/(1000*60*60*24));
    setShowWeightModal(diff>=10);
  },[profile,showSleepPrompt]);

  const submitWeightCheck=(rawWeight)=>{
    const newWeight=parseFloat(rawWeight);
    if(!newWeight||newWeight<=0||newWeight>400){setWeightErr("Enter a valid weight in kg.");return}
    setWeightErr(null);
    const oldWeight=profile.calibWeight??profile.weight;
    const diffDays=Math.max(Math.floor((new Date()-new Date(profile.lastCalibration))/(1000*60*60*24)),1);
    const loggedDates=datesSince(profile.lastCalibration).filter(d=>history[d]&&history[d].length>0);
    let mult=profile.multiplier||1,msg;
    if(loggedDates.length<2){
      msg="Weight saved. Keep logging meals so the next check can fine-tune your portions.";
    }else{
      const baseline=sum(templates);
      const avgLoggedCalories=loggedDates.reduce((s,d)=>s+sum(history[d]).calories,0)/loggedDates.length+(baseline.calories||0);
      const maintenance=calcTDEE(profile);
      const expectedDeltaKg=(avgLoggedCalories-maintenance)*diffDays/7700;
      const observedDeltaKg=newWeight-oldWeight;
      const gapKg=observedDeltaKg-expectedDeltaKg;
      if(Math.abs(gapKg)<0.3){
        msg="Tracking looks accurate — your weight change matches your logged intake.";
      }else if(gapKg>0){
        mult=Math.min(mult*1.15,2.0);
        msg=`Your weight didn't move as much as your logged intake suggested — meal sizes were likely underestimated. Portions increased to ${mult.toFixed(2)}x for future analyses.`;
      }else{
        mult=Math.max(mult*0.9,0.7);
        msg=`You lost more than your logged intake suggested — meal sizes were likely overestimated. Portions decreased to ${mult.toFixed(2)}x for future analyses.`;
      }
    }
    setProfile({...profile,weight:newWeight,calibWeight:newWeight,multiplier:mult,lastCalibration:today()});
    setShowWeightModal(false);setWeightInput("");alert(msg);
  };

  if(!userKey_||!profile){
    if(isAdmin)return<AdminPage onLogout={()=>setIsAdmin(false)}/>;
    if(newKey&&!onboardingDone)return<OnboardingSlides onDone={()=>setOnboardingDone(true)}/>;
    if(newKey)return<ProfileSetup firstName={newFirstName} lastName={newLastName} onSave={p=>{setProfile(p);lss("nt-profile",p);setUserKey(newKey);lss("nt-user-key",newKey);cloudPut(newKey,{profile:p,meals:{},templates:[],history:{},sunlight:{},gi:{},rpp:{},skipped:{},hydration:{}})}}/>;
    return<LoginScreen onLogin={(key,data)=>{setUserKey(key);lss("nt-user-key",key);if(data&&data.profile){setProfile(data.profile);lss("nt-profile",data.profile)}}} onCreate={(fn,ln,pin,key)=>{setNewFirstName(fn);setNewLastName(ln);setNewKey(key)}} onAdmin={()=>setIsAdmin(true)}/>;
  }

  if(editProfile||editGoal)return<div><button className="btn btn-o btn-s" onClick={()=>{setEditProfile(false);setEditGoal(false)}} style={{marginBottom:16}}>← Back</button><ProfileSetup onSave={p=>{setProfile(p);setEditProfile(false);setEditGoal(false)}} initial={profile}/></div>;

  const tabsDef=[["log","Log"],["summary","Summary"],["history","History"],["report","Report"]];
  // The page title lives here rather than in each tab, so the account actions can sit
  // beside it on one row instead of needing a separate app-title bar above.
  const TAB_TITLES={log:"Log today meal",summary:"Today summary",history:"History",report:"Weekly report"};
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:20}}>
      <h1 className="h-page">{TAB_TITLES[tab]}</h1>
      <div style={{display:"flex",gap:16,flexShrink:0}}>
        <button onClick={()=>{setUserKey(null);lss("nt-user-key",null);setProfile(null)}} style={{background:"none",border:"none",fontSize:21,lineHeight:1,cursor:"pointer",padding:2}} title="Log out">🚪</button>
        <button onClick={()=>setEditProfile(true)} style={{background:"none",border:"none",fontSize:21,lineHeight:1,cursor:"pointer",padding:2}} title="Edit profile">✏️</button>
      </div>
    </div>

    {syncing&&<div style={{textAlign:"center",padding:10,marginBottom:16,fontSize:13,color:"var(--ink-soft)"}}>☁️ Syncing data…</div>}

    {showSleepPrompt&&<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.45)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:20,padding:28,maxWidth:360,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>😴</div>
        <div style={{fontSize:19,fontWeight:700,marginBottom:6,fontFamily:"var(--serif)"}}>Did you sleep well tonight?</div>
        <p style={{fontSize:13,color:"var(--ink-soft)",marginBottom:24}}>This helps correlate rest with your performance over time.</p>
        <div style={{display:"flex",gap:12}}>
          <button onClick={()=>{setSleep(today(),true);setShowSleepPrompt(false)}} className="btn" style={{background:"var(--good)",margin:0,flex:1}}>✓ Yes</button>
          <button onClick={()=>{setSleep(today(),false);setShowSleepPrompt(false)}} className="btn" style={{background:"var(--bad)",margin:0,flex:1}}>✗ No</button>
        </div>
        <button onClick={()=>setShowSleepPrompt(false)} style={{background:"none",border:"none",color:"var(--gray)",cursor:"pointer",fontSize:13,marginTop:16}}>Ask me later</button>
      </div>
    </div>}

    {showWeightModal&&<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.45)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:20,padding:28,maxWidth:360,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>⚖️</div>
        <div style={{fontSize:19,fontWeight:700,marginBottom:6,fontFamily:"var(--serif)"}}>10-day weight check</div>
        <p style={{fontSize:13,color:"var(--ink-soft)",marginBottom:20}}>Enter your current weight so the app can fine-tune your portion estimates.</p>
        <input type="number" step="0.1" value={weightInput} onChange={e=>setWeightInput(e.target.value)} placeholder={`Weight (kg) — last: ${profile.calibWeight??profile.weight}kg`} style={{marginBottom:weightErr?4:16,textAlign:"center",fontSize:18,fontWeight:600}}/>
        {weightErr&&<p style={{fontSize:12,color:"var(--bad)",marginBottom:12}}>{weightErr}</p>}
        <button className="btn btn-rose" onClick={()=>submitWeightCheck(weightInput)}>Save weight</button>
        <button style={{background:"none",border:"none",color:"var(--gray)",cursor:"pointer",fontSize:13,marginTop:14}} onClick={()=>{setShowWeightModal(false);setWeightErr(null)}}>Skip for now</button>
      </div>
    </div>}

    {weightCheckDue&&!showWeightModal&&<div className="panel" style={{background:"var(--rose-soft)",borderColor:"var(--rose)",marginBottom:24}}>
      <div style={{fontSize:14,fontWeight:600,color:"var(--rose)",marginBottom:8}}>⚖️ 10-day weight check pending</div>
      <p style={{fontSize:13,color:"var(--ink-soft)",marginBottom:12}}>Log your current weight to fine-tune future portion estimates.</p>
      <div className="fr" style={{gap:8}}>
        <input type="number" step="0.1" value={weightInput} onChange={e=>setWeightInput(e.target.value)} placeholder="Weight (kg)" style={{flex:1}}/>
        <button className="btn btn-rose btn-s" style={{marginTop:0}} onClick={()=>submitWeightCheck(weightInput)}>Save</button>
      </div>
      {weightErr&&<p style={{fontSize:12,color:"var(--bad)",marginTop:6}}>{weightErr}</p>}
    </div>}

    {tab==="log"&&<LogPage meals={meals} setMeals={wrap} templates={templates} setTemplates={v=>{const r=typeof v==="function"?v(templates):v;setTemplates_(r);lss("nt-templates",r);scheduleSync()}} skipped={skipped[today()]||[]} toggleSkip={idx=>toggleSkip(today(),idx)} sun={!!sunlight[today()]} toggleSun={()=>toggleSun(today())} hydrated={!!hydration[today()]} toggleHydration={()=>toggleHydration(today())} gi={!!giDistress[today()]} toggleGi={()=>toggleGi(today())} sleep={sleep[today()]} setSleep={v=>setSleep(today(),v)} rpp={rpp[today()]||0} setRpp={v=>setRpp(today(),v)} profile={profile} DT={DT} prompt={prompt} quota={quota} refreshQuota={refreshQuota}/>}
    {tab==="summary"&&<SummaryPage meals={meals} setMeals={wrap} sunlight={sunlight} templates={templates} setTemplates={v=>{const r=typeof v==="function"?v(templates):v;setTemplates_(r);lss("nt-templates",r);scheduleSync()}} skipped={skipped[today()]||[]} toggleSkip={idx=>toggleSkip(today(),idx)} profile={profile} DT={DT} prompt={prompt} refreshQuota={refreshQuota}/>}
    {tab==="history"&&<HistoryPage history={history} onAdd={addHist} onDel={delHist} onUpd={updHist} sunlight={sunlight} giDistress={giDistress} hydration={hydration} rpp={rpp} setRpp={setRpp} sleep={sleep} templates={templates} skipped={skipped} DT={DT} prompt={prompt} profile={profile}/>}
    {tab==="report"&&<ReportPage history={history} rpp={rpp} sunlight={sunlight} sleep={sleep} hydration={hydration} giDistress={giDistress} lastReportWindowStart={lastReportWindowStart} setLastReportWindowStart={setLastReportWindowStart}/>}

    <div className="tabbar">
      {tabsDef.map(([key,label])=><button key={key} className={"tab"+(tab===key?" on":"")} onClick={()=>setTab(key)}>
        <div className="tab-dot"/>
        <div className="tab-label">{label}</div>
      </button>)}
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
