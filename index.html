<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meal Analyzer</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#fff;-webkit-font-smoothing:antialiased}
    .app{max-width:640px;margin:0 auto;padding:20px 16px 40px}
    h1{font-size:24px;font-weight:600}
    .sub{font-size:14px;color:#666;margin-top:4px}
    .nav{display:flex;gap:6px;margin:20px 0 24px;background:#f5f5f5;padding:4px;border-radius:10px}
    .nav button{flex:1;padding:12px 0;border:none;cursor:pointer;font-size:14px;font-weight:500;border-radius:8px;transition:all .2s;background:transparent;color:#888}
    .nav button.on{background:#1a1a1a;color:#fff}
    .tog{display:flex;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;margin-bottom:16px}
    .tog button{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;background:#fff;color:#666}
    .tog button.on{background:#1a1a1a;color:#fff}
    textarea{width:100%;min-height:90px;padding:14px;border:1px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none}
    textarea:focus{border-color:#999}
    input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:#999}
    .btn{padding:12px 0;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-s{padding:6px 14px;font-size:13px;width:auto;margin-top:0}
    .btn-o{background:#fff;color:#666;border:1px solid #e5e5e5}
    .btn-d{background:#dc2626;color:#fff;border:none}
    .btn-do{background:#fff;color:#dc2626;border:1px solid #fca5a5}
    .btn-x{background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
    .btn-x:hover{color:#999}
    .upl{background:#fafafa;border-radius:12px;border:2px dashed #d4d4d4;padding:32px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
    .upl:hover{border-color:#999}
    .prev{width:100%;max-height:280px;object-fit:cover;border-radius:12px;border:1px solid #e5e5e5}
    .card{background:#fafafa;border-radius:8px;padding:12px;text-align:center}
    .card-l{font-size:11px;color:#888;font-weight:500;margin-bottom:4px}
    .card-v{font-size:20px;font-weight:600}
    .card-s{font-size:11px;color:#bbb;margin-top:2px}
    .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px}
    .gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:32px}
    .pbg{width:100%;height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden}
    .pf{height:100%;border-radius:4px;transition:width .4s ease}
    .stit{font-size:16px;font-weight:600;margin:0 0 16px}
    .slab{font-size:13px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px}
    .mi{background:#fafafa;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid #f0f0f0}
    .mn{font-weight:500;font-size:14px}
    .mm{font-size:12px;color:#888;margin-top:4px}
    .err{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#dc2626}
    .info{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;margin-bottom:24px;font-size:13px;color:#92400e;line-height:1.5}
    .defb{background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:16px;margin-bottom:24px}
    .deft{font-size:14px;font-weight:600;color:#dc2626;margin-bottom:8px}
    .deftags{display:flex;flex-wrap:wrap;gap:8px}
    .deftag{font-size:13px;background:#fff;border:1px solid #fca5a5;padding:4px 12px;border-radius:6px;color:#dc2626;font-weight:500}
    .dc{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:12px}
    .pill{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;display:inline-block;margin:2px}
    .sb{background:#f5f5f5;border-radius:12px;padding:24px;margin-bottom:24px}
    .si{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:monospace;outline:none;margin:12px 0}
    .fr{display:flex;gap:8px}
    .fc{display:flex;flex-direction:column;gap:8px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:13px;font-weight:500;color:#666;margin-bottom:6px}
    .profile-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s}
    .profile-card:hover{border-color:#999;background:#fafafa}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp{display:inline-block;width:20px;height:20px;border:2px solid #e5e5e5;border-top-color:#1a1a1a;border-radius:50%;animation:spin .6s linear infinite}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useRef}=React;

const MICROS=[{name:"Iron",key:"iron",unit:"mg",target:8},{name:"Zinc",key:"zinc",unit:"mg",target:11},{name:"Magnesium",key:"magnesium",unit:"mg",target:400},{name:"Potassium",key:"potassium",unit:"mg",target:3500},{name:"Vit D",key:"vitaminD",unit:"IU",target:2000},{name:"B6",key:"vitaminB6",unit:"mg",target:1.5},{name:"B12",key:"vitaminB12",unit:"mcg",target:2.4},{name:"Folate",key:"folate",unit:"mcg",target:400},{name:"Calcium",key:"calcium",unit:"mg",target:1000},{name:"Omega-3",key:"omega3",unit:"g",target:1.5}];
const MK=["calories","protein","fat","carbs","fiber"];
const AK=[...MK,...MICROS.map(m=>m.key)];

function calcTDEE(p){
  let bmr;
  if(p.gender==="male") bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)+5;
  else bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)-161;
  const af=p.trainingHours<=0.5?1.4:p.trainingHours<=1?1.6:p.trainingHours<=1.5?1.7:p.trainingHours<=2?1.8:p.trainingHours<=3?1.9:2.0;
  return Math.round(bmr*af);
}

function calcTargets(p){
  const cal=calcTDEE(p);
  const prot=Math.round(p.weight*2);
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.round((cal-prot*4-fat*9)/4);
  const fiber=p.gender==="male"?35:28;
  const t={calories:cal,protein:prot,fat,carbs,fiber};
  MICROS.forEach(m=>{t[m.key]=m.target});
  if(p.gender==="female"){t.iron=18}
  return t;
}

function buildPrompt(profile,multiplier){
  const pm=multiplier||1;
  const portionNote=pm>1?`\nIMPORTANT: This user's portions have been calibrated. Multiply all unspecified portion estimates by ${pm.toFixed(2)}. For example if you'd normally estimate 200g of meat, estimate ${Math.round(200*pm)}g instead.`:"";
  return `You are a precise nutrition calculator. Analyze this meal and estimate nutritional content.

CRITICAL portion size references:
- 1 tablespoon (spoon/cucchiaio) of oil = 13-14g
- 1 teaspoon of oil = 4-5g
- 1 tablespoon of butter = 14g
- 1 egg (medium) = 50g edible
- 1 cup of rice (cooked) = 180g
- 1 cup of pasta (cooked) = 140g
- 1 slice of bread = 30-35g
- "some" or unspecified = GENEROUS portions for this ${profile.weight||77}kg active ${profile.gender||"male"} athlete:
  - "some pasta" = 120-150g dry (250-300g cooked)
  - "rice" = 150g dry (300g+ cooked)
  - "salad" = 200g+ vegetables
  - "chicken/meat/fish" = 200-250g
  - "potatoes" = 250-300g
  - When in doubt, estimate HIGHER
- "spoon" = tablespoon unless specified${portionNote}

SUPPLEMENTS — CRITICAL:
- When user specifies per-capsule amount, trust it directly.
- When product mentions DAILY DOSE and capsule count, CALCULATE per-capsule:
  STEP 1: capsules_per_day = total_capsules / days_supply
  STEP 2: per_capsule = daily_dose / capsules_per_day
  EXAMPLE: "150mg daily dose, 90 capsules for 30 days" → 90/30=3/day → 150/3=50mg per capsule
- "daily dose" is NOT per capsule — always divide

UNIT RULES:
- omega3 in GRAMS (1000mg = 1g)
- iron/zinc/magnesium/potassium/calcium in mg
- vitaminD in IU, vitaminB6 in mg, vitaminB12/folate in mcg

When exact grams given, use precisely. When vague, estimate GENEROUSLY.

Respond ONLY with JSON (no markdown):
{"mealName":"short description","calories":0,"protein":0,"fat":0,"carbs":0,"fiber":0,"iron":0,"zinc":0,"magnesium":0,"potassium":0,"vitaminD":0,"vitaminB6":0,"vitaminB12":0,"folate":0,"calcium":0,"omega3":0}`;
}

function today(){return new Date().toISOString().slice(0,10)}
function last10(){const d=[];for(let i=0;i<10;i++){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().slice(0,10))}return d}
function sum(meals){const t={};AK.forEach(k=>t[k]=0);(meals||[]).forEach(m=>AK.forEach(k=>t[k]+=(m[k]||0)));return t}
function sunVitD(dateStr){const m=new Date(dateStr+"T12:00:00").getMonth();return(m>=10||m<=1)?1000:2000}
function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

async function analyze(text,img,url,prompt){
  const c=[];
  if(img){const mt=img.startsWith("data:image/png")?"image/png":"image/jpeg";c.push({type:"image",source:{type:"base64",media_type:mt,data:img.split(",")[1]}})}
  c.push({type:"text",text:text?`${prompt}\n\nMeal: ${text}`:prompt});
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:c}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  const raw=d.content[0].text;const match=raw.match(/\{[\s\S]*\}/);
  if(!match)throw new Error("No JSON found in response");
  return JSON.parse(match[0]);
}

function PB({value,max,color}){const p=Math.min(Math.round((value/max)*100),100);return<div className="pbg"><div className="pf" style={{width:`${p}%`,background:color}}/></div>}
function MC({name,value,target,unit}){
  const p=Math.round((value/target)*100),met=p>=100;
  return<div style={{background:met?"#f0fdf4":"#fafafa",border:`1px solid ${met?"#86efac":"#e5e5e5"}`,borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
    <div style={{fontSize:12,color:"#666",fontWeight:500,marginBottom:4}}>{name}</div>
    <div style={{fontSize:15,fontWeight:600}}>{Math.round(value*10)/10}</div>
    <div style={{fontSize:11,color:"#999",marginTop:2}}>/ {target} {unit}</div>
    <div style={{fontSize:11,color:met?"#16a34a":p>=70?"#ca8a04":"#dc2626",marginTop:4,fontWeight:500}}>{p}%</div>
  </div>
}

/* ── PROFILE SETUP ── */
function ProfileSetup({onSave,initial}){
  const[name,setName]=useState(initial?.name||"");
  const[age,setAge]=useState(initial?.age||30);
  const[height,setHeight]=useState(initial?.height||175);
  const[weight,setWeight]=useState(initial?.weight||75);
  const[gender,setGender]=useState(initial?.gender||"male");
  const[hours,setHours]=useState(initial?.trainingHours||1);
  const p={name,age:+age,height:+height,weight:+weight,gender,trainingHours:+hours};
  const tdee=calcTDEE(p);
  const targets=calcTargets(p);
  return<div>
    <h2 style={{fontSize:20,fontWeight:600,marginBottom:20}}>{initial?"Edit profile":"Create your profile"}</h2>
    <div className="field"><label>Name</label><input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Your name"/></div>
    <div className="fr" style={{gap:12}}>
      <div className="field" style={{flex:1}}><label>Age</label><input type="number" value={age} onChange={e=>setAge(e.target.value)}/></div>
      <div className="field" style={{flex:1}}><label>Height (cm)</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)}/></div>
      <div className="field" style={{flex:1}}><label>Weight (kg)</label><input type="number" value={weight} onChange={e=>setWeight(e.target.value)}/></div>
    </div>
    <div className="fr" style={{gap:12}}>
      <div className="field" style={{flex:1}}><label>Gender</label><select value={gender} onChange={e=>setGender(e.target.value)}><option value="male">Male</option><option value="female">Female</option></select></div>
      <div className="field" style={{flex:1}}><label>Training (h/day)</label><input type="number" step="0.5" min="0" max="5" value={hours} onChange={e=>setHours(e.target.value)}/></div>
    </div>
    <div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:12,padding:16,marginBottom:20}}>
      <div style={{fontSize:14,fontWeight:600,color:"#16a34a",marginBottom:8}}>Calculated daily targets</div>
      <div style={{fontSize:13,color:"#333",lineHeight:1.8}}>
        Calories: <strong>{tdee} kcal</strong> · Protein: <strong>{targets.protein}g</strong> · Fat: <strong>{targets.fat}g</strong> · Carbs: <strong>{targets.carbs}g</strong> · Fiber: <strong>{targets.fiber}g</strong>
      </div>
    </div>
    <button className="btn" onClick={()=>{if(!name.trim())return;onSave({...p,id:initial?.id||Date.now().toString(),multiplier:initial?.multiplier||1,lastCalibration:initial?.lastCalibration||today()})}} disabled={!name.trim()}>{initial?"Save changes":"Create profile"}</button>
  </div>
}

/* ── PROFILE SELECTOR ── */
function ProfileSelector({profiles,onSelect,onCreate}){
  return<div>
    <h1 style={{marginBottom:8}}>Meal Analyzer</h1>
    <p className="sub" style={{marginBottom:28}}>Select your profile or create a new one</p>
    <div className="fc" style={{gap:12,marginBottom:20}}>
      {profiles.map(p=>{const t=calcTargets(p);return<div key={p.id} className="profile-card" onClick={()=>onSelect(p.id)}>
        <div style={{fontSize:18,fontWeight:600,marginBottom:4}}>{p.name}</div>
        <div style={{fontSize:13,color:"#888"}}>{p.age}y, {p.height}cm, {p.weight}kg, {p.gender}, {p.trainingHours}h/day</div>
        <div style={{fontSize:12,color:"#16a34a",marginTop:6}}>{t.calories} kcal · {t.protein}g protein</div>
      </div>})}
    </div>
    <button className="btn" onClick={onCreate}>+ New profile</button>
  </div>
}

/* ── CALIBRATION PROMPT ── */
function CalibrationPrompt({profile,onResult,onDismiss}){
  return<div style={{background:"#eff6ff",border:"1px solid #93c5fd",borderRadius:12,padding:20,marginBottom:24}}>
    <div style={{fontSize:16,fontWeight:600,color:"#1d4ed8",marginBottom:8}}>10-day calibration check</div>
    <p style={{fontSize:14,color:"#333",lineHeight:1.5,marginBottom:16}}>It's been 10 days since your last calibration. Have you noticed any weight change?</p>
    <div className="fc" style={{gap:8}}>
      <button className="btn" style={{background:"#1d4ed8"}} onClick={()=>onResult("lost")}>I lost weight</button>
      <button className="btn btn-o" onClick={()=>onResult("same")}>Weight is the same</button>
      <button className="btn btn-o" onClick={()=>onResult("gained")}>I gained weight</button>
      <button style={{background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:13,marginTop:4}} onClick={onDismiss}>Skip for now</button>
    </div>
  </div>
}

/* ── TODAY PAGE ── */
function TodayPage({meals,setMeals,url,sun,toggleSun,history,sunlight,templates,profile,DT,prompt}){
  const[mode,setMode]=useState("text"),[txt,setTxt]=useState(""),[imgP,setImgP]=useState(null),[img64,setImg64]=useState(null),[ld,setLd]=useState(false),[err,setErr]=useState(null),[cfm,setCfm]=useState(false);
  const[suggestions,setSuggestions]=useState(null),[sugIdx,setSugIdx]=useState(0),[sugLd,setSugLd]=useState(false);
  const tot=sum(meals);
  const doPhoto=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setImg64(ev.target.result);setImgP(URL.createObjectURL(f))};r.readAsDataURL(f)};
  const doAnalyze=async()=>{if(mode==="text"&&!txt.trim())return;if(mode==="photo"&&!img64)return;setLd(true);setErr(null);try{const m=await analyze(mode==="text"?txt:null,mode==="photo"?img64:null,url,prompt);setMeals(p=>[...p,m]);setTxt("");setImgP(null);setImg64(null)}catch(e){setErr("Failed: "+e.message)}finally{setLd(false)}};
  const ml=m=>`${Math.round(m.calories)} cal · P:${Math.round(m.protein)}g · F:${Math.round(m.fat)}g · C:${Math.round(m.carbs)}g · Fi:${Math.round(m.fiber||0)}g`;
  return<div>
    <div className="tog">{["text","photo"].map(m=><button key={m} className={mode===m?"on":""} onClick={()=>{setMode(m);setErr(null)}}>{m==="text"?"✏️ Text":"📷 Photo"}</button>)}</div>
    {mode==="photo"&&<div style={{marginBottom:24}}>{!imgP?<label className="upl"><div style={{fontSize:40,marginBottom:8,opacity:.5}}>📷</div><div style={{fontSize:15,fontWeight:500}}>Tap to upload</div><div style={{fontSize:13,color:"#999",marginTop:4}}>or drag and drop</div><input type="file" accept="image/*" onChange={doPhoto} style={{display:"none"}}/></label>:<div><img src={imgP} alt="Meal" className="prev"/><div className="fr" style={{marginTop:12}}><button className="btn" style={{flex:1}} onClick={doAnalyze} disabled={ld}>{ld?"Analyzing…":"Analyze photo"}</button><button className="btn btn-o" style={{flex:1}} onClick={()=>{setImgP(null);setImg64(null)}}>Cancel</button></div></div>}</div>}
    {mode==="text"&&<div style={{marginBottom:24}}><textarea value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))doAnalyze()}} placeholder="e.g., Grilled salmon 200g, olive oil 15ml, broccoli 150g"/><button className="btn" onClick={doAnalyze} disabled={ld||!txt.trim()}>{ld?"Analyzing…":"Analyze meal"}</button><p style={{fontSize:12,color:"#999",marginTop:6}}>Ctrl+Enter to submit</p></div>}
    {err&&<div className="err">{err}</div>}
    {ld&&<div style={{textAlign:"center",padding:20,fontSize:14,color:"#666"}}>Analyzing…</div>}
    <div style={{marginBottom:28}}><h3 className="slab">Today's meals</h3>{meals.length===0?<div style={{textAlign:"center",padding:20,color:"#bbb",fontSize:14}}>No meals logged yet</div>:<div className="fc">{meals.map((m,i)=><div key={i} className="mi"><div style={{flex:1}}><div className="mn">{m.mealName}</div><div className="mm">{ml(m)}</div></div><button className="btn-x" onClick={()=>setMeals(p=>p.filter((_,j)=>j!==i))}>×</button></div>)}</div>}</div>
    <div className="g5">{[{l:"Calories",v:tot.calories,t:DT.calories,u:""},{l:"Protein",v:tot.protein,t:DT.protein,u:"g"},{l:"Fat",v:tot.fat,t:DT.fat,u:"g"},{l:"Carbs",v:tot.carbs,t:DT.carbs,u:"g"},{l:"Fiber",v:tot.fiber||0,t:DT.fiber,u:"g"}].map(m=><div key={m.l} className="card"><div className="card-l">{m.l}</div><div className="card-v">{Math.round(m.v)}{m.u}</div><div className="card-s">/ {m.t}{m.u}</div></div>)}</div>
    <h3 className="stit">Macros breakdown</h3>
    <div className="fc" style={{marginBottom:32,gap:14}}>{[{l:"Protein",v:tot.protein,t:DT.protein,c:"#3b82f6"},{l:"Fat",v:tot.fat,t:DT.fat,c:"#f59e0b"},{l:"Carbs",v:tot.carbs,t:DT.carbs,c:"#22c55e"},{l:"Fiber",v:tot.fiber||0,t:DT.fiber,c:"#8b5cf6"}].map(m=><div key={m.l}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:14,fontWeight:500}}>{m.l}</span><span style={{fontSize:13,color:"#888"}}>{Math.round(m.v)}g / {m.t}g ({Math.round((m.v/m.t)*100)}%)</span></div><PB value={m.v} max={m.t} color={m.c}/></div>)}</div>
    <h3 className="stit">Key micronutrients</h3>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"10px 14px",background:sun?"#fffbeb":"#fafafa",border:`1px solid ${sun?"#fde68a":"#e5e5e5"}`,borderRadius:8,cursor:"pointer"}} onClick={toggleSun}>
      <input type="checkbox" checked={sun} readOnly style={{width:18,height:18,accentColor:"#f59e0b",pointerEvents:"none"}}/>
      <span style={{fontSize:14,fontWeight:500}}>☀️ Sun exposure today</span>
      {sun&&<span style={{fontSize:12,color:"#ca8a04",marginLeft:"auto"}}>Vit D → {new Date().getMonth()>=10||new Date().getMonth()<=1?"50%":"100%"}</span>}
    </div>
    <div className="gm">{MICROS.map(m=>{const v=sun&&m.key==="vitaminD"?sunVitD(today())+(tot[m.key]||0):(tot[m.key]||0);return<MC key={m.key} name={m.name} value={v} target={DT[m.key]} unit={m.unit}/>})}</div>

    {(()=>{

/* ── MAIN APP ── */
function App(){
  const[url,setUrl]=useState(()=>ls("nt-api-url","https://lingering-river-d82a.frperessutti.workers.dev"));
  const[profiles,setProfiles]=useState(()=>ls("nt-profiles",[]));
  const[activeId,setActiveId]=useState(()=>ls("nt-active-profile",null));
  const[page,setPage]=useState("today");
  const[showSetup,setShowSetup]=useState(false);
  const[editProfile,setEditProfile]=useState(false);
  const[creating,setCreating]=useState(false);
  const[showCalib,setShowCalib]=useState(false);

  const profile=profiles.find(p=>p.id===activeId);
  const pk=activeId?`nt-${activeId}`:"nt";
  const DT=profile?calcTargets(profile):{calories:3050,protein:150,fat:70,carbs:350,fiber:35,iron:8,zinc:11,magnesium:400,potassium:3500,vitaminD:2000,vitaminB6:1.5,vitaminB12:2.4,folate:400,calcium:1000,omega3:1.5};
  const prompt=profile?buildPrompt(profile,profile.multiplier):"";

  const[meals,setMeals]=useState([]);
  const[templates,setTemplates]=useState([]);
  const[history,setHistory]=useState({});
  const[sunlight,setSunlight]=useState({});

  useEffect(()=>{
    if(!activeId)return;
    const d=ls(`${pk}-meals`,{});
    setMeals(d.date===today()?(d.meals||[]):[]);
    setTemplates(ls(`${pk}-templates`,[]));
    setHistory(ls(`${pk}-history`,{}));
    setSunlight(ls(`${pk}-sunlight`,{}));
    // Check calibration
    if(profile){
      const last=profile.lastCalibration||today();
      const diff=Math.floor((new Date()-new Date(last))/(1000*60*60*24));
      if(diff>=10)setShowCalib(true);
    }
  },[activeId]);

  const toggleSun=(date)=>{setSunlight(p=>{const u={...p,[date]:!p[date]};lss(`${pk}-sunlight`,u);return u})};

  const update=(nm)=>{const t=today();setMeals(nm);lss(`${pk}-meals`,{meals:nm,date:t});setHistory(p=>{const u={...p,[t]:nm};const k=last10();const tr={};k.forEach(d=>{if(u[d])tr[d]=u[d]});lss(`${pk}-history`,tr);return tr})};
  const wrap=fn=>{const nm=typeof fn==="function"?fn(meals):fn;update(nm)};
  useEffect(()=>{if(activeId)lss(`${pk}-templates`,templates)},[templates]);

  const addToday=m=>update([...meals,{...m}]);
  const addHist=(date,meal)=>{if(date===today()){addToday(meal)}else{setHistory(p=>{const u={...p,[date]:[...(p[date]||[]),meal]};lss(`${pk}-history`,u);return u})}};
  const delHist=(date,idx)=>{if(date===today()){update(meals.filter((_,i)=>i!==idx))}else{setHistory(p=>{const dm=[...(p[date]||[])];dm.splice(idx,1);const u={...p};if(dm.length)u[date]=dm;else delete u[date];lss(`${pk}-history`,u);return u})}};

  const saveProfile=(p)=>{
    const updated=profiles.some(x=>x.id===p.id)?profiles.map(x=>x.id===p.id?p:x):[...profiles,p];
    setProfiles(updated);lss("nt-profiles",updated);
    setActiveId(p.id);lss("nt-active-profile",p.id);
    setCreating(false);setEditProfile(false);
  };

  const handleCalibration=(result)=>{
    if(!profile)return;
    let newMult=profile.multiplier||1;
    let msg="";
    if(result==="same"){
      // Check if app shows deficit
      const days=last10();const wd=days.filter(d=>history[d]);
      if(wd.length>=2){
        const avgCal=wd.reduce((s,d)=>s+sum(history[d]).calories,0)/wd.length;
        if(avgCal<DT.calories*0.85){
          newMult=Math.min(newMult*1.15,2.0);
          msg=`Portions increased by 15% (multiplier: ${newMult.toFixed(2)}x). Since you're not losing weight but the app shows a deficit, your actual portions are likely larger than estimated.`;
        }else{msg="Looks like your tracking is accurate. Keep going!"}
      }
    }else if(result==="lost"){msg="Your deficit is real. Consider eating more if the loss is unintended."}
    else if(result==="gained"){
      newMult=Math.max(newMult*0.9,0.7);
      msg=`Portions decreased by 10% (multiplier: ${newMult.toFixed(2)}x).`;
    }
    const updated=profiles.map(p=>p.id===profile.id?{...p,multiplier:newMult,lastCalibration:today()}:p);
    setProfiles(updated);lss("nt-profiles",updated);
    setShowCalib(false);
    if(msg)alert(msg);
  };

  // No API URL yet
  if(!url)return<div><h1>Meal Analyzer</h1><p className="sub" style={{marginBottom:24}}>Multi-profile nutrition tracker</p><Setup url={url} setUrl={setUrl}/></div>;

  // No profiles or selecting
  if(!activeId||creating){
    if(creating)return<div><button className="btn btn-o btn-s" onClick={()=>setCreating(false)} style={{marginBottom:16}}>← Back</button><ProfileSetup onSave={saveProfile}/></div>;
    if(profiles.length===0)return<div><h1>Meal Analyzer</h1><p className="sub" style={{marginBottom:24}}>Create your first profile to get started</p><ProfileSetup onSave={saveProfile}/></div>;
    return<ProfileSelector profiles={profiles} onSelect={id=>{setActiveId(id);lss("nt-active-profile",id)}} onCreate={()=>setCreating(true)}/>;
  }

  if(editProfile)return<div><button className="btn btn-o btn-s" onClick={()=>setEditProfile(false)} style={{marginBottom:16}}>← Back</button><ProfileSetup onSave={saveProfile} initial={profile}/></div>;
  if(showSetup)return<div><button className="btn btn-o btn-s" onClick={()=>setShowSetup(false)} style={{marginBottom:16}}>← Back</button><Setup url={url} setUrl={setUrl}/></div>;

  const nc=p=>page===p?"on":"";
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <h1>Meal Analyzer</h1>
      <div className="fr" style={{gap:4}}>
        <button onClick={()=>{setActiveId(null);lss("nt-active-profile",null)}} style={{background:"none",border:"none",fontSize:14,cursor:"pointer",color:"#888"}}>👥</button>
        <button onClick={()=>setEditProfile(true)} style={{background:"none",border:"none",fontSize:14,cursor:"pointer",color:"#888"}}>✏️</button>
        <button onClick={()=>setShowSetup(true)} style={{background:"none",border:"none",fontSize:14,cursor:"pointer",color:"#888"}}>⚙️</button>
      </div>
    </div>
    <p className="sub" style={{marginBottom:4}}>{profile.name} · {profile.age}y, {profile.weight}kg, {profile.trainingHours}h/day</p>
    <p style={{fontSize:12,color:"#16a34a",marginBottom:20}}>{DT.calories} kcal · {DT.protein}g protein · {DT.fat}g fat · {DT.carbs}g carbs{profile.multiplier>1?` · Portions: ${profile.multiplier.toFixed(2)}x`:""}</p>

    {showCalib&&<CalibrationPrompt profile={profile} onResult={handleCalibration} onDismiss={()=>{const u=profiles.map(p=>p.id===profile.id?{...p,lastCalibration:today()}:p);setProfiles(u);lss("nt-profiles",u);setShowCalib(false)}}/>}

    <div className="nav">
      <button className={nc("today")} onClick={()=>setPage("today")}>Today</button>
      <button className={nc("templates")} onClick={()=>setPage("templates")}>Saved meals</button>
      <button className={nc("history")} onClick={()=>setPage("history")}>History</button>
    </div>
    {page==="today"&&<TodayPage meals={meals} setMeals={wrap} url={url} sun={!!sunlight[today()]} toggleSun={()=>toggleSun(today())} history={history} sunlight={sunlight} templates={templates} profile={profile} DT={DT} prompt={prompt}/>}
    {page==="templates"&&<TemplatesPage templates={templates} setTemplates={setTemplates} url={url} DT={DT} prompt={prompt}/>}
    {page==="history"&&<HistoryPage history={history} onAdd={addHist} onDel={delHist} url={url} sunlight={sunlight} toggleSun={toggleSun} templates={templates} DT={DT} prompt={prompt}/>}
  </div>
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
