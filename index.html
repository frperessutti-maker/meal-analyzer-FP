<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meal Analyzer</title><!-- v21 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#fff;-webkit-font-smoothing:antialiased}
    .app{max-width:640px;margin:0 auto;padding:20px 16px 40px}
    h1{font-size:24px;font-weight:600} .sub{font-size:14px;color:#666;margin-top:4px}
    .nav{display:flex;gap:6px;margin:20px 0 24px;background:#f5f5f5;padding:4px;border-radius:10px}
    .nav button{flex:1;padding:12px 0;border:none;cursor:pointer;font-size:14px;font-weight:500;border-radius:8px;transition:all .2s;background:transparent;color:#888}
    .nav button.on{background:#1a1a1a;color:#fff}
    .tog{display:flex;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;margin-bottom:16px}
    .tog button{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;background:#fff;color:#666}
    .tog button.on{background:#1a1a1a;color:#fff}
    textarea{width:100%;min-height:90px;padding:14px;border:1px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;outline:none}
    textarea:focus{border-color:#999}
    input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
    input:focus,select:focus{border-color:#999}
    .btn{padding:12px 0;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-s{padding:6px 14px;font-size:13px;width:auto;margin-top:0}
    .btn-o{background:#fff;color:#666;border:1px solid #e5e5e5}
    .btn-d{background:#dc2626;color:#fff;border:none}
    .btn-do{background:#fff;color:#dc2626;border:1px solid #fca5a5}
    .btn-x{background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
    .upl{background:#fafafa;border-radius:12px;border:2px dashed #d4d4d4;padding:32px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
    .prev{width:100%;max-height:280px;object-fit:cover;border-radius:12px;border:1px solid #e5e5e5}
    .card{background:#fafafa;border-radius:8px;padding:12px;text-align:center}
    .card-l{font-size:11px;color:#888;font-weight:500;margin-bottom:4px}
    .card-v{font-size:20px;font-weight:600} .card-s{font-size:11px;color:#bbb;margin-top:2px}
    .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px}
    .gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:32px}
    .pbg{width:100%;height:8px;background:#e5e5e5;border-radius:4px;overflow:hidden}
    .pf{height:100%;border-radius:4px;transition:width .4s ease}
    .stit{font-size:16px;font-weight:600;margin:0 0 16px}
    .slab{font-size:13px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.5px;margin:0 0 12px}
    .mi{background:#fafafa;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid #f0f0f0}
    .mn{font-weight:500;font-size:14px} .mm{font-size:12px;color:#888;margin-top:4px}
    .err{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#dc2626}
    .info{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;margin-bottom:24px;font-size:13px;color:#92400e;line-height:1.5}
    .defb{background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:16px;margin-bottom:24px}
    .deft{font-size:14px;font-weight:600;color:#dc2626;margin-bottom:8px}
    .deftags{display:flex;flex-wrap:wrap;gap:8px}
    .deftag{font-size:13px;background:#fff;border:1px solid #fca5a5;padding:4px 12px;border-radius:6px;color:#dc2626;font-weight:500}
    .dc{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:12px}
    .pill{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;display:inline-block;margin:2px}
    .fr{display:flex;gap:8px} .fc{display:flex;flex-direction:column;gap:8px}
    .field{margin-bottom:16px} .field label{display:block;font-size:13px;font-weight:500;color:#666;margin-bottom:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp{display:inline-block;width:20px;height:20px;border:2px solid #e5e5e5;border-top-color:#1a1a1a;border-radius:50%;animation:spin .6s linear infinite}
    .collapse-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#888;font-weight:500;padding:0;display:flex;align-items:center;gap:4px}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
const API_URL="https://lingering-river-d82a.frperessutti.workers.dev";

const MICROS=[{name:"Iron",key:"iron",unit:"mg",target:8},{name:"Zinc",key:"zinc",unit:"mg",target:11},{name:"Magnesium",key:"magnesium",unit:"mg",target:400},{name:"Potassium",key:"potassium",unit:"mg",target:3500},{name:"Vit D",key:"vitaminD",unit:"IU",target:2000},{name:"Vit C",key:"vitaminC",unit:"mg",target:90},{name:"Vit A",key:"vitaminA",unit:"mcg",target:900},{name:"B6",key:"vitaminB6",unit:"mg",target:1.5},{name:"B12",key:"vitaminB12",unit:"mcg",target:2.4},{name:"Folate",key:"folate",unit:"mcg",target:400},{name:"Calcium",key:"calcium",unit:"mg",target:1000},{name:"Iodine",key:"iodine",unit:"mcg",target:150},{name:"Omega-3",key:"omega3",unit:"g",target:1.5}];
const MK=["calories","protein","fat","carbs","fiber"];
const AMINOS_BASE=[{name:"Leucine",key:"leucine",pctOfProtein:0.065,unit:"g"},{name:"Glutamine",key:"glutamine",pctOfProtein:0.06,unit:"g"},{name:"Beta-Alanine",key:"betaAlanine",fixedTarget:1.2,unit:"g"}];
function getAminos(protTarget){return AMINOS_BASE.map(a=>({...a,target:a.fixedTarget||Math.round(protTarget*a.pctOfProtein*10)/10}))}
const AK=[...MK,...MICROS.map(m=>m.key),...AMINOS_BASE.map(a=>a.key)];
const GOALS=[
  {id:"maintain",label:"Maintain weight",calAdj:0,protMult:2},
  {id:"lose_weight",label:"Lose weight",calAdj:-500,protMult:2.2},
  {id:"lose_fat",label:"Lose fat / body recomp",calAdj:-300,protMult:2.4},
  {id:"gain_weight",label:"Gain weight",calAdj:400,protMult:2},
  {id:"gain_muscle",label:"Build muscle",calAdj:300,protMult:2.5},
];
const TRACKABLE=[{key:"none",label:"None"},...MK.map(k=>({key:k,label:k.charAt(0).toUpperCase()+k.slice(1)})),...MICROS.map(m=>({key:m.key,label:m.name})),...AMINOS_BASE.map(a=>({key:a.key,label:a.name}))];
const TRAINING_TYPES=[
  {id:"strength",label:"Strength",short:"Strength",icon:"🏋️",color:"#8b5cf6"},
  {id:"hiit",label:"HIIT / Conditioning",short:"HIIT",icon:"⚡",color:"#f59e0b"},
  {id:"endurance",label:"Endurance",short:"Endurance",icon:"🏃",color:"#3b82f6"},
  {id:"skill",label:"Skill / Technical",short:"Skill",icon:"🎯",color:"#22c55e"},
  {id:"recovery",label:"Recovery / Mobility",short:"Recovery",icon:"🧘",color:"#6b7280"},
];

const NUTRIENT_INFO={
  calories:"Energy fuel for training and daily function. Too low impairs recovery, focus, and hormonal balance. Too high leads to fat gain.",
  protein:"Builds and repairs muscle tissue. Essential for recovery from intense training. Supports immune function and satiety.",
  fat:"Hormone production (testosterone, cortisol regulation), joint lubrication, brain function. Omega-3 fats reduce inflammation from training.",
  carbs:"Primary fuel for high-intensity training. Replenishes muscle glycogen. Supports brain function and mood. Critical for athletic performance.",
  fiber:"Gut health and microbiome diversity. Regulates blood sugar, improves satiety. Supports nutrient absorption and immune function.",
  iron:"Oxygen transport to muscles. Low iron = fatigue, poor endurance, brain fog. Athletes lose iron through sweat and impact sports.",
  zinc:"Testosterone production, immune defense, wound healing. Depleted through sweat. Key for muscle protein synthesis and cognitive function.",
  magnesium:"Muscle relaxation, sleep quality, nerve function. Prevents cramps. Supports 300+ enzymatic reactions. Most athletes are deficient.",
  potassium:"Electrolyte balance, muscle contraction, heart rhythm. Prevents cramping during long training sessions. Supports blood pressure.",
  vitaminD:"Bone strength, immune function, testosterone levels, mood regulation. Most people are deficient. Critical for injury prevention.",
  vitaminC:"Collagen synthesis (tendons, ligaments), immune defense, antioxidant. Speeds recovery from intense training. Enhances iron absorption.",
  vitaminA:"Vision, immune function, skin repair. Supports mucosal barriers (first line of defense). Important for tissue recovery.",
  vitaminB6:"Protein metabolism, neurotransmitter production (serotonin, dopamine). Supports energy during training and cognitive performance.",
  vitaminB12:"Red blood cell production, nerve function, DNA synthesis. Deficiency causes fatigue and poor concentration. Critical for vegans.",
  folate:"Cell division, DNA repair, red blood cell formation. Supports recovery at cellular level. Important for brain health and mood.",
  calcium:"Bone density, muscle contraction, nerve signaling. Critical for impact sports. Works with Vitamin D for bone health.",
  iodine:"Thyroid function — regulates metabolism, energy levels, body temperature. Deficiency causes fatigue and weight management issues.",
  omega3:"Anti-inflammatory, brain health, joint protection. Reduces muscle soreness (DOMS). Supports focus and reaction time.",
  leucine:"Primary trigger for muscle protein synthesis (mTOR pathway). The most anabolic amino acid. Key for post-training recovery.",
  glutamine:"Most abundant amino acid in muscle. Supports gut lining and immune function. Heavily depleted during intense/prolonged training.",
  betaAlanine:"Precursor to carnosine — buffers lactic acid in muscles. Improves performance in high-intensity efforts like sparring rounds."
};

function InfoBtn({id}){
  const[open,setOpen]=useState(false);
  const info=NUTRIENT_INFO[id];if(!info)return null;
  return<>
    <button onClick={(e)=>{e.stopPropagation();setOpen(true)}} style={{background:"none",border:"1px solid #ddd",borderRadius:"50%",width:18,height:18,fontSize:11,color:"#999",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",marginLeft:4,flexShrink:0,fontStyle:"italic",fontFamily:"Georgia,serif"}}>i</button>
    {open&&<div onClick={()=>setOpen(false)} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:24,maxWidth:360,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{fontSize:16,fontWeight:600}}>{TRACKABLE.find(t=>t.key===id)?.label||id}</span>
          <button onClick={()=>setOpen(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#999"}}>×</button>
        </div>
        <p style={{fontSize:14,color:"#444",lineHeight:1.6,margin:0}}>{info}</p>
      </div>
    </div>}
  </>
}
function calcTDEE(p){
  let bmr;
  if(p.gender==="male")bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)+5;
  else bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)-161;
  const h=p.trainingHours||0;
  const af=h<=0.5?1.4:h<=1?1.6:h<=1.5?1.7:h<=2?1.8:h<=3?1.9:2.0;
  return Math.round(bmr*af);
}
function calcHydration(p){return Math.round((35*p.weight+600*(p.trainingHours||0))/100)/10}

function calcTargets(p){
  const goal=GOALS.find(g=>g.id===p.goal)||GOALS[0];
  const baseCal=calcTDEE(p);
  const cal=baseCal+goal.calAdj;
  const prot=Math.round(p.weight*goal.protMult);
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.max(Math.round((cal-prot*4-fat*9)/4),50);
  const fiber=p.gender==="male"?35:28;
  const t={calories:cal,protein:prot,fat,carbs,fiber};
  MICROS.forEach(m=>{t[m.key]=m.target});
  if(p.gender==="female"){t.iron=18;t.vitaminA=700;t.vitaminC=75}
  return t;
}

function buildPrompt(profile){
  const pm=profile.multiplier||1;
  const portionNote=pm!==1?`\nPORTION CALIBRATION: Multiply all unspecified portion estimates by ${pm.toFixed(2)}.`:"";
  return `You are a precise nutrition calculator.

Portion references:
- 1 tablespoon/spoon of oil = 13-14g, 1 teaspoon = 4-5g
- 1 egg = 50g, 1 slice bread = 30-35g
- Unspecified portions: estimate GENEROUSLY for a ${profile.weight}kg active ${profile.gender}:
  pasta=120-150g dry, rice=150g dry, meat/fish=200-250g, potatoes=250-300g, salad=200g+${portionNote}

Supplements: When product says "X mg daily dose, Y capsules for Z days" -> per capsule = X/(Y/Z). Trust user-stated amounts.

Amino acid estimation references (per 100g of food):
- Chicken breast: leucine 2.2g, glutamine 1.2g, betaAlanine 0.1g
- Beef: leucine 1.8g, glutamine 1.1g, betaAlanine 0.13g
- Salmon/tuna: leucine 1.8g, glutamine 1.0g, betaAlanine varies by species (see below)
- Skipjack tuna red meat: betaAlanine 0.37g per 100g
- Black skipjack tuna white meat: betaAlanine 0.88g per 100g (one of the highest natural sources!)
- Black skipjack tuna red meat: betaAlanine 0.10g per 100g
- Black skipjack tuna (general/unspecified): betaAlanine 0.65g per 100g (blended estimate)
- Yellowfin tuna red meat: betaAlanine 0.04g per 100g
- Rainbow trout: betaAlanine 0.02g per 100g
- Beef: leucine 1.8g, glutamine 1.1g, betaAlanine 0.13g per 100g
- Chicken breast: leucine 2.2g, glutamine 1.2g, betaAlanine 0.19g per 100g
- Chicken leg: leucine 1.9g, glutamine 1.0g, betaAlanine 0.09g per 100g
- Turkey: leucine 2.0g, glutamine 1.1g, betaAlanine 0.07-0.23g (leg higher)
- Eggs: leucine 1.1g, glutamine 0.6g, betaAlanine 0.01g
- Whey protein 30g scoop: leucine 3.5g, glutamine 1.5g, betaAlanine 0g
- Greek yogurt 100g: leucine 0.7g, glutamine 0.4g, betaAlanine 0g
- Legumes/beans 100g cooked: leucine 0.6g, glutamine 0.5g, betaAlanine 0g
- Pork: leucine 1.7g, glutamine 1.0g, betaAlanine 0.15g
Always estimate amino acids based on these references. Do NOT return 0 for leucine/glutamine if the meal contains protein.

Units: protein/fat/carbs/fiber/omega3 in g, iron/zinc/magnesium/potassium/calcium in mg, vitaminC in mg, vitaminA in mcg RAE, vitaminD in IU, B6 in mg, B12/folate/iodine in mcg. Amino acids (leucine/glutamine/betaAlanine) in grams.

Respond ONLY with JSON:
{"mealName":"description","calories":0,"protein":0,"fat":0,"carbs":0,"fiber":0,"iron":0,"zinc":0,"magnesium":0,"potassium":0,"vitaminD":0,"vitaminC":0,"vitaminA":0,"vitaminB6":0,"vitaminB12":0,"folate":0,"calcium":0,"iodine":0,"omega3":0,"leucine":0,"glutamine":0,"betaAlanine":0}`;
}

function today(){return new Date().toISOString().slice(0,10)}
function last10(){const d=[];for(let i=0;i<10;i++){const x=new Date();x.setDate(x.getDate()-i);d.push(x.toISOString().slice(0,10))}return d}
function sum(meals){const t={};AK.forEach(k=>t[k]=0);(meals||[]).forEach(m=>AK.forEach(k=>{const v=Number(m[k]);t[k]+=isNaN(v)?0:v}));return t}
function sunVitD(ds){const m=new Date(ds+"T12:00:00").getMonth();return(m>=10||m<=1)?1000:2000}
function ls(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function userKey(fn,ln,pin){return(fn.trim()+"-"+ln.trim()+"-"+(pin||"0000")).toLowerCase().replace(/\s+/g,"-")}
async function cloudGet(key){try{const r=await fetch(`${API_URL}/sync?key=${encodeURIComponent(key)}`);return await r.json()}catch{return null}}
async function cloudPut(key,data){try{await fetch(`${API_URL}/sync`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({key,data})})}catch{}}

function cleanUrl(text){
  return text.replace(/https?:\/\/www\.amazon\.[a-z.]+\/[^\s]*?(\/dp\/[A-Z0-9]+)[^\s]*/g,"https://www.amazon.it$1");
}

async function fetchUrlContent(url){
  try{const r=await fetch(`${API_URL}/fetch-url?url=${encodeURIComponent(url)}`);const d=await r.json();return d.text||null}catch{return null}
}

async function doAnalyze(text,img,prompt){
  const c=[];
  if(img){const mt=img.startsWith("data:image/png")?"image/png":"image/jpeg";c.push({type:"image",source:{type:"base64",media_type:mt,data:img.split(",")[1]}})}
  let cleanText=text?cleanUrl(text):text;
  // If URL found, fetch its content and include as context
  const urlMatch=cleanText&&cleanText.match(/https?:\/\/[^\s]+/);
  let pageContext="";
  if(urlMatch){
    const content=await fetchUrlContent(urlMatch[0]);
    if(content)pageContext=`\n\nPRODUCT PAGE CONTENT (use this for exact nutritional values):\n${content}`;
    cleanText=cleanText.replace(urlMatch[0],"").trim();
  }
  c.push({type:"text",text:`${prompt}${pageContext}\n\nMeal: ${cleanText}`});
  const body={model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:c}]};
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  const allText=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const match=allText.match(/\{[^{}]*"mealName"[^{}]*\}/);
  if(match)return JSON.parse(match[0]);
  const broad=allText.match(/\{[\s\S]*\}/);
  if(broad)return JSON.parse(broad[0]);
  throw new Error("Analysis failed. Try describing the product manually.");
}

function PB({value,max,color}){const p=Math.min(Math.round((value/max)*100),100);return<div className="pbg"><div className="pf" style={{width:`${p}%`,background:color}}/></div>}
function MC({name,value,target,unit,infoKey}){
  const p=Math.round((value/target)*100),met=p>=100;
  return<div style={{background:met?"#f0fdf4":"#fafafa",border:`1px solid ${met?"#86efac":"#e5e5e5"}`,borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
    <div style={{fontSize:12,color:"#666",fontWeight:500,marginBottom:4,display:"flex",alignItems:"center",justifyContent:"center",gap:2}}>{name}{infoKey&&<InfoBtn id={infoKey}/>}</div>
    <div style={{fontSize:15,fontWeight:600}}>{Math.round(value*10)/10}</div>
    <div style={{fontSize:11,color:"#999",marginTop:2}}>/ {target} {unit}</div>
    <div style={{fontSize:11,color:met?"#16a34a":p>=70?"#ca8a04":"#dc2626",marginTop:4,fontWeight:500}}>{p}%</div>
  </div>
}

/* ── TRACKING CHART ── */
function TrackingChart({history,baseline,sunlight,trackKey,DT}){
  const days=last10().reverse();
  const info=TRACKABLE.find(t=>t.key===trackKey);
  const target=DT[trackKey]||0;
  const unit=MICROS.find(m=>m.key===trackKey)?.unit||(trackKey==="calories"?"kcal":"g");
  const values=days.map(d=>{const s=history[d]?sum(history[d]):null;const base=baseline[trackKey]||0;const logged=s?s[trackKey]||0:0;const sun=(trackKey==="vitaminD"&&sunlight[d])?sunVitD(d):0;return{date:d,val:s?logged+base+sun:null}});
  const vals=values.filter(v=>v.val!==null).map(v=>v.val);
  if(vals.length<2)return null;
  const maxV=Math.max(...vals,target)*1.1;
  const W=580,H=200,PX=50,PY=20;
  const points=values.map((v,i)=>{if(v.val===null)return null;const x=PX+i*((W-PX*2)/(days.length-1));const y=PY+(H-PY*2)*(1-v.val/maxV);return{x,y,val:v.val,date:v.date}}).filter(Boolean);
  const line=points.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ");
  const targetY=PY+(H-PY*2)*(1-target/maxV);
  return<div style={{marginBottom:28}}>
    <h3 className="stit">{info?.label||trackKey} — 10-day tracking</h3>
    <svg viewBox={`0 0 ${W} ${H+30}`} style={{width:"100%",background:"#fafafa",borderRadius:12,border:"1px solid #e5e5e5"}}>
      <line x1={PX} y1={targetY} x2={W-PX} y2={targetY} stroke="#22c55e" strokeWidth="1" strokeDasharray="6,4"/>
      <text x={W-PX+4} y={targetY+4} fontSize="10" fill="#22c55e">target</text>
      <path d={line} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinejoin="round"/>
      {points.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="4" fill="#3b82f6"/><text x={p.x} y={p.y-10} textAnchor="middle" fontSize="10" fill="#1a1a1a" fontWeight="600">{Math.round(p.val)}</text></g>)}
      {days.map((d,i)=>{const x=PX+i*((W-PX*2)/(days.length-1));return<text key={d} x={x} y={H+16} textAnchor="middle" fontSize="9" fill="#999">{d.slice(5)}</text>})}
    </svg>
    <div style={{fontSize:12,color:"#888",marginTop:8,textAlign:"center"}}>Target: {target} {unit}/day</div>
  </div>
}

/* ── ADMIN PAGE ── */
function AdminPage({onLogout}){
  const[profiles,setProfiles]=useState([]);
  const[loading,setLoading]=useState(true);
  const[confirmDel,setConfirmDel]=useState(null);
  const[msg,setMsg]=useState(null);
  const load=async()=>{setLoading(true);try{const r=await fetch(`${API_URL}/sync/list`);const d=await r.json();setProfiles(d)}catch(e){setMsg("Failed to load: "+e.message)}finally{setLoading(false)}};
  useEffect(()=>{load()},[]);

function LoginScreen({onLogin,onCreate,onAdmin}){

function HistoryPage({history,onAdd,onDel,sunlight,giDistress,hydration,rpp,setRpp,templates,skipped,DT,prompt,profile}){
  const[ad,setAd]=useState(null),[ex,setEx]=useState(null),[di,setDi]=useState(""),[ld,setLd]=useState(false),[err,setErr]=useState(null);
  const[rppEditDate,setRppEditDate]=useState(null);
  const[editHistDate,setEditHistDate]=useState(null),[editHistIdx,setEditHistIdx]=useState(null),[editHistTxt,setEditHistTxt]=useState(""),[editHistLd,setEditHistLd]=useState(false);
  const handleEditHist=async(date,idx)=>{if(!editHistTxt.trim())return;const orig=(history[date]||[])[idx];const textChanged=editHistTxt.trim()!==orig?.mealName;if(!textChanged){setEditHistDate(null);setEditHistIdx(null);setEditHistTxt("");return}setEditHistLd(true);try{const m=await doAnalyze(editHistTxt,null,prompt);m.time=orig?.time||"";m.date=date;onDel(date,idx);onAdd(date,m);setEditHistDate(null);setEditHistIdx(null);setEditHistTxt("")}catch(e){setErr("Edit failed: "+e.message)}finally{setEditHistLd(false)}};
  const days=last10();const baseline=sum(templates);
  const dayBaseline=(d)=>{const ds=skipped[d]||[];return sum(templates.filter((_,i)=>!ds.includes(i)))};
  const allN=[{label:"Calories",key:"calories",target:DT.calories,unit:""},{label:"Protein",key:"protein",target:DT.protein,unit:"g"},{label:"Fat",key:"fat",target:DT.fat,unit:"g"},{label:"Carbs",key:"carbs",target:DT.carbs,unit:"g"},{label:"Fiber",key:"fiber",target:DT.fiber,unit:"g"},...MICROS.map(m=>({label:m.name,key:m.key,target:DT[m.key],unit:m.unit}))];
  const dd=days.map(d=>({date:d,totals:history[d]?sum(history[d]):null,mc:history[d]?history[d].length:0,base:dayBaseline(d)}));
  const wd=dd.filter(d=>d.totals);
  const avg={};allN.forEach(n=>{avg[n.key]=wd.length>0?wd.reduce((s,d)=>s+((n.key==="vitaminD"&&sunlight[d.date])?sunVitD(d.date)+(d.totals[n.key]||0):(d.totals[n.key]||0)),0)/wd.length+(baseline[n.key]||0):0});
  const def=allN.filter(n=>Math.round((avg[n.key]/n.target)*100)<70&&wd.length>=2);
  const fmt=ds=>{const t=today();if(ds===t)return"Today";const y=new Date();y.setDate(y.getDate()-1);if(ds===y.toISOString().slice(0,10))return"Yesterday";return new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})};
  const pc=p=>p>=90?"#16a34a":p>=70?"#ca8a04":"#dc2626";

  // GI CORRELATION ANALYSIS
  const giCorrelation=(()=>{
    const daysWithData=days.filter(d=>history[d]&&history[d].length>0);
    const giDays=daysWithData.filter(d=>giDistress[d]);
    const okDays=daysWithData.filter(d=>!giDistress[d]);
    if(giDays.length<1||daysWithData.length<3)return null;

    // Extract food keywords from meal names
    const extractKeywords=(meals)=>{
      const words=new Set();
      (meals||[]).forEach(m=>{
        const name=(m.mealName||"").toLowerCase().replace(/[^a-zàèéìòùäöü\s]/g,"");
        name.split(/\s+/).filter(w=>w.length>2&&!["with","and","the","for","cup","some","two","one","per","from"].includes(w)).forEach(w=>words.add(w));
      });
      return words;
    };

    // Count keyword frequency on GI vs OK days
    const giKeywords={};const okKeywords={};
    giDays.forEach(d=>{extractKeywords(history[d]).forEach(w=>{giKeywords[w]=(giKeywords[w]||0)+1})});
    okDays.forEach(d=>{extractKeywords(history[d]).forEach(w=>{okKeywords[w]=(okKeywords[w]||0)+1})});

    const baseRate=giDays.length/daysWithData.length;
    const triggers=[];

    Object.keys(giKeywords).forEach(word=>{
      const giCount=giKeywords[word];
      const okCount=okKeywords[word]||0;
      const totalAppearances=giCount+okCount;
      if(totalAppearances<2)return; // need at least 2 appearances
      const giRate=giCount/totalAppearances; // P(GI|food)
      const lift=giRate/baseRate;
      // Confidence: combines lift strength with sample size
      const sampleFactor=Math.min(totalAppearances/5,1); // peaks at 5 samples
      const liftScore=Math.min((lift-1)/3,1); // normalized lift (1=no lift, 4+=max)
      const confidence=Math.round(sampleFactor*liftScore*100);
      if(lift>1.5&&confidence>15){
        triggers.push({word,giCount,okCount,totalAppearances,giRate:Math.round(giRate*100),lift:Math.round(lift*10)/10,confidence});
      }
    });

    triggers.sort((a,b)=>b.confidence-a.confidence);
    return{giDays:giDays.length,okDays:okDays.length,totalDays:daysWithData.length,baseRate:Math.round(baseRate*100),triggers:triggers.slice(0,5)};
  })();

  return<div>
    {def.length>0&&<div className="defb"><div className="deft">Consistent deficiencies detected</div><p style={{fontSize:13,color:"#991b1b",margin:"0 0 10px"}}>Based on {wd.length}-day average:</p><div className="deftags">{def.map(n=><span key={n.key} className="deftag">{n.label}: {Math.round((avg[n.key]/n.target)*100)}% avg</span>)}</div></div>}

    {/* GI CORRELATION ALERT */}
    {giCorrelation&&giCorrelation.triggers.length>0&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:12,padding:16,marginBottom:24}}>

        {giCorrelation.triggers.map((t,i)=><div key={i} style={{background:"#fff",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{fontSize:14,fontWeight:600,color:"#1a1a1a",textTransform:"capitalize"}}>{t.word}</span>
            <span style={{fontSize:12,fontWeight:600,color:t.confidence>=60?"#dc2626":t.confidence>=30?"#ca8a04":"#888"}}>{t.confidence}% confidence</span>
          </div>
          <div style={{fontSize:12,color:"#666"}}>
            Present on {t.giCount}/{t.giCount+t.okCount} days → GI {t.giRate}% of the time (lift: {t.lift}x)
          </div>
          <div style={{marginTop:6}}>
            <div style={{height:4,background:"#fee2e2",borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${Math.min(t.confidence,100)}%`,background:t.confidence>=60?"#dc2626":t.confidence>=30?"#f59e0b":"#d4d4d4",borderRadius:2}}/>
            </div>
          </div>
        </div>)}
      </div>
      <p style={{fontSize:11,color:"#999",marginTop:12}}>Confidence = sample size × correlation strength. More days of tracking improves accuracy.</p>
    </div>}
    {giCorrelation&&giCorrelation.triggers.length===0&&giCorrelation.giDays>=2&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:12,padding:16,marginBottom:24}}>
      <div style={{fontSize:14,fontWeight:500,color:"#92400e"}}>🤢 GI distress logged on {giCorrelation.giDays} days but no clear food pattern found yet. Keep tracking for more accurate correlations.</div>
    </div>}

    {/* RPP-NUTRITION CORRELATION per training type */}
    {(()=>{
      const KEY_NUTRIENTS=[
        {key:"calories",label:"Calories",unit:"kcal"},
        {key:"protein",label:"Protein",unit:"g"},
        {key:"carbs",label:"Carbs",unit:"g"},
        {key:"fat",label:"Fat",unit:"g"},
        {key:"fiber",label:"Fiber",unit:"g"},
        ...MICROS.map(m=>({key:m.key,label:m.name,unit:m.unit})),
      ];
      // Build sessions with full nutrient sums from 24h pre-training window
      const sessions=[];
      days.forEach(d=>{
        const r=rpp[d];
        const score=typeof r==="object"?r.score:r||0;
        const tTime=typeof r==="object"?r.trainingTime:"";
        const tType=typeof r==="object"?r.trainingType:"";
        if(score>0&&history[d]){
          const trainingDT=new Date(d+"T"+(tTime||"17:00")+":00");

          const mealsInWindow=[];
          [d,...days.filter(x=>x!==d)].forEach(md=>{
            (history[md]||[]).forEach(m=>{
              const mealDT=new Date(md+"T"+(m.time||"12:00")+":00");

          const nut={};KEY_NUTRIENTS.forEach(n=>{nut[n.key]=(baseline[n.key]||0)});
          mealsInWindow.forEach(m=>{KEY_NUTRIENTS.forEach(n=>{const v=Number(m[n.key]);nut[n.key]+=isNaN(v)?0:v})});
          sessions.push({date:d,score,trainingType:tType||"none",nutrients:nut});
        }
      });
      if(sessions.length<2)return null;

      // Group sessions by training type
      const byType={};
      sessions.forEach(s=>{if(!byType[s.trainingType])byType[s.trainingType]=[];byType[s.trainingType].push(s)});

      // Build per-type analyses
      const analyses=[];
      const insufficientTypes=[];
      Object.entries(byType).forEach(([typeId,typeSessions])=>{
        const typeInfo=TRAINING_TYPES.find(t=>t.id===typeId)||{id:"none",label:"Untagged sessions",short:"Untagged",icon:"❓",color:"#888"};
        if(typeSessions.length<3){insufficientTypes.push({typeInfo,count:typeSessions.length});return}
        const sorted=[...typeSessions].sort((a,b)=>b.score-a.score);
        const mid=Math.ceil(sorted.length/2);
        const top=sorted.slice(0,mid);
        const bot=sorted.slice(mid);
        if(bot.length===0){insufficientTypes.push({typeInfo,count:typeSessions.length});return}
        const avgScore=typeSessions.reduce((s,x)=>s+x.score,0)/typeSessions.length;
        const insights=[];
        KEY_NUTRIENTS.forEach(n=>{
          const topAvg=top.reduce((s,x)=>s+x.nutrients[n.key],0)/top.length;
          const botAvg=bot.reduce((s,x)=>s+x.nutrients[n.key],0)/bot.length;
          if(topAvg<1&&botAvg<1)return;
          const diff=topAvg-botAvg;
          const pctDiff=botAvg>0.5?(diff/botAvg)*100:(topAvg>0?200:0);
          if(Math.abs(pctDiff)<15)return;
          const sampleFactor=Math.min(typeSessions.length/6,1);
          const magFactor=Math.min(Math.abs(pctDiff)/60,1);
          const confidence=Math.round(sampleFactor*magFactor*100);
          if(confidence<10)return;
          insights.push({key:n.key,label:n.label,unit:n.unit,topAvg:Math.round(topAvg*10)/10,botAvg:Math.round(botAvg*10)/10,pctDiff:Math.round(pctDiff),confidence:Math.min(confidence,99),positive:diff>0});
        });
        insights.sort((a,b)=>b.confidence-a.confidence);
        const boosters=insights.filter(x=>x.positive).slice(0,4);
        const drainers=insights.filter(x=>!x.positive).slice(0,4);
        analyses.push({typeInfo,sessions:typeSessions,avgScore,boosters,drainers});
      });

      </div>;

DISTRESS DAYS (${giDays.length} days): ${giMeals}
NORMAL DAYS (${okDays.length} days): ${okMeals}

User profile: ${profile.diet||"omnivore"} diet${(profile.intolerances||[]).length>0?`, known intolerances: ${profile.intolerances.join(", ")}`:""}

Respond ONLY with JSON (no markdown):

Rules for confidence (0.0-1.0):

Set overallConfidence based on data quality (${giDays.length} GI days, ${okDays.length} normal days — need 3+ GI days for meaningful analysis).`}]})});

function App(){

  const[editGoal,setEditGoal]=useState(false);
  const[isAdmin,setIsAdmin]=useState(false);
  const[newFirstName,setNewFirstName]=useState("");
  const[newLastName,setNewLastName]=useState("");
  const[newKey,setNewKey]=useState("");
  const[meals,setMeals_]=useState(()=>{const d=ls("nt-meals",{});return d.date===today()?(d.meals||[]):[]});
  const[templates,setTemplates_]=useState(()=>ls("nt-templates",[]));
  const[history,setHistory_]=useState(()=>ls("nt-history",{}));
  const[sunlight,setSunlight_]=useState(()=>ls("nt-sunlight",{}));
  const[giDistress,setGiDistress_]=useState(()=>ls("nt-gi",{}));

  const[hydration,setHydration_]=useState(()=>ls("nt-hydration",{}));
  const[showCalib,setShowCalib]=useState(false);
  const[syncing,setSyncing]=useState(false);

  // Fetch from cloud on load if user is already logged in
  useEffect(()=>{
    if(!userKey_)return;
    setSyncing(true);
    // Try current key first, then try migrating old key (without PIN) to new format
    const tryKey=async(key)=>{
      const data=await cloudGet(key);
      if(data&&data.profile)return data;
      // Migration: if key has PIN format but no data, try old format without PIN
      const oldKey=key.replace(/-\d{4}$/,"");
      if(oldKey!==key){const old=await cloudGet(oldKey);if(old&&old.profile){await cloudPut(key,old);return old}}
      return null;
    };
    tryKey(userKey_).then(data=>{
      if(data&&data.profile){
        setProfile(data.profile);lss("nt-profile",data.profile);
        const m=data.meals||{};
        const hist={...(data.history||{})};
        let todayMeals=[];
        if(m.meals&&m.meals.length>0){
          // Check individual meal dates if available, otherwise use container date
          const reallyToday=m.meals.filter(meal=>!meal.date||meal.date===today());
          const stale=m.meals.filter(meal=>meal.date&&meal.date!==today());
          if(stale.length>0){
            // Move stale meals to history under their date
            stale.forEach(meal=>{const d=meal.date;hist[d]=[...(hist[d]||[]),meal]});
          }
          if(m.date===today()&&reallyToday.length>0){
            todayMeals=reallyToday;
          }else if(m.date!==today()&&m.meals.length>0&&stale.length===0){
            // Old meals without date field - move all to history under container date
            hist[m.date]=[...(hist[m.date]||[]),...m.meals];
          }else{
            todayMeals=reallyToday;
          }
        }
        setMeals_(todayMeals);lss("nt-meals",{meals:todayMeals,date:today()});
        setTemplates_(data.templates||[]);lss("nt-templates",data.templates||[]);
        // Clean history - move misplaced meals to their correct date and deduplicate
        const cleanHist={};
        Object.entries(hist).forEach(function(entry){
          const hDate=entry[0];const hMeals=entry[1];
          (hMeals||[]).forEach(function(meal){
            const correctDate=meal.date||hDate;
            if(!cleanHist[correctDate])cleanHist[correctDate]=[];
            cleanHist[correctDate].push(meal);
          });
        });
        // Deduplicate meals per day by mealName+time+calories
        Object.keys(cleanHist).forEach(function(d){
          const seen={};const unique=[];
          cleanHist[d].forEach(function(meal){
            const key=(meal.mealName||"")+"_"+(meal.time||"")+"_"+Math.round(meal.calories||0);
            if(!seen[key]){seen[key]=true;unique.push(meal)}
          });
          cleanHist[d]=unique;
        });
        // Keep only last 10 days
        const keep=last10();const trimmed={};
        Object.keys(cleanHist).forEach(function(d){if(keep.includes(d))trimmed[d]=cleanHist[d]});
        setHistory_(trimmed);lss("nt-history",trimmed);
        setSunlight_(data.sunlight||{});lss("nt-sunlight",data.sunlight||{});
        setGiDistress_(data.gi||{});lss("nt-gi",data.gi||{});
        setRpp_(data.rpp||{});lss("nt-rpp",data.rpp||{});
        setSkipped_(data.skipped||{});lss("nt-skipped",data.skipped||{});
        setHydration_(data.hydration||{});lss("nt-hydration",data.hydration||{});
        cloudPut(userKey_,{profile:data.profile,meals:{meals:todayMeals,date:today()},templates:data.templates||[],history:trimmed,sunlight:data.sunlight||{},gi:data.gi||{},rpp:data.rpp||{},skipped:data.skipped||{},hydration:data.hydration||{}})
      }
      setSyncing(false);
    }).catch(function(){setSyncing(false)});
  },[userKey_]);

  const DT=profile?calcTargets(profile):{calories:2500,protein:120,fat:70,carbs:300,fiber:30,iron:8,zinc:11,magnesium:400,potassium:3500,vitaminD:2000,vitaminB6:1.5,vitaminB12:2.4,folate:400,calcium:1000,omega3:1.5};
  const prompt=profile?buildPrompt(profile):"";

  const syncTimer=useRef(null);
  const syncToCloud=useCallback(()=>{if(!userKey_)return;cloudPut(userKey_,{profile:ls("nt-profile",null),meals:ls("nt-meals",{}),templates:ls("nt-templates",[]),history:ls("nt-history",{}),sunlight:ls("nt-sunlight",{}),gi:ls("nt-gi",{}),rpp:ls("nt-rpp",{}),skipped:ls("nt-skipped",{}),hydration:ls("nt-hydration",{})})},[userKey_]);
  const scheduleSync=()=>{if(syncTimer.current)clearTimeout(syncTimer.current);syncTimer.current=setTimeout(syncToCloud,3000)};

  const update=(nm)=>{const t=today();setMeals_(nm);lss("nt-meals",{meals:nm,date:t});setHistory_(p=>{const u={...p,[t]:nm};const k=last10();const tr={};k.forEach(d=>{if(u[d])tr[d]=u[d]});lss("nt-history",tr);scheduleSync();return tr})};
  const wrap=fn=>{const nm=typeof fn==="function"?fn(meals):fn;update(nm)};
  useEffect(()=>{lss("nt-templates",templates);scheduleSync()},[templates]);
  useEffect(()=>{if(profile){lss("nt-profile",profile);scheduleSync()}},[profile]);
  const toggleSun=(date)=>{setSunlight_(p=>{const u={...p,[date]:!p[date]};lss("nt-sunlight",u);scheduleSync();return u})};
  const toggleGi=(date)=>{setGiDistress_(p=>{const u={...p,[date]:!p[date]};lss("nt-gi",u);scheduleSync();return u})};
  const setRpp=(date,val)=>{setRpp_(p=>{const u={...p,[date]:val};lss("nt-rpp",u);scheduleSync();return u})};
  const toggleSkip=(date,idx)=>{setSkipped_(p=>{const daySkips=p[date]||[];const u={...p,[date]:daySkips.includes(idx)?daySkips.filter(x=>x!==idx):[...daySkips,idx]};lss("nt-skipped",u);scheduleSync();return u})};
  const toggleHydration=(date)=>{setHydration_(p=>{const u={...p,[date]:!p[date]};lss("nt-hydration",u);scheduleSync();return u})};
  const getActiveBaseline=(date)=>{const daySkips=skipped[date]||[];return sum(templates.filter((_,i)=>!daySkips.includes(i)))};
  const addToday=m=>update([...meals,{...m}]);
  const addHist=(date,meal)=>{if(date===today()){addToday(meal)}else{setHistory_(p=>{const u={...p,[date]:[...(p[date]||[]),meal]};lss("nt-history",u);scheduleSync();return u})}};
  const delHist=(date,idx)=>{if(date===today()){update(meals.filter((_,i)=>i!==idx))}else{setHistory_(p=>{const dm=[...(p[date]||[])];dm.splice(idx,1);const u={...p};if(dm.length)u[date]=dm;else delete u[date];lss("nt-history",u);scheduleSync();return u})}};

  useEffect(()=>{if(profile?.lastCalibration){const diff=Math.floor((new Date()-new Date(profile.lastCalibration))/(1000*60*60*24));if(diff>=10)setShowCalib(true)}},[profile]);

  const handleCalibration=(result)=>{
    if(!profile)return;let mult=profile.multiplier||1;let msg="";
    if(result==="same"){const days=last10();const wd=days.filter(d=>history[d]);if(wd.length>=2){const avgCal=wd.reduce((s,d)=>s+sum(history[d]).calories,0)/wd.length;if(avgCal<DT.calories*0.85){mult=Math.min(mult*1.15,2.0);msg=`Portions increased by 15% (${mult.toFixed(2)}x).`}else msg="Tracking looks accurate!"}}
    else if(result==="lost")msg="Deficit is real. Consider eating more if unintended.";
    else if(result==="gained"){mult=Math.max(mult*0.9,0.7);msg=`Portions decreased by 10% (${mult.toFixed(2)}x).`}
    setProfile({...profile,multiplier:mult,lastCalibration:today()});setShowCalib(false);if(msg)alert(msg);
  };

  if(!userKey_||!profile){
    if(isAdmin)return<AdminPage onLogout={()=>setIsAdmin(false)}/>;
    if(newKey)return<ProfileSetup firstName={newFirstName} lastName={newLastName} onSave={p=>{setProfile(p);lss("nt-profile",p);setUserKey(newKey);lss("nt-user-key",newKey);cloudPut(newKey,{profile:p,meals:{},templates:[],history:{},sunlight:{},gi:{},rpp:{},skipped:{},hydration:{}})}}/>;
    return<LoginScreen onLogin={(key,data)=>{setUserKey(key);lss("nt-user-key",key);if(data&&data.profile){setProfile(data.profile);lss("nt-profile",data.profile)}}} onCreate={(fn,ln,pin,key)=>{setNewFirstName(fn);setNewLastName(ln);setNewKey(key)}} onAdmin={()=>setIsAdmin(true)}/>;
  }

  if(editProfile||editGoal)return<div><button className="btn btn-o btn-s" onClick={()=>{setEditProfile(false);setEditGoal(false)}} style={{marginBottom:16}}>← Back</button><ProfileSetup onSave={p=>{setProfile(p);setEditProfile(false);setEditGoal(false)}} initial={profile}/></div>;

  const nc=p=>page===p?"on":"";const goalLabel=GOALS.find(g=>g.id===profile.goal)?.label||"Maintain";
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <h1>Meal Analyzer</h1>
      <div className="fr" style={{gap:4}}>
        <button onClick={()=>{setUserKey(null);lss("nt-user-key",null);setProfile(null)}} style={{background:"none",border:"none",fontSize:13,cursor:"pointer",color:"#888"}} title="Log out">🚪</button>
        <button onClick={()=>setEditProfile(true)} style={{background:"none",border:"none",fontSize:13,cursor:"pointer",color:"#888"}} title="Edit profile">✏️</button>
      </div>
    </div>
    <p className="sub" style={{marginBottom:4}}>{profile.age}y, {profile.height}cm, {profile.weight}kg, {profile.trainingHours}h/day · {goalLabel} · {DIETS.find(d=>d.id===profile.diet)?.label||"Omnivore"}</p>
    <p style={{fontSize:12,color:"#16a34a",marginBottom:20}}>{DT.calories} kcal · {DT.protein}g prot · {DT.fat}g fat · {DT.carbs}g carbs{profile.multiplier>1?` · ${profile.multiplier.toFixed(2)}x`:""}</p>

    {syncing&&<div style={{textAlign:"center",padding:12,marginBottom:16,fontSize:13,color:"#888"}}>☁️ Syncing data…</div>}

    {showCalib&&<div style={{background:"#eff6ff",border:"1px solid #93c5fd",borderRadius:12,padding:20,marginBottom:24}}>
      <div style={{fontSize:16,fontWeight:600,color:"#1d4ed8",marginBottom:8}}>10-day calibration check</div>
      <p style={{fontSize:14,color:"#333",lineHeight:1.5,marginBottom:16}}>Have you noticed any weight change?</p>
      <div className="fc" style={{gap:8}}>
        <button className="btn" style={{background:"#1d4ed8"}} onClick={()=>handleCalibration("lost")}>I lost weight</button>
        <button className="btn btn-o" onClick={()=>handleCalibration("same")}>Weight is the same</button>
        <button className="btn btn-o" onClick={()=>handleCalibration("gained")}>I gained weight</button>
        <button style={{background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:13,marginTop:4}} onClick={()=>{setProfile({...profile,lastCalibration:today()});setShowCalib(false)}}>Skip</button>
      </div>
    </div>}

    <div className="nav">
      <button className={nc("today")} onClick={()=>setPage("today")}>Today</button>
      <button className={nc("templates")} onClick={()=>setPage("templates")}>Saved meals</button>
      <button className={nc("history")} onClick={()=>setPage("history")}>History</button>
    </div>
    {page==="today"&&<TodayPage meals={meals} setMeals={wrap} sun={!!sunlight[today()]} toggleSun={()=>toggleSun(today())} hydrated={!!hydration[today()]} toggleHydration={()=>toggleHydration(today())} gi={!!giDistress[today()]} toggleGi={()=>toggleGi(today())} rpp={rpp[today()]||0} setRpp={v=>setRpp(today(),v)} history={history} sunlight={sunlight} templates={templates} skipped={skipped[today()]||[]} toggleSkip={idx=>toggleSkip(today(),idx)} profile={profile} DT={DT} prompt={prompt} onEditGoal={()=>setEditGoal(true)}/>}
    {page==="templates"&&<TemplatesPage templates={templates} setTemplates={v=>{const r=typeof v==="function"?v(templates):v;setTemplates_(r);lss("nt-templates",r);scheduleSync()}} DT={DT} prompt={prompt}/>}
    {page==="history"&&<HistoryPage history={history} onAdd={addHist} onDel={delHist} sunlight={sunlight} giDistress={giDistress} hydration={hydration} rpp={rpp} setRpp={setRpp} templates={templates} skipped={skipped} DT={DT} prompt={prompt} profile={profile}/>}
  </div>
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
