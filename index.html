<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meal Analyzer</title><!-- v24 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root{
      --rose:oklch(60% 0.16 340); --rose-soft:oklch(94% 0.03 340);
      --good:oklch(58% 0.13 150); --good-soft:oklch(94% 0.04 150);
      --warn:oklch(70% 0.14 70); --warn-soft:oklch(94% 0.045 70);
      --bad:oklch(55% 0.17 25); --bad-soft:oklch(94% 0.045 25);
      --ink:oklch(20% 0.01 340); --ink-soft:oklch(45% 0.012 340); --ink-faint:oklch(55% 0.012 340);
      --gray:oklch(75% 0.02 340); --track:oklch(90% 0.008 340);
      --page-bg:oklch(96% 0.006 340); --card-bg:#fff; --border:oklch(90% 0.008 340); --border-soft:oklch(93% 0.006 340);
      --serif:'Source Serif 4',Georgia,serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--page-bg);-webkit-font-smoothing:antialiased}
    .app{max-width:640px;margin:0 auto;padding:20px 16px 124px}
    h1{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink)} .sub{font-size:14px;color:var(--ink-soft);margin-top:4px}
    .h-page{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);text-wrap:balance}
    .tog{display:flex;background:var(--page-bg);border-radius:12px;padding:3px;margin-bottom:16px}
    .tog button{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;background:transparent;color:var(--ink-soft);border-radius:10px}
    .tog button.on{background:#fff;color:var(--ink)}
    textarea{width:100%;min-height:90px;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;resize:vertical;outline:none;background:#fff}
    textarea:focus{border-color:var(--rose)}
    input[type=text],input[type=number],input[type=time],select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
    /* iOS Safari draws a time input as a native pill whose inner value element carries its
       own margin and does not shrink to the input's width, so it can spill past a narrow
       container. Flattening the appearance and zeroing that inner element keeps the control
       inside its box; the picker still opens on tap. */
    input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%}
    input[type=time]::-webkit-date-and-time-value{margin:0;min-width:0;text-align:inherit}
    input[type=time]::-webkit-calendar-picker-indicator{margin:0;padding:0}
    input:focus,select:focus{border-color:var(--rose)}
    .btn{padding:14px 0;background:var(--ink);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-rose{background:var(--rose)}
    .btn-s{padding:9px 14px;font-size:13px;width:auto;margin-top:0;border-radius:10px}
    .btn-o{background:#fff;color:var(--ink-soft);border:1px solid var(--border)}
    .btn-d{background:var(--bad);color:#fff;border:none}
    .btn-do{background:#fff;color:var(--bad);border:1px solid oklch(80% 0.1 25)}
    .btn-x{background:none;border:none;color:var(--gray);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
    .upl{background:#fff;border-radius:14px;border:1.5px dashed var(--gray);padding:32px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
    .prev{width:100%;max-height:280px;object-fit:cover;border-radius:14px;border:1px solid var(--border)}
    .card{background:var(--page-bg);border-radius:12px;padding:12px;text-align:center}
    .card-l{font-size:11px;color:var(--ink-soft);font-weight:500;margin-bottom:4px}
    .card-v{font-size:20px;font-weight:600} .card-s{font-size:11px;color:var(--gray);margin-top:2px}
    .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px}
    .gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:32px}
    .pbg{width:100%;height:6px;background:var(--track);border-radius:4px;overflow:hidden}
    .pf{height:100%;border-radius:4px;transition:width .4s ease}
    .stit{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
    .slab{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px}
    .mi{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid var(--border)}
    .mn{font-weight:500;font-size:14px} .mm{font-size:12px;color:var(--ink-soft);margin-top:4px}
    .err{background:var(--bad-soft);border:1px solid oklch(80% 0.1 25);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--bad)}
    .info{background:var(--warn-soft);border:1px solid oklch(85% 0.08 70);border-radius:16px;padding:16px;margin-bottom:24px;font-size:13px;color:oklch(38% 0.09 60);line-height:1.5}
    .defb{background:var(--bad-soft);border:1px solid oklch(85% 0.1 25);border-radius:16px;padding:16px;margin-bottom:24px}
    .deft{font-size:14px;font-weight:600;color:var(--bad);margin-bottom:8px}
    .deftags{display:flex;flex-wrap:wrap;gap:8px}
    .deftag{font-size:13px;background:#fff;border:1px solid oklch(85% 0.1 25);padding:4px 12px;border-radius:100px;color:var(--bad);font-weight:500}
    .dc{background:#fff;border:1px solid var(--border);border-radius:20px;padding:0;margin-bottom:12px;overflow:hidden}
    .pill{font-size:11px;padding:2px 8px;border-radius:100px;font-weight:500;display:inline-block;margin:2px}
    .fr{display:flex;gap:8px} .fc{display:flex;flex-direction:column;gap:8px}
    .field{margin-bottom:16px} .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sp{display:inline-block;width:20px;height:20px;border:2px solid var(--track);border-top-color:var(--ink);border-radius:50%;animation:spin .6s linear infinite}
    .collapse-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--ink-soft);font-weight:600;padding:0;display:flex;align-items:center;gap:4px}
    .panel{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--border)}
    .chip{padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
    .chip.on{background:var(--rose-soft);color:var(--rose);border-color:var(--rose)}
    .switch{width:46px;height:28px;border-radius:16px;padding:3px;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;flex-shrink:0;transition:background .15s}
    .switch-knob{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2);transition:margin .15s}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px}
    .toggle-row+.toggle-row{border-top:1px solid var(--border-soft)}
    .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);max-width:640px;margin:0 auto}
    .tab{flex:1;text-align:center;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;justify-content:center;cursor:pointer;background:none;border:none;padding:10px 0;min-height:52px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .tab-dot{width:24px;height:3px;border-radius:2px;background:transparent}
    .tab.on .tab-dot{background:var(--rose)}
    .tab-label{font-size:14px;font-weight:500;color:var(--gray)}
    .tab.on .tab-label{font-weight:700;color:var(--ink)}
    .chev{transition:transform .15s;flex-shrink:0}
    .chev.open{transform:rotate(0deg)} .chev.closed{transform:rotate(-90deg)}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   PERFORMANCE REPORT BUNDLE — for inline injection into index.html

   Exposes on window:
     window.buildPerformanceReport(state) → report object
     window.renderReportPDF(report)       → jsPDF doc

   REQUIRES: jsPDF loaded via CDN as window.jspdf.jsPDF
   ───────────────────────────────────────────────────────────── */
(function () {
  const MACROS = ["calories", "protein", "fat", "carbs", "fiber"];
  // Types are no longer a fixed list: users can add their own, so the engine reads whatever
  // the sessions carry. Labels fall back to the raw id for a workout it has never seen.
  // Keyword lift needs several GI days to mean anything: with one or two, every
  // keyword eaten that day looks like a trigger simply because there is nothing
  // to contrast it against. Below this, the report reports no conclusions.
  const GI_MIN_DAYS = 5;
  const HABIT_VARS = [
    { key: "sun_freq",       label: "Sun exposure frequency" },
    { key: "hydration_freq", label: "Hydration frequency" },
    { key: "sleep_quality",  label: "Sleep quality (0-1)" },
    { key: "avg_protein",    label: "Average daily protein" },
    { key: "avg_carbs",      label: "Average daily carbs" },
    { key: "avg_calories",   label: "Average daily calories" },
    { key: "avg_fiber",      label: "Average daily fiber" },
  ];

  function parseDateTime(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    const [h, m] = timeStr.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const d = new Date(dateStr + "T00:00:00");
    d.setHours(h, m, 0, 0);
    return d;
  }
  function addHours(date, hours) { return new Date(date.getTime() + hours * 3600 * 1000); }
  function daysBetween(a, b) { return Math.floor((b - a) / (1000 * 60 * 60 * 24)); }
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T12:00:00");
    d.setDate(d.getDate() + delta);
    return isoDate(d);
  }

  function spearman(xs, ys) {
    if (!xs || !ys || xs.length !== ys.length || xs.length < 3) return null;
    const n = xs.length;
    const rankOf = (arr) => {
      const indexed = arr.map((v, i) => ({ v, i }));
      indexed.sort((a, b) => a.v - b.v);
      const ranks = new Array(n);
      let i = 0;
      while (i < n) {
        let j = i;
        while (j + 1 < n && indexed[j + 1].v === indexed[i].v) j++;
        const avgRank = (i + j) / 2 + 1;
        for (let k = i; k <= j; k++) ranks[indexed[k].i] = avgRank;
        i = j + 1;
      }
      return ranks;
    };
    const rx = rankOf(xs); const ry = rankOf(ys);
    const allSame = (arr) => arr.every((v) => v === arr[0]);
    if (allSame(rx) || allSame(ry)) return null;
    const meanX = rx.reduce((a, b) => a + b, 0) / n;
    const meanY = ry.reduce((a, b) => a + b, 0) / n;
    let num = 0, denX = 0, denY = 0;
    for (let i = 0; i < n; i++) {
      const dx = rx[i] - meanX; const dy = ry[i] - meanY;
      num += dx * dy; denX += dx * dx; denY += dy * dy;
    }
    const den = Math.sqrt(denX * denY);
    return den === 0 ? null : num / den;
  }

  function mean(arr) { if (!arr || arr.length === 0) return 0; return arr.reduce((a, b) => a + b, 0) / arr.length; }
  function correlationConfidence(rho, n) {
    return Math.round(Math.min(n / 15, 1) * Math.min(Math.abs(rho) / 0.6, 1) * 100);
  }
  function meanDiffConfidence(delta, nMin) {
    return Math.round(Math.min(nMin / 10, 1) * Math.min(Math.abs(delta) / 2, 1) * 100);
  }

  // Nothing below this confidence is printed: every finding in the report clears it.
  const MIN_CONFIDENCE = 50;

  // Nothing in the app marks a meal as a supplement, so they are spotted by name in what
  // the user logged — the same rough keyword approach the food rating uses. A supplement
  // never logged is simply never tested.
  const SUPPLEMENTS = [
    { key: "bcaa",         label: "BCAA / EAA",      words: ["bcaa", "bcaas", "eaa", "eaas", "branched chain", "branched-chain"] },
    { key: "creatine",     label: "Creatine",        words: ["creatine", "creatina"] },
    { key: "omega3supp",   label: "Omega-3",         words: ["omega 3", "omega-3", "omega3", "fish oil", "krill oil"] },
    { key: "electrolytes", label: "Electrolytes",    words: ["electrolyte", "electrolytes", "isotonic", "rehydration", "lmnt"] },
    { key: "betaalanine",  label: "Beta-alanine",    words: ["beta alanine", "beta-alanine", "betaalanine"] },
    { key: "preworkout",   label: "Pre-workout",     words: ["pre workout", "pre-workout", "preworkout"] },
    { key: "caffeinesupp", label: "Caffeine",        words: ["caffeine", "caffeina"] },
    { key: "wheysupp",     label: "Protein powder",  words: ["whey", "casein", "protein powder", "protein shake"] },
    { key: "magnesiumsupp",label: "Magnesium",       words: ["magnesium", "magnesio"] },
    { key: "vitdsupp",     label: "Vitamin D",       words: ["vitamin d", "vit d", "cholecalciferol"] },
    { key: "ironsupp",     label: "Iron supplement", words: ["iron supplement", "iron tablet", "ferrous"] },
    { key: "zincsupp",     label: "Zinc supplement", words: ["zinc supplement", "zinc tablet"] },
  ];
  // Things people take for sleep rather than for training. Tested against sleep only.
  const SLEEP_AIDS = [
    { key: "chamomile",     label: "Chamomile",     words: ["chamomile", "camomile", "camomilla", "kamille"] },
    { key: "melatonin",     label: "Melatonin",     words: ["melatonin", "melatonina"] },
    { key: "valerian",      label: "Valerian",      words: ["valerian", "valeriana"] },
    { key: "theanine",      label: "L-theanine",    words: ["theanine", "l-theanine"] },
    { key: "glycine",       label: "Glycine",       words: ["glycine"] },
    { key: "lemonbalm",     label: "Lemon balm",    words: ["lemon balm", "melissa"] },
    { key: "lavender",      label: "Lavender",      words: ["lavender", "lavanda"] },
    { key: "passionflower", label: "Passionflower", words: ["passionflower", "passion flower", "passiflora"] },
    { key: "tartcherry",    label: "Tart cherry",   words: ["tart cherry", "montmorency", "cherry juice"] },
    { key: "herbaltea",     label: "Herbal tea",    words: ["herbal tea", "tisane", "infusion"] },
  ];
  const SUPP_LABEL = {};
  [...SUPPLEMENTS, ...SLEEP_AIDS].forEach((s) => { SUPP_LABEL[s.key] = s.label; });

  // Which of `catalogue` appear in this set of meals. Reads item names as well as the meal
  // name, so a supplement listed alongside food is still found. Single words match whole
  // tokens; phrases match as substrings.
  function supplementsIn(meals, catalogue) {
    const hay = (meals || []).map((m) => [m.mealName || ""].concat(itemsOf(m).map((it) => it.name || "")).join(" ")).join(" ").toLowerCase();
    const tokens = new Set(hay.split(/[^a-z0-9]+/).filter(Boolean));
    const found = new Set();
    catalogue.forEach((s) => { if (s.words.some((w) => (w.includes(" ") ? hay.includes(w) : tokens.has(w)))) found.add(s.key); });
    return found;
  }

  const rppSessions = (v) => Array.isArray(v) ? v.filter((s) => s && typeof s === "object")
    : (v && typeof v === "object") ? [v] : [];
  const toHHMM = (mins) => String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(Math.round(mins % 60)).padStart(2, "0");

  // What to assume when a session was logged with only a score — easy to do, since the
  // score is the first thing asked for. The user's own habits are the best guess there
  // is: the type they log most often, and their average training time. A session that
  // used to be dropped for being incomplete now counts, and the report says how many did.
  function rppDefaults(rpp) {
    const all = [];
    Object.keys(rpp || {}).forEach((d) => rppSessions(rpp[d]).forEach((r) => all.push(r)));
    const tally = {};
    all.forEach((r) => { if (r && r.trainingType) tally[r.trainingType] = (tally[r.trainingType] || 0) + 1; });
    const type = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || null;
    const mins = all.map((r) => (r && r.trainingTime) ? minsOfTime(r.trainingTime) : null).filter((v) => v !== null);
    const time = mins.length ? toHHMM(mins.reduce((a, b) => a + b, 0) / mins.length) : null;
    return { type, time };
  }

  function extractSessions(history, rpp) {
    // A day can hold several workouts, so flatten to a chronological list of sessions
    // rather than one per date. Older data stores a single object, or a bare score.
    const def = rppDefaults(rpp);
    const entries = [];
    Object.keys(rpp).sort().forEach((d) => {
      rppSessions(rpp[d])
        .filter((r) => r.score > 0)
        .forEach((r) => {
          const trainingTime = r.trainingTime || def.time;
          const trainingType = r.trainingType || def.type;
          if (!trainingTime) return;                       // no time anywhere: cannot place it
          const dt = parseDateTime(d, trainingTime);
          if (dt) entries.push({ date: d, dt,
            r: { ...r, trainingTime, trainingType,
                 assumedTime: !r.trainingTime, assumedType: !r.trainingType } });
        });
    });
    entries.sort((a, b) => a.dt - b.dt);
    const sessions = [];
    for (let i = 0; i < entries.length; i++) {
      const date = entries[i].date;
      const r = entries[i].r;
      const trainingDT = entries[i].dt;
      const W1_start = addHours(trainingDT, -3);
      const W1_end = trainingDT;
      const W2_start = addHours(trainingDT, -12);
      const W2_end = W1_start;
      let W3_start = null, W3_end = null;
      if (i > 0) {
        // The recovery window runs from the previous SESSION, which may be earlier the
        // same day now that a day can hold more than one.
        const prevDT = entries[i - 1].dt;
        if (daysBetween(prevDT, trainingDT) <= 2) {
          W3_start = prevDT; W3_end = addHours(prevDT, 24);
        }
      }
      const relevantDates = new Set([date, addDays(date, -1)]);
      if (W3_start) relevantDates.add(isoDate(W3_start));
      const meals = [];
      relevantDates.forEach((d) => {
        (history[d] || []).forEach((m) => {
          const mealDT = parseDateTime(m.date || d, m.time);
          if (mealDT) meals.push({ ...m, _dt: mealDT });
        });
      });
      const inRange = (dt, start, end) => dt >= start && dt < end;
      const sumMacros = (mealSubset) => {
        const totals = {}; MACROS.forEach((k) => (totals[k] = 0));
        mealSubset.forEach((m) => { MACROS.forEach((k) => { const v = Number(m[k]); totals[k] += isNaN(v) ? 0 : v; }); });
        return totals;
      };
      const W1_meals = meals.filter((m) => inRange(m._dt, W1_start, W1_end));
      const W2_meals = meals.filter((m) => inRange(m._dt, W2_start, W2_end));
      const W3_meals = W3_start ? meals.filter((m) => inRange(m._dt, W3_start, W3_end)) : [];
      sessions.push({
        date, score: r.score, trainingTime: r.trainingTime, trainingType: r.trainingType,
        assumedTime: !!r.assumedTime, assumedType: !!r.assumedType,
        W1: sumMacros(W1_meals), W2: sumMacros(W2_meals), W3: W3_start ? sumMacros(W3_meals) : null,
        W1_count: W1_meals.length, W2_count: W2_meals.length, W3_count: W3_meals.length,
        // Which supplements were taken in each window, for the correlations below.
        W1_supps: supplementsIn(W1_meals, SUPPLEMENTS), W2_supps: supplementsIn(W2_meals, SUPPLEMENTS),
        W3_supps: W3_start ? supplementsIn(W3_meals, SUPPLEMENTS) : new Set(),
      });
    }
    return sessions;
  }

  function tier1(sessions) {
    const findings = {};
    // Grouped by the types actually present, so a users own workout is analysed like any other.
    [...new Set(sessions.map((s) => s.trainingType).filter(Boolean))].forEach((type) => {
      const typeSessions = sessions.filter((s) => s.trainingType === type);
      if (typeSessions.length < 5) return;
      const perType = [];
      ["W1", "W2", "W3"].forEach((window) => {
        const valid = typeSessions.filter((s) => s[window] !== null);
        if (valid.length < 5) return;
        MACROS.forEach((macro) => {
          const xs = valid.map((s) => s[window][macro]);
          const ys = valid.map((s) => s.score);
          const rho = spearman(xs, ys);
          if (rho === null) return;
          const confidence = correlationConfidence(rho, valid.length);
          if (Math.abs(rho) < 0.3 || confidence <= MIN_CONFIDENCE) return;
          const sortedByX = valid.slice().sort((a, b) => a[window][macro] - b[window][macro]);
          const mid = Math.floor(sortedByX.length / 2);
          const lowGroup = sortedByX.slice(0, mid);
          const highGroup = sortedByX.slice(sortedByX.length - mid);
          perType.push({
            window, macro,
            rho: Math.round(rho * 100) / 100, n: valid.length, confidence,
            direction: rho > 0 ? "positive" : "negative",
            groups: {
              low: { rppAvg: Math.round(mean(lowGroup.map((s) => s.score)) * 10) / 10, macroAvg: Math.round(mean(lowGroup.map((s) => s[window][macro]))), n: lowGroup.length },

  }

  // Sleep is a three-level scale ("bad" | "mediocre" | "good"). Nights logged before the
  // middle level existed are booleans, so everything reads through this.
  const sleepLvl = (v) => v === true ? "good" : v === false ? "bad"
    : (v === "good" || v === "mediocre" || v === "bad") ? v : undefined;

  function tier2(sessions, sunlight, sleep, hydration) {
    const results = {};
    const check = (name, predicate) => {
      const withTrue = sessions.filter((s) => predicate(s.date) === true);
      const withFalse = sessions.filter((s) => predicate(s.date) !== true);
      if (withTrue.length < 3 || withFalse.length < 3) return null;
      const meanTrue = mean(withTrue.map((s) => s.score));
      const meanFalse = mean(withFalse.map((s) => s.score));
      const delta = meanTrue - meanFalse;
      if (Math.abs(delta) < 0.5) return null;
      const confidence = meanDiffConfidence(delta, Math.min(withTrue.length, withFalse.length));
      if (confidence <= MIN_CONFIDENCE) return null;
      return { meanTrue: Math.round(meanTrue * 10) / 10, meanFalse: Math.round(meanFalse * 10) / 10, nTrue: withTrue.length, nFalse: withFalse.length, delta: Math.round(delta * 10) / 10, confidence };
    };
    const sun = check("sun", (d) => !!sunlight[d]); if (sun) results.sun = sun;
    const hyd = check("hydration", (d) => !!hydration[d]); if (hyd) results.hydration = hyd;
    const slp = check("sleep", (d) => sleepLvl(sleep[d]) === "good"); if (slp) results.sleep = slp;
    return results;
  }

  function tier3(history, sleep, sunlight, rpp) {
    const sleepDates = Object.keys(sleep).filter((d) => { const l = sleepLvl(sleep[d]); return l === "good" || l === "bad"; });  // mediocre sits out: tier3 contrasts the two ends
    if (sleepDates.length < 6) return null;

      const dayMeals = history[d] || [];
      const dayR = rpp[d];
      // With several workouts in a day, the one that can push into the night is the last.
      const dayTimes = (Array.isArray(dayR) ? dayR : dayR && typeof dayR === "object" ? [dayR] : [])
        .map((s) => s && s.trainingTime ? parseDateTime(d, s.trainingTime) : null).filter(Boolean);
      const trainingDT = dayTimes.length ? new Date(Math.max(...dayTimes.map((x) => x.getTime()))) : null;
      const totals = {}; MACROS.forEach((k) => (totals[k] = 0));
      dayMeals.forEach((m) => { MACROS.forEach((k) => { const v = Number(m[k]); totals[k] += isNaN(v) ? 0 : v; }); });

      dayMeals.forEach((m) => {
        if (m.time) { const [h, mm] = m.time.split(":").map(Number); const total = h + mm / 60; if (lastMealHour === null || total > lastMealHour) lastMealHour = total; }

        supps: supplementsIn(dayMeals, [...SUPPLEMENTS, ...SLEEP_AIDS]), late_training: lateTraining, sun: !!sunlight[d] };
    });

    const poor = nights.filter((n) => !n.slept_well);
    if (well.length < 3 || poor.length < 3) return null;
    const factors = {};
    const contFactors = [{ key: "carbs", label: "Daily carbs" }, { key: "calories", label: "Daily calories" }];
    contFactors.forEach(({ key, label }) => {
      const wellVals = well.map((n) => n[key]).filter((v) => v > 0);
      const poorVals = poor.map((n) => n[key]).filter((v) => v > 0);
      if (wellVals.length < 3 || poorVals.length < 3) return;
      const wellMean = mean(wellVals); const poorMean = mean(poorVals);

    });

    const lmhPoor = poor.map((n) => n.last_meal_hour).filter((v) => v !== null);
    if (lmhWell.length >= 3 && lmhPoor.length >= 3) {

      const has = pick || ((n) => !!n[key]);

      if (Math.abs(wellRate - poorRate) < 0.15) return;
      const bin_conf = Math.round(Math.min(Math.min(well.length, poor.length) / 10, 1) * Math.min(Math.abs(wellRate - poorRate) / 0.5, 1) * 100);
      if (bin_conf <= MIN_CONFIDENCE) return;
      factors[key] = { label, wellRate: Math.round(wellRate * 100), poorRate: Math.round(poorRate * 100), nWell: well.length, nPoor: poor.length, confidence: Math.round(Math.min(Math.min(well.length, poor.length) / 10, 1) * Math.min(Math.abs(wellRate - poorRate) / 0.4, 1) * 100) };

    checkBinary("sun", "Sun exposure that day");
    // Supplements and sleep aids, each tested the same way: how often it was taken on
    // well-slept nights against poor-slept ones. Only those actually logged are tested.
    const suppsSeen = new Set();
    nights.forEach((n) => (n.supps || new Set()).forEach((k) => suppsSeen.add(k)));
    suppsSeen.forEach((k) => checkBinary("supp_" + k, SUPP_LABEL[k] || k, (n) => (n.supps || new Set()).has(k)));
    return { nWell: well.length, nPoor: poor.length, factors };
  }

  function buildDailySeries(history, rpp, sunlight, sleep, hydration) {
    const dates = new Set();
    Object.keys(history).forEach((d) => dates.add(d));
    Object.keys(rpp).forEach((d) => dates.add(d));
    Object.keys(sunlight).forEach((d) => dates.add(d));
    Object.keys(sleep).forEach((d) => dates.add(d));
    Object.keys(hydration).forEach((d) => dates.add(d));

    const first = sorted[0]; const last = sorted[sorted.length - 1];
    const full = []; let cursor = first;
    while (cursor <= last) { full.push(cursor); cursor = addDays(cursor, 1); }
    const series = { sun_freq: [], hydration_freq: [], sleep_quality: [], avg_protein: [], avg_carbs: [], avg_calories: [], avg_fiber: [], rpp: [] };
    full.forEach((d) => {
      series.sun_freq.push(sunlight[d] === true ? 1 : 0);
      series.hydration_freq.push(hydration[d] === true ? 1 : 0);
      series.sleep_quality.push((l => l === "good" ? 1 : l === "mediocre" ? 0.5 : l === "bad" ? 0 : null)(sleepLvl(sleep[d])));
      const meals = history[d] || [];
      const dm = { protein: 0, carbs: 0, calories: 0, fiber: 0 };
      meals.forEach((m) => { dm.protein += Number(m.protein) || 0; dm.carbs += Number(m.carbs) || 0; dm.calories += Number(m.calories) || 0; dm.fiber += Number(m.fiber) || 0; });

      series.avg_carbs.push(hasMeals ? dm.carbs : null);
      series.avg_calories.push(hasMeals ? dm.calories : null);
      series.avg_fiber.push(hasMeals ? dm.fiber : null);

      const rs = Array.isArray(rpp[d]) ? rpp[d] : (rpp[d] && typeof rpp[d] === "object" ? [rpp[d]] : []);
      const scores = rs.map((s) => Number(s && s.score)).filter((n) => n > 0);
      const score = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : (typeof rpp[d] === "number" ? rpp[d] : 0);

  }
  function rollingMean(arr, window, endIdx) {

  }
  function tier4(history, rpp, sunlight, sleep, hydration) {
    const { dates, series } = buildDailySeries(history, rpp, sunlight, sleep, hydration);
    if (dates.length < 60) return { changes: [], note: "Need at least 60 days of history for habit-change detection." };
    const WINDOW = 28, MIN_PERSIST = 14, REL_THRESHOLD = 0.20, RPP_THRESHOLD = 0.4;
    const changes = [];
    HABIT_VARS.forEach((v) => {
      const s = series[v.key];

      for (let i = WINDOW; i < dates.length - MIN_PERSIST; i++) {
        const before = rolling[i - WINDOW]; const after = rolling[i];
        if (before === null || after === null) continue;

        const persistVal = rolling[persistIdx];

        if (Math.abs(persistRel) < REL_THRESHOLD * 0.7) continue;

        const rppAfter = rollingMean(series.rpp, WINDOW, persistIdx);
        if (rppBefore === null || rppAfter === null) continue;
        const rppDelta = rppAfter - rppBefore;
        if (Math.abs(rppDelta) < RPP_THRESHOLD) continue;
        changes.push({ variable: v.key, label: v.label, date: dates[i], before: Math.round(before * 100) / 100, after: Math.round(after * 100) / 100, relChange: Math.round(relChange * 100), rppBefore: Math.round(rppBefore * 10) / 10, rppAfter: Math.round(rppAfter * 10) / 10, rppDelta: Math.round(rppDelta * 10) / 10 });
        i += WINDOW;

    changes.forEach((c) => {

        last.coOccurring = last.coOccurring || [last.variable];

  }

  function giSection(history, giDistress) {
    const daysWithData = Object.keys(history).filter((d) => history[d] && history[d].length > 0);
    const giDates = Object.keys(giDistress).filter((d) => giDistress[d]);
    const okDays = daysWithData.filter((d) => !giDistress[d]);
    if (giDates.length < 1 || daysWithData.length < 3) return null;
    // Too few GI days to draw from — report the count, but no trigger analysis.
    // Returning a record rather than null keeps the section visible so the reader
    // can see how much further they have to track.
    if (giDates.length < GI_MIN_DAYS) {
      return { giDays: giDates.length, totalDays: daysWithData.length, triggers: [], belowThreshold: true, minDays: GI_MIN_DAYS };
    }
    const stopWords = ["with", "and", "the", "for", "cup", "some", "two", "one", "per", "from"];
    const extractKeywords = (meals) => {
      const words = new Set();
      // Keywords come from the individual foods, not the plate: "pasta and shrimps"
      // should let the report blame the shrimps rather than the whole meal.
      (meals || []).forEach((m) => {
        itemsOf(m).forEach((it) => {
          const name = (it.name || "").toLowerCase().replace(/[^a-zàèéìòùäöü\s]/g, "");
          name.split(/\s+/).filter((w) => w.length > 2 && !stopWords.includes(w)).forEach((w) => words.add(w));
        });
      });

    };

    // "what was eaten in the 24h before this GI report" regardless of which
    // calendar day(s) those meals actually fall on.
    const allMeals = [];
    Object.keys(history).forEach((d) => {
      (history[d] || []).forEach((m) => {
        const dt = parseDateTime(m.date || d, m.time);
        if (dt) allMeals.push({ mealName: m.mealName, _dt: dt });
      });
    });
    const giKeywords = {}, okKeywords = {};
    giDates.forEach((d) => {
      const clickDT = typeof giDistress[d] === "string" ? parseDateTime(d, giDistress[d]) : null;
      let suspectMeals;
      if (clickDT) {
        const windowStart = new Date(clickDT.getTime() - 24 * 3600 * 1000);
        suspectMeals = allMeals.filter((m) => m._dt >= windowStart && m._dt < clickDT);
      } else {
        // No click time recorded (older data logged before this fix) — fall back to the whole day.
        suspectMeals = history[d] || [];
      }
      extractKeywords(suspectMeals).forEach((w) => { giKeywords[w] = (giKeywords[w] || 0) + 1; });
    });
    okDays.forEach((d) => extractKeywords(history[d]).forEach((w) => { okKeywords[w] = (okKeywords[w] || 0) + 1; }));

    const triggers = [];
    Object.keys(giKeywords).forEach((word) => {

      const total = giCount + okCount;

  }

  // The engine's own copy of the items accessor — it is meant to stand alone. A meal
  // logged before items existed falls back to itself, so old history still analyses.
  function itemsOf(m) {
    if (!m) return [];
    if (Array.isArray(m.items) && m.items.length) return m.items.filter((it) => it && it.name);
    return [{ name: m.mealName || "meal", calories: m.calories, protein: m.protein, fat: m.fat, carbs: m.carbs, fiber: m.fiber }];
  }
  // A declaration, not a const: rppDefaults above is defined before this point.

  // ── Overnight fast ────────────────────────────────────────────────

  // so those pairs are skipped instead of counting as very long fasts.
  function fastingSection(history) {
    const days = Object.keys(history || {}).filter((d) => (history[d] || []).some((m) => minsOfTime(m.time) !== null)).sort();
    const nights = [];
    for (let i = 1; i < days.length; i++) {
      if (daysBetween(new Date(days[i - 1] + "T12:00:00"), new Date(days[i] + "T12:00:00")) !== 1) continue;
      const prev = (history[days[i - 1]] || []).map((m) => minsOfTime(m.time)).filter((v) => v !== null);
      const next = (history[days[i]] || []).map((m) => minsOfTime(m.time)).filter((v) => v !== null);

      avgFirstMeal: hourToClock(nights.reduce((s, n) => s + n.firstMeal, 0) / nights.length / 60),

  }

  // ── Food quality rating ───────────────────────────────────────────

  // section says so on the page.
  const WHOLE_FOOD_WORDS = ["vegetable","vegetables","veg","salad","spinach","broccoli","kale","carrot","carrots","tomato","tomatoes","cucumber","pepper","peppers","courgette","zucchini","aubergine","eggplant","cauliflower","cabbage","lettuce","rocket","onion","onions","garlic","mushroom","mushrooms","beans","bean","lentil","lentils","chickpea","chickpeas","quinoa","oats","oatmeal","porridge","wholegrain","wholemeal","barley","buckwheat","fruit","apple","banana","berries","blueberries","strawberries","raspberries","orange","pear","peach","grapes","kiwi","melon","avocado","nuts","almond","almonds","walnut","walnuts","cashew","cashews","seeds","chia","flax","yoghurt","yogurt","kefir","egg","eggs","chicken","turkey","beef","lamb","fish","salmon","tuna","cod","mackerel","sardines","shrimp","prawns","tofu","tempeh","rice","potato","potatoes","soup","stew","broth","hummus"];

  function foodQualitySection(history) {

    meals.forEach((m) => itemsOf(m).forEach((it) => rows.push({ name: it.name || "food", cls: classifyMeal(it.name), mins: minsOfTime(m.time) })));
