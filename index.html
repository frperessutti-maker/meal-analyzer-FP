    processed.forEach((r) => { const k = r.name.toLowerCase(); tally[k] = tally[k] || { name: r.name, n: 0 }; tally[k].n++; });
    const lateTally = {};
    late.forEach((r) => { const k = r.name.toLowerCase(); lateTally[k] = lateTally[k] || { name: r.name, n: 0 }; lateTally[k].n++; });
    return {
      stars, totalItems: rows.length, totalMeals: meals.length,
      wholeCount: whole.length, wholePct: Math.round(whole.length / rows.length * 100),
      processedCount: processed.length, processedPct: Math.round(processed.length / rows.length * 100),
      lateCount: late.length, latePct: Math.round(late.length / rows.length * 100),
      neutralCount: rows.filter((r) => r.cls === "neutral").length,
      penaltyPct: Math.round(share * 100),
      withinAllowance: share > 0 && share <= CHEAT_ALLOWANCE,
      worstOffenders: Object.values(tally).sort((a, b) => b.n - a.n).slice(0, 4),
      lateOffenders: Object.values(lateTally).sort((a, b) => b.n - a.n).slice(0, 3),
    };
  }

  // ── Nutrient tables ───────────────────────────────────────────────
  // `targets` is supplied by the app ({macros:[{key,label,unit,target}], micros:[...]}) so
  // the engine stays agnostic about which nutrients exist. `dailyExtras` carries non-food
  // contributions the app knows about, currently vitamin D from sun exposure.
  function nutrientStatus(pct) {
    if (pct === null) return { word: "-", tone: "neutral" };
    if (pct < 70) return { word: "Deficient", tone: "bad" };
    if (pct < 90) return { word: "Low", tone: "warn" };
    if (pct <= 110) return { word: "On target", tone: "good" };
    if (pct <= 200) return { word: "High", tone: "warn" };
    return { word: "Excess", tone: "bad" };
  }
  function nutrientSection(history, targets, dailyExtras) {
    if (!targets || (!targets.macros && !targets.micros)) return null;
    const days = Object.keys(history || {}).filter((d) => history[d] && history[d].length > 0);
    if (days.length < 3) return null;
    const dailyTotal = (d, key) => {
      let t = 0;
      (history[d] || []).forEach((m) => { const v = Number(m[key]); if (!isNaN(v)) t += v; });
      const ex = dailyExtras && dailyExtras[d] ? Number(dailyExtras[d][key]) : 0;
      if (!isNaN(ex)) t += ex;
      return t;
    };
    const buildRows = (list) => (list || []).map((n) => {
      const avg = days.reduce((s, d) => s + dailyTotal(d, n.key), 0) / days.length;
      const pct = n.target ? Math.round((avg / n.target) * 100) : null;
      return { key: n.key, label: n.label, unit: n.unit || "", target: n.target, avg: Math.round(avg * 10) / 10, pct, status: nutrientStatus(pct) };
    });
    const macros = buildRows(targets.macros), micros = buildRows(targets.micros);
    // For each nutrient that falls short, which meal the user already eats is its best
    // source? Ranked by what one serving delivers rather than by the weekly total, so a
    // staple contributing a little every day cannot crowd out the meal that would
    // actually move the number.
    const short = [...macros, ...micros].filter((r) => r.pct !== null && r.pct < 90);
    const opportunities = [];
    short.forEach((n) => {
      // Attributed to the individual food where the items carry that nutrient, so the
      // advice is "more shrimps" rather than "more pasta and shrimps". Items only carry
      // calories and the macros, so micronutrients still fall back to the whole meal.
      const byName = {};
      days.forEach((d) => (history[d] || []).forEach((m) => {
        const sources = itemsOf(m).some((it) => Number(it[n.key]) > 0)
          ? itemsOf(m).map((it) => ({ name: it.name, v: Number(it[n.key]) }))
          : [{ name: m.mealName || "meal", v: Number(m[n.key]) }];
        sources.forEach((s) => {
          if (isNaN(s.v) || s.v <= 0) return;
          const k = (s.name || "meal").trim().toLowerCase();
          byName[k] = byName[k] || { name: s.name || "meal", total: 0, count: 0 };
          byName[k].total += s.v; byName[k].count++;
        });
      }));
      const best = Object.values(byName)
        .map((e) => ({ ...e, per: e.total / e.count, share: n.target ? (e.total / e.count) / n.target : 0 }))
        .sort((a, b) => b.per - a.per)[0];
      if (best && best.share >= 0.15) {
        opportunities.push({ nutrient: n.label, unit: n.unit, pct: n.pct, meal: best.name,
          per: Math.round(best.per * 10) / 10, sharePct: Math.round(best.share * 100), count: best.count });
      }
    });
    // One meal is usually the best source of several things at once, so group by meal
    // rather than listing "eat more salmon" once per nutrient.
    const byMeal = {};
    opportunities.forEach((o) => {
      const k = o.meal.toLowerCase();
      byMeal[k] = byMeal[k] || { meal: o.meal, count: o.count, nutrients: [] };
      byMeal[k].nutrients.push({ label: o.nutrient, unit: o.unit, pct: o.pct, per: o.per, sharePct: o.sharePct });
    });
    const grouped = Object.values(byMeal).map((g) => ({
      ...g,
      nutrients: g.nutrients.sort((a, b) => a.pct - b.pct),
      lowestPct: Math.min(...g.nutrients.map((x) => x.pct)),
    })).sort((a, b) => a.lowestPct - b.lowestPct).slice(0, 4);
    return { days: days.length, macros, micros, opportunities: grouped };
  }

  function buildReport(state) {
    const { history = {}, rpp = {}, sunlight = {}, sleep = {}, hydration = {}, giDistress = {} } = state;
    const sessions = extractSessions(history, rpp);
    const activeDays = Object.keys(history).filter((d) => history[d] && history[d].length > 0);
    return {
      meta: {
        generatedAt: new Date().toISOString(),
        totalDaysLogged: activeDays.length,
        totalSessions: sessions.length,
        assumedSessions: sessions.filter((s) => s.assumedTime || s.assumedType).length,
        sessionsByType: sessions.reduce((acc, s) => { if (s.trainingType) acc[s.trainingType] = (acc[s.trainingType] || 0) + 1; return acc; }, {}),
      },
      tier1: tier1(sessions),
      tier2: tier2(sessions, sunlight, sleep, hydration),
      tier3: tier3(history, sleep, sunlight, rpp),
      tier4: tier4(history, rpp, sunlight, sleep, hydration),
      gi: giSection(history, giDistress),
      fasting: fastingSection(history),
      foodQuality: foodQualitySection(history),
      nutrients: nutrientSection(history, state.targets, state.dailyExtras),
    };
  }

  /* ─── PDF RENDERER ─── */
  const TRAINING_LABELS = { strength: "Strength", hiit: "HIIT / Conditioning", endurance: "Endurance", skill: "Skill / Technical", recovery: "Recovery / Mobility", other: "Other" };
  // A workout the user invented has no entry here, so fall back to its own name.
  const labelOfType = (t) => TRAINING_LABELS[t] || String(t || "").replace(/-/g, " ").replace(/^./, (c) => c.toUpperCase());
  const iconOfType = (t) => TRAINING_ICONS[t] || String(t || "???").slice(0, 3).toUpperCase();
  const TRAINING_ICONS = { strength: "STR", hiit: "HIT", endurance: "END", skill: "SKL", recovery: "REC", other: "OTH" };
  const WINDOW_LABELS = { W1: "the 3 hours before training", W2: "the 3-12 hours before training", W3: "the 24-hour recovery window after the previous session" };
  const WINDOW_SHORT = { W1: "before the session", W2: "3-12 hours before the session", W3: "during the previous 24 hours of recovery" };
  const MACRO_LABELS = { calories: "calories", protein: "protein", fat: "fat", carbs: "carbs", fiber: "fiber" };
  const MACRO_UNITS = { calories: "Cal", protein: "g", fat: "g", carbs: "g", fiber: "g" };
  const SLEEP_FACTOR_UNITS = { carbs: "g", calories: "Cal", protein: "g", fiber: "g" };

  function confidenceLabel(c) { if (c >= 75) return "high"; if (c >= 50) return "medium"; if (c >= 25) return "low"; return "preliminary"; }
  function filledDots(c) { return c >= 75 ? 4 : c >= 50 ? 3 : c >= 25 ? 2 : 1; }
  function drawDots(doc, x, y, conf, color) {
    const filled = filledDots(conf); const r = 0.9; const gap = 2.4;
    for (let i = 0; i < 4; i++) {
      const cx = x + i * gap;
      if (i < filled) { doc.setFillColor(...color); doc.circle(cx, y - 1.2, r, "F"); }
      else { doc.setDrawColor(...color); doc.setLineWidth(0.2); doc.circle(cx, y - 1.2, r, "S"); }
    }
    return x + 4 * gap;
  }
  function formatDate(iso) { if (!iso) return ""; const d = new Date(iso + (iso.includes("T") ? "" : "T12:00:00")); return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); }
  function hourToClock(h) { if (h === null || h === undefined) return ""; const hh = Math.floor(h); const mm = Math.round((h - hh) * 60); return `${hh.toString().padStart(2, "0")}:${mm.toString().padStart(2, "0")}`; }

  const PAGE_W = 210, PAGE_H = 297, MARGIN = 20, CONTENT_W = PAGE_W - MARGIN * 2;
  const COLORS = { ink: [26,26,26], soft: [90,90,90], faint: [150,150,150], rule: [220,220,220], positive: [22,163,74], negative: [220,38,38], neutral: [100,100,100], accent: [59,130,246], warn: [202,138,4] };

  function createWriter(doc) {
    let y = MARGIN;
    const ensureSpace = (needed) => { if (y + needed > PAGE_H - MARGIN) { doc.addPage(); y = MARGIN; } };
    return {
      get y() { return y; }, set y(v) { y = v; },
      space(mm) { y += mm; },
      ensureSpace,
      hr() { ensureSpace(6); doc.setDrawColor(...COLORS.rule); doc.setLineWidth(0.2); doc.line(MARGIN, y, PAGE_W - MARGIN, y); y += 4; },
      title(text) { ensureSpace(12); doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...COLORS.ink); doc.text(text, MARGIN, y); y += 8; },
      section(text) { ensureSpace(14); y += 4; doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...COLORS.ink); doc.text(text.toUpperCase(), MARGIN, y); y += 2; doc.setDrawColor(...COLORS.ink); doc.setLineWidth(0.4); doc.line(MARGIN, y, MARGIN + 20, y); y += 6; },
      // Wraps: a meal name can be a whole sentence, and an unwrapped one runs off the page.
      subheading(text) {
        ensureSpace(10); y += 2;
        doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...COLORS.ink);
        doc.splitTextToSize(String(text), CONTENT_W).forEach((line) => { ensureSpace(6); doc.text(line, MARGIN, y); y += 5; });
      },
      body(text, opts = {}) {
        const size = opts.size || 10; const color = opts.color || COLORS.ink; const indent = opts.indent || 0;
        doc.setFont("helvetica", opts.bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
        const wrapped = doc.splitTextToSize(text, CONTENT_W - indent);
        wrapped.forEach((line) => { ensureSpace(size * 0.5); doc.text(line, MARGIN + indent, y); y += size * 0.42; });
        y += 1;
      },
      finding(text, confidence, opts = {}) {
        const indent = opts.indent || 4; const dotColor = opts.dotColor || COLORS.neutral;
        ensureSpace(10);
        const afterDotsX = drawDots(doc, MARGIN + indent, y, confidence, dotColor);
        doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...COLORS.faint);
        doc.text(`${confidence}% confidence · ${confidenceLabel(confidence)}`, afterDotsX + 2, y);
        y += 4;
        doc.setFontSize(10); doc.setTextColor(...COLORS.ink);
        const wrapped = doc.splitTextToSize(text, CONTENT_W - indent);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN + indent, y); y += 4.2; });
        y += 3;
      },
      // cols: [{label, width (mm), align}] — widths should sum to CONTENT_W.
      // rows: [{cells:[{text, color, bold}]}]. Re-draws the header after a page break so
      // a table split across pages still has column labels on the second half.
      table(cols, rows) {
        const rowH = 4.8;
        const drawHeader = () => {
          doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...COLORS.soft);
          let x = MARGIN;
          cols.forEach((c) => {
            const right = c.align === "right";
            doc.text(c.label, right ? x + c.width : x, y, right ? { align: "right" } : undefined);
            x += c.width;
          });
          y += 2;
          doc.setDrawColor(...COLORS.rule); doc.setLineWidth(0.2); doc.line(MARGIN, y, PAGE_W - MARGIN, y);
          y += 3.8;
        };
        ensureSpace(16); drawHeader();
        rows.forEach((r) => {
          if (y + rowH > PAGE_H - MARGIN) { doc.addPage(); y = MARGIN; drawHeader(); }
          let x = MARGIN;
          cols.forEach((c, i) => {
            const cell = r.cells[i] || { text: "" };
            const right = c.align === "right";
            doc.setFont("helvetica", cell.bold ? "bold" : "normal"); doc.setFontSize(9);
            doc.setTextColor(...(cell.color || COLORS.ink));
            let t = String(cell.text);
            while (t && doc.getTextWidth(t) > c.width - 2) t = t.slice(0, -1);
            doc.text(t, right ? x + c.width : x, y, right ? { align: "right" } : undefined);
            x += c.width;
          });
          y += rowH;
        });
        y += 2;
      },
      takeaway(text) {
        if (!text) return;
        ensureSpace(10); y += 2;
        doc.setFillColor(...COLORS.ink);
        const startY = y;
        const wrapped = doc.splitTextToSize(text, CONTENT_W - 8);
        const blockHeight = wrapped.length * 4.2 + 4;
        doc.rect(MARGIN, startY - 3, 1.2, blockHeight, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...COLORS.faint);
        doc.text("KEY TAKEAWAY", MARGIN + 4, y); y += 4;
        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...COLORS.ink);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN + 4, y); y += 4.2; });
        y += 2;
      },
      empty(text) {
        doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(...COLORS.faint);
        const wrapped = doc.splitTextToSize(text, CONTENT_W);
        wrapped.forEach((line) => { ensureSpace(5); doc.text(line, MARGIN, y); y += 4.2; });
        y += 1;
      },
    };
  }

  function tier1Sentence(f) {
    const macro = MACRO_LABELS[f.macro]; const unit = MACRO_UNITS[f.macro]; const window = WINDOW_LABELS[f.window];
    const dir = f.direction === "positive" ? "higher" : "lower";
    const opp = f.direction === "positive" ? "lower" : "higher";
    const strong = f.direction === "positive" ? f.groups.high : f.groups.low;
    const weak = f.direction === "positive" ? f.groups.low : f.groups.high;
    return `Your best sessions averaged RPP ${strong.rppAvg} and followed ${dir} ${macro} (${strong.macroAvg} ${unit}) in ${window}. Sessions with ${opp} ${macro} (${weak.macroAvg} ${unit}) averaged RPP ${weak.rppAvg}.`;
  }
  function tier2Sentence(name, data) {
    const labels = { sun: { yes: "days you logged sun exposure", no: "days without" }, hydration: { yes: "days you logged hydration", no: "days without" }, sleep: { yes: "sessions after a well-slept night", no: "sessions after poor sleep" } };
    const l = labels[name] || { yes: `days with ${name}`, no: `days without` };
    const diff = Math.abs(data.delta); const direction = data.delta > 0 ? "higher" : "lower";
    return `On the ${data.nTrue} ${l.yes} your average RPP was ${data.meanTrue} — ${diff} points ${direction} than the ${data.nFalse} ${l.no}, for which you averaged ${data.meanFalse}.`;
  }
  function tier3Sentence(name, f) {
    if (f.wellRate !== undefined) return `${f.label} occurred on ${f.wellRate}% of well-slept nights (n=${f.nWell}) and ${f.poorRate}% of poor-sleep nights (n=${f.nPoor}).`;
    if (name === "last_meal_hour") return `Nights of good sleep followed days for which the average last meal time was ${hourToClock(f.wellMean)}. Poor-sleep nights followed days for which last meal was on average at ${hourToClock(f.poorMean)}.`;
    const unit = SLEEP_FACTOR_UNITS[name] || ""; const unitStr = unit ? ` ${unit}` : "";
    return `Nights you slept well followed days averaging ${f.wellMean}${unitStr} for ${f.label.toLowerCase()} (n=${f.nWell}). Poor-sleep nights followed days averaging ${f.poorMean}${unitStr} (n=${f.nPoor}).`;
  }
  function tier4Sentence(c) {
    const direction = c.rppDelta > 0 ? "rose" : "shifted";
    const isCo = c.coOccurring && c.coOccurring.length > 1;
    if (isCo) return `Around ${formatDate(c.date)}, several habits changed together: ${c.coOccurringLabels.join(", ")}. In the 28 days after, your average RPP ${direction} from ${c.rppBefore} to ${c.rppAfter}. Because the changes co-occurred, the individual effect of each cannot be separated.`;
    const relText = `${c.relChange > 0 ? "up" : "down"} ${Math.abs(c.relChange)}%`;
    return `Around ${formatDate(c.date)}, your ${c.label.toLowerCase()} shifted ${relText} (from ${c.before} to ${c.after}). In the 28 days after, your average RPP ${direction} from ${c.rppBefore} to ${c.rppAfter}.`;
  }

  function tier1Takeaway(tier1) {
    const parts = [];
    Object.entries(tier1 || {}).forEach(([type, data]) => {
      const s = data.findings[0];
      if (!s) {
        // A type may have turned up only a supplement result; still worth a takeaway.
        const sup = (data.supplements || [])[0];
        if (sup) parts.push(`for ${labelOfType(type).toLowerCase()} workouts, ${sup.label} ${WINDOW_SHORT[sup.window]} went with ${sup.direction === "positive" ? "better" : "worse"} sessions`);
        return;
      }
      const macro = MACRO_LABELS[s.macro]; const win = WINDOW_SHORT[s.window];
      // `dir` names the condition the BEST sessions followed — the same convention
      // tier1Sentence uses — so the verb has to stay "improve". Swapping it to "hurt"
      // for negative correlations restated each finding as its exact opposite.
      const dir = s.direction === "positive" ? "higher" : "lower";
      parts.push(`for ${labelOfType(type).toLowerCase()} workouts, ${dir} ${macro} ${win} seems to improve performance`);
    });
    if (parts.length === 0) return null;
    const joined = parts.join("; ");
    return joined.charAt(0).toUpperCase() + joined.slice(1) + ".";
  }
  function tier2Takeaway(t2) {
    const pos = [], neg = [];
    const labelFor = (n) => n === "sun" ? "sun exposure" : n === "sleep" ? "a well-slept night" : n === "hydration" ? "hydration" : n;
    Object.entries(t2 || {}).forEach(([n, d]) => (d.delta > 0 ? pos : neg).push(labelFor(n)));
    const parts = [];
    if (pos.length) parts.push(`${pos.join(" and ")} seem${pos.length === 1 ? "s" : ""} to improve performance`);
    if (neg.length) parts.push(`${neg.join(" and ")} seem${neg.length === 1 ? "s" : ""} to hurt performance`);
    if (parts.length === 0) return null;
    const s = parts.join("; ");
    return s.charAt(0).toUpperCase() + s.slice(1) + ".";
  }
  function tier3Takeaway(t3) {
    if (!t3 || !t3.factors) return null;
    const factors = Object.entries(t3.factors);
    if (factors.length === 0) return null;
    const phrases = factors.map(([name, f]) => {
      if (name === "last_meal_hour") return f.wellMean < f.poorMean ? "earlier last meal" : "later last meal";
      if (name === "sun") return f.wellRate > f.poorRate ? "sun exposure during the day" : "less sun exposure during the day";
      if (name === "late_training") return f.wellRate < f.poorRate ? "avoiding late training" : "late training";
      if (f.wellRate !== undefined) { const better = f.wellRate > f.poorRate; return `${better ? "more" : "less"} ${f.label.toLowerCase()}`; }
      const lower = f.wellMean < f.poorMean;
      return `${lower ? "lower" : "higher"} ${f.label.toLowerCase()}`;
    });
    if (phrases.length === 0) return null;
    let joined;
    if (phrases.length === 1) joined = phrases[0];
    else if (phrases.length === 2) joined = `${phrases[0]} and ${phrases[1]}`;
    else joined = `${phrases.slice(0, -1).join(", ")}, and ${phrases[phrases.length - 1]}`;
    const verb = phrases.length === 1 ? "seems" : "seem";
    const s = `${joined} ${verb} to improve your sleep.`;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function tier4Takeaway(t4) {
    if (!t4 || !t4.changes || t4.changes.length === 0) return null;
    const parts = t4.changes.map((c) => {
      const labels = c.coOccurringLabels && c.coOccurringLabels.length > 1 ? c.coOccurringLabels.join(" and ") : c.label;
      const dirWord = c.rppDelta > 0 ? "a rise in RPP" : "a drop in RPP";
      return `${labels.toLowerCase()} seems to be linked to ${dirWord}`;
    });
    const s = parts.join("; ");
    return s.charAt(0).toUpperCase() + s.slice(1) + ".";
  }
  function giTakeaway(gi) {
    if (!gi || !gi.triggers || gi.triggers.length === 0) return null;
    const words = gi.triggers.slice(0, 3).map((t) => `"${t.word}"`);
    let joined;
    if (words.length === 1) joined = words[0];
    else if (words.length === 2) joined = `${words[0]} and ${words[1]}`;
    else joined = `${words.slice(0, -1).join(", ")}, and ${words[words.length - 1]}`;
    return `Meals containing ${joined} seem to be linked to GI distress — worth watching.`;
  }

  function renderPDF(report) {
    if (!window.jspdf) throw new Error("jsPDF not loaded");
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    const w = createWriter(doc);

    w.title("Performance Report");
    w.body(`Generated ${formatDate(new Date().toISOString().slice(0, 10))} · Based on ${report.meta.totalDaysLogged} days of logging and ${report.meta.totalSessions} training sessions.`, { color: COLORS.soft, size: 10 });
    if (report.meta.assumedSessions) w.body(`${report.meta.assumedSessions} of those had no training type or time entered, so your usual ones were assumed.`, { color: COLORS.faint, size: 8.5 });
    w.space(2); w.hr();

    // Sections with nothing to show are held back and listed together at the end, so the
    // body of the report is findings only rather than a run of "not yet" placeholders.
    const pending = [];
    const skip = (title, reason) => pending.push({ title, reason });

    const t1Keys = Object.keys(report.tier1 || {});
    if (t1Keys.length === 0) skip("Diet impact on performance", "each training type needs at least 5 logged sessions with a training type set");
    else {
      w.section("Diet impact on performance");
      t1Keys.forEach((type) => {
        const data = report.tier1[type];
        w.subheading(`${iconOfType(type)}  ${labelOfType(type)} — ${data.n} sessions`);
        data.findings.forEach((f) => {
          const color = f.direction === "positive" ? COLORS.positive : COLORS.negative;
          w.finding(tier1Sentence(f), f.confidence, { dotColor: color });
        });
        (data.supplements || []).forEach((f) => {
          const color = f.direction === "positive" ? COLORS.positive : COLORS.negative;
          w.finding(`Sessions where you had ${f.label} ${WINDOW_SHORT[f.window]} averaged RPP ${f.meanWith} (n=${f.nWith}); the ${f.nWithout} sessions without it averaged ${f.meanWithout}.`, f.confidence, { dotColor: color });
        });
      });
      w.takeaway(tier1Takeaway(report.tier1));
    }

    const t2 = report.tier2 || {}; const t2Keys = Object.keys(t2);
    if (t2Keys.length === 0) skip("Lifestyle factors", "needs at least 3 sessions with and 3 without each of sun, hydration and good sleep, and a clear gap between them");
    else {
      w.section("Lifestyle factors");
      t2Keys.forEach((name) => {
        const d = t2[name]; const color = d.delta > 0 ? COLORS.positive : COLORS.negative;
        w.finding(tier2Sentence(name, d), d.confidence, { dotColor: color });
      });
      w.takeaway(tier2Takeaway(report.tier2));
    }

    const t3 = report.tier3;
    if (!t3 || !t3.factors || Object.keys(t3.factors).length === 0) skip("Sleep data analysis", "needs at least 6 nights logged as good or bad, with something that separates them");
    else {
      w.section("Sleep data analysis");
      w.body(`Across ${t3.nWell} well-slept nights and ${t3.nPoor} poor-sleep nights:`, { color: COLORS.soft, size: 9 });
      Object.entries(t3.factors).forEach(([name, f]) => {
        w.finding(tier3Sentence(name, f), f.confidence, { dotColor: COLORS.accent });
      });
      w.takeaway(tier3Takeaway(report.tier3));
    }

    const t4 = report.tier4;
    if (!t4 || t4.changes.length === 0) skip("Habit changes over time", (t4 && t4.note) ? t4.note.replace(/^Need /, "needs ").replace(/\.$/, "") : "no sustained change in your habits detected yet");
    else {
      w.section("Habit changes over time");
      t4.changes.forEach((c) => {
        const color = c.rppDelta > 0 ? COLORS.positive : COLORS.negative;
        const confProxy = Math.round(Math.min(Math.abs(c.rppDelta) / 1.5, 1) * 100);
        w.finding(tier4Sentence(c), confProxy, { dotColor: color });
      });
      w.takeaway(tier4Takeaway(report.tier4));
    }

    if (!report.gi) skip("Digestive notes", "no GI distress logged yet, so there is nothing to trace back to food");
    else {
      if (report.gi.triggers && report.gi.triggers.length > 0) {
        w.section("Digestive notes");
        w.body(`GI distress was logged on ${report.gi.giDays} of ${report.gi.totalDays} tracked days. The following food-name keywords appeared disproportionately on those days:`, { size: 10 });
        w.space(1);
        report.gi.triggers.forEach((t) => {
          const pct = Math.round((t.giCount / t.total) * 100);
          w.finding(`"${t.word}" — appeared in ${t.total} meals; ${t.giCount} of those (${pct}%) were on days you reported GI distress.`, t.confidence, { dotColor: COLORS.neutral });
        });
        w.body("This is a keyword pattern, not a diagnosis. Consider tracking further to confirm.", { color: COLORS.faint, size: 9 });
        w.takeaway(giTakeaway(report.gi));
      } else if (report.gi.belowThreshold) {
        skip("Digestive notes", `logged on ${report.gi.giDays} of ${report.gi.totalDays} tracked days; ${report.gi.minDays} days with GI distress are needed before food keywords mean anything`);
      } else {
        skip("Digestive notes", `logged on ${report.gi.giDays} of ${report.gi.totalDays} tracked days, but no food keyword has appeared often enough to stand out`);
      }
    }

    if (!report.fasting) skip("Overnight fast", "needs two consecutive days with meals logged on both sides of a night");
    else {
      const f = report.fasting;
      w.section("Overnight fast");
      w.body(`Across ${f.nights} night${f.nights !== 1 ? "s" : ""} with meals logged on both sides, your average overnight fast was ${f.avgText}, running from a last meal around ${f.avgLastMeal} to a first meal around ${f.avgFirstMeal}.`, { size: 10 });
      w.space(1);
      w.body(`Longest: ${f.longestText} (ending ${formatDate(f.longestDate)}).   Shortest: ${f.shortestText} (ending ${formatDate(f.shortestDate)}).`, { size: 9, color: COLORS.soft });
      w.body("Nights where either day had nothing logged are left out, so gaps in tracking are not counted as fasts.", { size: 8.5, color: COLORS.faint });
    }

    if (!report.foodQuality) skip("Food quality rating", "needs at least 10 logged meals");
    else {
      const q = report.foodQuality;
      w.section("Food quality rating");
      const full = Math.floor(q.stars), half = q.stars % 1 >= 0.5;
      w.subheading(`${q.stars} / 5 stars   ${"*".repeat(full)}${half ? " 1/2" : ""}`);
      // What counted against it, and nothing else. Meal names can be whole sentences, so
      // they are clipped — the point is to recognise the dish, not re-read it.
      const shortName = (s) => { const t = String(s || "").trim(); return t.length > 38 ? t.slice(0, 36).replace(/[,\s]+$/, "") + "…" : t; };
      const against = [];
      if (q.processedCount) against.push(`${q.processedCount} processed or sugary (${q.worstOffenders.slice(0, 3).map((o) => `${shortName(o.name)}${o.n > 1 ? ` x${o.n}` : ""}`).join(", ")})`);
      if (q.lateCount) against.push(`${q.lateCount} eaten at or after 22:00${q.lateOffenders && q.lateOffenders.length ? ` (${q.lateOffenders.slice(0, 2).map((o) => shortName(o.name)).join(", ")})` : ""}`);
      if (against.length === 0) {
        w.body(`All ${q.totalItems} foods you logged came through clean.`, { size: 10 });
      } else {
        w.body(`${against.join("; ")} — out of ${q.totalItems} foods logged.`, { size: 10 });
      }
      // And what to do about it.
      w.takeaway(
        q.stars >= 4.5 ? "Nothing to change — keep the balance you have."
        : q.processedCount >= q.lateCount
          ? `Swapping out ${q.worstOffenders[0] ? shortName(q.worstOffenders[0].name).toLowerCase() : "the processed items"} would move this rating the most.`
          : "Moving your last meal earlier than 22:00 would move this rating the most.");
    }

    if (!report.nutrients) skip("Macro and micronutrient tables", "needs at least 3 logged days");
    else {
      const n = report.nutrients;
      const tone = (t) => t === "bad" ? COLORS.negative : t === "warn" ? COLORS.warn : t === "good" ? COLORS.positive : COLORS.soft;
      const cols = [
        { label: "Nutrient", width: 46 }, { label: "Daily avg", width: 28, align: "right" },
        { label: "Target", width: 28, align: "right" }, { label: "%", width: 18, align: "right" },
        { label: "Status", width: 50 },
      ];
      const toRows = (rows) => rows.map((r) => ({ cells: [
        { text: r.label },
        { text: `${r.avg}${r.unit}` },
        { text: `${r.target}${r.unit}` },
        { text: r.pct === null ? "-" : `${r.pct}%`, bold: true, color: tone(r.status.tone) },
        { text: r.status.word, color: tone(r.status.tone) },
      ] }));

      w.section("Macronutrients");
      w.body(`Daily averages across ${n.days} logged day${n.days !== 1 ? "s" : ""}.`, { size: 9, color: COLORS.soft });
      w.table(cols, toRows(n.macros));

      w.section("Micronutrients");
      w.table(cols, toRows(n.micros));
      w.body("Deficient is below 70% of target, Low 70-89%, On target 90-110%, High 111-200%, Excess above 200%.", { size: 8.5, color: COLORS.faint });

      if (n.opportunities.length) {
        w.section("Closing the gaps");
        w.body("Meals you already eat that are the strongest sources of what you are short on. Eating them more often, or in bigger portions, moves these numbers fastest.", { size: 10 });
        w.space(1);
        n.opportunities.forEach((o) => {
          const gapName = String(o.meal || "").trim();
          w.subheading(`${gapName.length > 60 ? gapName.slice(0, 58).replace(/[,s]+$/, "") + "…" : gapName} — logged ${o.count} time${o.count !== 1 ? "s" : ""}`);
          o.nutrients.forEach((x) => {
            w.body(`${x.label} sits at ${x.pct}% of target; one serving supplies ${x.per}${x.unit}, or ${x.sharePct}% of a day's worth.`, { size: 9.5, indent: 4, color: COLORS.soft });
          });
        });
        const top = n.opportunities[0], topN = top.nutrients[0];
        w.takeaway(`The quickest fix: more ${top.meal.toLowerCase()}, whether a bigger portion or more often — one serving already covers ${topN.sharePct}% of your daily ${topN.label.toLowerCase()} target.`);
      }
    }

    // Everything that had nothing to say, gathered in one place at the end.
    if (pending.length) {
      w.section("Not enough data yet");
      w.body("These sections are waiting on more logging. Each one appears on its own once the data is there:", { size: 9.5, color: COLORS.soft });
      w.space(1);
      pending.forEach((p) => {
        w.body(`${p.title} — ${p.reason}.`, { size: 9.5, indent: 3, color: COLORS.faint });
      });
    }

    const pageCount = doc.getNumberOfPages();
    for (let p = 1; p <= pageCount; p++) {
      doc.setPage(p);
      const legendY = PAGE_H - 8;
      let lx = MARGIN;
      doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(...COLORS.faint);
      doc.text("Confidence:", lx, legendY); lx += 17;
      const legendItems = [{conf:80,label:"high"},{conf:60,label:"medium"},{conf:30,label:"low"},{conf:10,label:"preliminary"}];
      legendItems.forEach((it, i) => {
        lx = drawDots(doc, lx, legendY, it.conf, COLORS.neutral) + 1.5;
        doc.text(it.label, lx, legendY);
        lx += doc.getTextWidth(it.label) + 4;
        if (i < legendItems.length - 1) doc.text("·", lx - 2, legendY);
      });
      doc.text(`${p} / ${pageCount}`, PAGE_W - MARGIN, legendY, { align: "right" });
    }
    return doc;
  }

  window.buildPerformanceReport = buildReport;
  /* ─── HTML RENDERER ───
     The report is a styled HTML document rather than a drawn PDF: the design depends on
     cards, gradients and dumbbell charts that jsPDF cannot produce. Open it in a browser
     and print to PDF from there if a PDF is wanted. Every number here comes from the same
     report object the PDF used — nothing is invented for the layout. */
  const H = {
    bg: "#F4F1EA", card: "#FFFFFF", line: "#E2DDD1", rule: "#D8D2C4", hair: "#EEEAE0",
    ink: "#1C1B19", soft: "#3A3731", muted: "#57534B", faint: "#8A857B",
    green: "#1F5E4A", greenDeep: "#24453A", greenPale: "#EEF3F0", greenBar: "#B9CBC3",
    dark: "#1F2A24", darkCard: "#2A3830", darkText: "#D9D4C8", darkMuted: "#C9C3B5",
    orange: "#C2570C", orangeDeep: "#B4460C", orangePale: "#FBEBDD", orangeText: "#9A3F0A",
    blue: "#2F5FB3", bluePale: "#E1E9F6", track: "#EEEAE0", trackSoft: "#F2EFE8",
  };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const num = (n) => Number(n || 0).toLocaleString("en-US");
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const serif = "font-family:Fraunces,Georgia,serif";
  const CARD = `background:${H.card};border:1px solid ${H.line};border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:28px`;
  const H2 = `font-size:32px`;
  const SUB = `font-size:16px;color:${H.muted}`;
  const LABEL = `font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:${H.muted}`;

  // Confidence pill, matching the bands the rest of the report uses.
  function pill(c) {
    const label = confidenceLabel(c);
    const col = c >= 75 ? H.green : c >= 50 ? H.blue : H.orangeText;
    const bg = c >= 75 ? H.greenPale : c >= 50 ? H.bluePale : H.orangePale;
    return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">
      <span style="padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:${col};background:${bg}">${label} · ${c}%</span>
      <div style="width:110px;height:5px;border-radius:3px;background:${H.track};overflow:hidden"><div style="height:5px;width:${clamp(c, 0, 100)}%;background:${col}"></div></div>
    </div>`;
  }
  // The dumbbell used throughout: two RPP values on a 6-10 rail.
  function dumbbell(worse, better) {
    const pos = (v) => clamp(((v - 6) / 4) * 100, 0, 100);
    const a = pos(worse), b = pos(better), lo = Math.min(a, b), hi = Math.max(a, b);
    return `<div style="position:relative;height:28px">
      <div style="position:absolute;left:0;right:0;top:13px;height:2px;background:${H.hair}"></div>
      <div style="position:absolute;top:12px;height:4px;border-radius:2px;background:${H.greenBar};left:${lo}%;width:${hi - lo}%"></div>
      <div style="position:absolute;top:7px;width:14px;height:14px;border-radius:7px;background:${H.card};border:2px solid ${H.faint};box-sizing:border-box;transform:translateX(-7px);left:${a}%"></div>
      <div style="position:absolute;top:4px;width:20px;height:20px;border-radius:10px;transform:translateX(-10px);left:${b}%;background:${H.green}"></div>
    </div>`;
  }
  const statusColor = (tone) => tone === "bad" ? H.orange : tone === "warn" ? "#B7791F" : tone === "good" ? H.green : H.muted;
  const statusChip = (st) => `<span style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;color:${statusColor(st.tone)};background:${st.tone === "good" ? H.greenPale : st.tone === "bad" ? H.orangePale : "#FAF2E2"}">${esc(st.word)}</span>`;

  // The four or fewer things most worth doing, drawn from the strongest findings the
  // report already produced — ranked, not restated in full.
  function buildPriorities(report) {
    const out = [];
    const t2 = report.tier2 || {};
    if (t2.sleep && t2.sleep.delta > 0) {
      const sun = report.tier3 && report.tier3.factors && report.tier3.factors.sun;
      out.push({ title: "Protect your sleep, get daylight",
        text: `Your strongest lifestyle signal: ${t2.sleep.delta > 0 ? "+" : ""}${t2.sleep.delta} RPP after good sleep (${t2.sleep.meanTrue} vs ${t2.sleep.meanFalse}).` +
              (sun ? ` Sun exposure showed up on ${sun.wellRate}% of good nights vs ${sun.poorRate}% of poor ones.` : "") });
    }
    Object.entries(report.tier1 || {}).forEach(([type, d]) => {
      const f = (d.findings || [])[0];
      if (!f || out.length >= 4) return;
      const better = f.direction === "positive" ? f.groups.high : f.groups.low;
      const worse = f.direction === "positive" ? f.groups.low : f.groups.high;
      out.push({ title: `${f.direction === "positive" ? "More" : "Less"} ${MACRO_LABELS[f.macro]} ${WINDOW_SHORT[f.window]} for ${labelOfType(type).toLowerCase()}`,
        text: `Best sessions followed ${better.macroAvg}${MACRO_UNITS[f.macro]} (vs ${worse.macroAvg}${MACRO_UNITS[f.macro]}), scoring RPP ${better.rppAvg} against ${worse.rppAvg}.` });
    });
    const n = report.nutrients;
    if (n && out.length < 4) {
      const worstShort = [...n.macros, ...n.micros].filter((r) => r.pct !== null && r.pct < 90).sort((a, b) => a.pct - b.pct)[0];
      if (worstShort) {
        const opp = (n.opportunities || []).find((g) => g.nutrients.some((x) => x.label === worstShort.label));
        out.push({ title: `Bring ${worstShort.label.toLowerCase()} back up`,
          text: `At ${worstShort.pct}% of target.` + (opp ? ` ${esc(opp.meal)} supplies ${opp.nutrients.find((x) => x.label === worstShort.label).sharePct}% of a day's worth per serving, and you logged it ${opp.count} time${opp.count !== 1 ? "s" : ""}.` : "") });
      }
    }
    const q = report.foodQuality;
    if (q && q.stars < 4.5 && out.length < 4) {
      out.push({ title: "Trim what costs you a star",
        text: `${q.processedPct}% of what you ate read as processed or sugary${q.worstOffenders[0] ? ` — ${esc(q.worstOffenders[0].name)} recurs` : ""}. Only what sits above 5% counts against the rating.` });
    }
    return out.slice(0, 4);
  }

  function renderHTML(report) {
    const meta = report.meta || {};
    const n = report.nutrients, q = report.foodQuality, f = report.fasting;
    const t2 = report.tier2 || {}, t3 = report.tier3;
    const cal = n && n.macros.find((r) => r.key === "calories");
    const onTarget = n ? [...n.macros, ...n.micros].filter((r) => r.status.word === "On target").length : 0;
    const totalN = n ? n.macros.length + n.micros.length : 0;
    const lowN = n ? [...n.macros, ...n.micros].filter((r) => r.pct !== null && r.pct < 90).length : 0;
    const highN = n ? [...n.macros, ...n.micros].filter((r) => r.pct !== null && r.pct > 110).length : 0;
    const pending = [];
    const parts = [];

    // ── header ──
    const kpi = (label, value, note, color) => `<div style="background:${H.card};border:1px solid ${H.line};border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:14px;color:${H.muted};font-weight:500">${label}</div>
      <div style="${serif};font-size:40px;font-weight:600;line-height:1${color ? `;color:${color}` : ""}">${value}</div>
      <div style="font-size:13px;color:${H.muted}">${note}</div></div>`;
    const cards = [];
    if (t2.sleep) cards.push(kpi("Good-sleep boost", `${t2.sleep.delta > 0 ? "+" : ""}${t2.sleep.delta}`, `RPP after a well-slept night (${t2.sleep.meanTrue} vs ${t2.sleep.meanFalse})`, t2.sleep.delta > 0 ? H.green : H.orange));
    if (f) cards.push(kpi("Avg overnight fast", esc(f.avgText), `across ${f.nights} fully logged night${f.nights !== 1 ? "s" : ""}`));
    if (q) cards.push(kpi("Food quality", `${q.stars}<span style="font-size:18px;color:${H.muted}"> / 5</span>`, `${q.wholePct}% of ${q.totalItems} foods are whole foods`));
    if (cal) cards.push(kpi("Energy intake", `<span style="color:${cal.pct < 90 || cal.pct > 110 ? H.orangeDeep : H.green}">${cal.pct}%</span><span style="font-size:15px;color:${H.muted}"> of target</span>`, `${num(cal.avg)} of ${num(cal.target)} Cal`));
    if (n) cards.push(kpi("Nutrients on target", `${onTarget}<span style="font-size:18px;color:${H.muted}"> / ${totalN}</span>`, `${lowN} low · ${highN} above target`));
    parts.push(`<div style="display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:14px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#1F5E4A">Nutrition, sleep &amp; training · ${meta.totalDaysLogged}-day review</div>
        <h1 style="${serif};font-size:60px;line-height:1.05;letter-spacing:-0.01em;margin:0">Performance Report</h1>
        <p style="font-size:18px;color:${H.muted};margin:0">Generated ${esc(formatDate(new Date().toISOString().slice(0, 10)))} · ${meta.totalDaysLogged} days of logging · ${meta.totalSessions} training session${meta.totalSessions !== 1 ? "s" : ""}${meta.assumedSessions ? ` (${meta.assumedSessions} with an assumed type or time)` : ""}</p>
      </div>
      ${cards.length ? `<div style="display:grid;grid-template-columns:repeat(${cards.length},minmax(0,1fr));gap:16px">${cards.join("")}</div>` : ""}
    </div>`);

    // ── what to do next ──
    const prio = buildPriorities(report);
    if (prio.length) parts.push(`<div style="background:${H.dark};color:${H.bg};border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <h2 style="${serif};font-size:32px;color:${H.bg};margin:0">What to do next</h2>
        <div style="font-size:15px;color:${H.darkMuted}">Ranked by expected impact</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px">
        ${prio.map((p, i) => `<div style="background:${H.darkCard};border-radius:14px;padding:24px;display:flex;gap:18px">
          <div style="flex-shrink:0;width:40px;height:40px;border-radius:20px;background:${H.bg};color:${H.dark};display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px">${i + 1}</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <h3 style="${serif};font-size:21px;color:#FFFFFF;margin:0">${esc(p.title)}</h3>
            <p style="font-size:16px;line-height:1.55;color:${H.darkText};margin:0">${p.text}</p>
          </div></div>`).join("")}
      </div></div>`);

    // ── diet impact ──
    const t1Keys = Object.keys(report.tier1 || {});
    if (!t1Keys.length) pending.push({ t: "Diet impact on performance", r: "each training type needs at least 5 logged sessions with a training type set" });
    else {
      const blocks = t1Keys.map((type) => {
        const d = report.tier1[type];
        const rows = [];
        (d.findings || []).forEach((x) => {
          const better = x.direction === "positive" ? x.groups.high : x.groups.low;
          const worse = x.direction === "positive" ? x.groups.low : x.groups.high;
          const u = MACRO_UNITS[x.macro];
          rows.push({ label: `${WINDOW_SHORT[x.window]} · ${MACRO_LABELS[x.macro]}`,
            text: `<span style="font-weight:600;color:${H.green}">${better.macroAvg === 0 ? "Nothing eaten" : `${x.direction === "positive" ? "Higher" : "Lower"} ${MACRO_LABELS[x.macro]}`} (${better.macroAvg} ${u})</span> → RPP ${better.rppAvg} &nbsp; <span style="color:${H.muted}">vs ${worse.macroAvg} ${u} → RPP ${worse.rppAvg}</span>`,
            worse: worse.rppAvg, better: better.rppAvg, conf: x.confidence });
        });
        (d.supplements || []).forEach((x) => {
          rows.push({ label: `${WINDOW_SHORT[x.window]} · supplement`,
            text: `<span style="font-weight:600;color:${H.green}">${esc(x.label)}</span> → RPP ${x.meanWith} &nbsp; <span style="color:${H.muted}">without → RPP ${x.meanWithout}</span>`,
            worse: x.meanWithout, better: x.meanWith, conf: x.confidence });
        });
        return `<div style="display:flex;flex-direction:column;gap:0">
          <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid ${H.rule}">
            <span style="padding:4px 10px;border-radius:6px;background:${H.dark};color:${H.bg};font-size:13px;font-weight:600;letter-spacing:0.06em">${esc(iconOfType(type))}</span>
            <h3 style="${serif};font-size:22px;margin:0">${esc(labelOfType(type))}</h3>
            <span style="font-size:15px;color:${H.muted}">· ${d.n} session${d.n !== 1 ? "s" : ""}</span>
            <div style="flex-grow:1"></div>
            <div style="position:relative;width:360px;height:16px;font-size:12px;color:${H.muted};margin-right:150px">
              <span style="position:absolute;left:0">6</span><span style="position:absolute;left:25%;transform:translateX(-50%)">7</span><span style="position:absolute;left:50%;transform:translateX(-50%)">RPP 8</span><span style="position:absolute;left:75%;transform:translateX(-50%)">9</span><span style="position:absolute;right:0">10</span>
            </div>
          </div>
          ${rows.map((r) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 360px 126px;gap:24px;align-items:center;min-height:78px;padding:10px 0;border-bottom:1px solid ${H.hair}">
            <div style="display:flex;flex-direction:column;gap:4px">
              <div style="${LABEL}">${esc(r.label)}</div>
              <div style="font-size:16px;line-height:1.45">${r.text}</div>
            </div>
            ${dumbbell(r.worse, r.better)}
            ${pill(r.conf)}
          </div>`).join("")}
        </div>`;
      }).join("");
      parts.push(`<div style="${CARD}">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <h2 style="${serif};${H2};margin:0">Diet impact on performance</h2>
            <p style="${SUB};margin:0">RPP of your best sessions against the rest, split by what you ate beforehand.</p>
          </div>
          <div style="display:flex;gap:16px;font-size:14px;color:${H.muted};flex-shrink:0">
            <div style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:7px;background:${H.green}"></span>Best sessions</div>
            <div style="display:flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:7px;background:${H.card};border:2px solid ${H.faint};box-sizing:border-box"></span>Other sessions</div>
          </div>
        </div>${blocks}</div>`);
    }

    // ── sleep, sun & performance ──
    const t3f = t3 && t3.factors ? t3.factors : null;
    if (!t3f || !Object.keys(t3f).length) pending.push({ t: "Sleep data analysis", r: "needs at least 6 nights logged as good or bad, with something that separates them" });
    else {
      const bar = (label, pctA, pctB, aLabel, bLabel) => `<div style="display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(label)}</span><span style="font-weight:600">${pctA}%</span></div>
        <div style="height:10px;border-radius:5px;background:${H.track};overflow:hidden"><div style="height:10px;width:${clamp(pctA, 0, 100)}%;background:${H.green}"></div></div></div>`;
      const cells = Object.entries(t3f).map(([k, x]) => {
        const isRate = x.wellRate !== undefined;
        return `<div style="border:1px solid ${H.line};border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px">
          <h3 style="${serif};font-size:20px;margin:0">${esc(x.label)}</h3>
          ${isRate
            ? `${bar("Before a good night", x.wellRate)}${bar("Before a poor night", x.poorRate)}`
            : `<div style="display:flex;gap:12px;align-items:flex-end;height:104px">
                 <div style="flex-grow:1;display:flex;flex-direction:column;gap:6px;align-items:center"><span style="font-size:22px;font-weight:600;color:${H.green}">${x.wellMean}</span><div style="width:100%;background:${H.green};height:${clamp(Math.abs(x.wellMean) / Math.max(Math.abs(x.wellMean), Math.abs(x.poorMean), 1) * 80, 8, 80)}px;border-radius:6px 6px 0 0"></div></div>
                 <div style="flex-grow:1;display:flex;flex-direction:column;gap:6px;align-items:center"><span style="font-size:22px;font-weight:600;color:${H.muted}">${x.poorMean}</span><div style="width:100%;background:${H.greenBar};height:${clamp(Math.abs(x.poorMean) / Math.max(Math.abs(x.wellMean), Math.abs(x.poorMean), 1) * 80, 8, 80)}px;border-radius:6px 6px 0 0"></div></div>
               </div>
               <div style="display:flex;gap:12px;font-size:14px;color:${H.muted}"><span style="flex-grow:1;text-align:center">well-slept</span><span style="flex-grow:1;text-align:center">poor sleep</span></div>`}
          ${pill(x.confidence)}
        </div>`;
      }).join("");
      const sleepKpi = t2.sleep ? `<div style="border:1px solid ${H.line};border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px">
          <h3 style="${serif};font-size:20px;margin:0">Next-day RPP</h3>
          <div style="${serif};font-size:44px;font-weight:600;color:${H.green};line-height:1">${t2.sleep.delta > 0 ? "+" : ""}${t2.sleep.delta}</div>
          <p style="font-size:14px;color:${H.muted};margin:0">${t2.sleep.meanTrue} after a good night (n=${t2.sleep.nTrue}) vs ${t2.sleep.meanFalse} after a poor one (n=${t2.sleep.nFalse})</p>
          ${pill(t2.sleep.confidence)}</div>` : "";
      parts.push(`<div style="${CARD}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};${H2};margin:0">Sleep, sun &amp; performance</h2>
          <p style="${SUB};margin:0">Across ${t3.nWell} well-slept and ${t3.nPoor} poor-sleep nights.</p>
        </div>
        <div style="display:grid;grid-template-columns:repeat(${Math.min(3, Object.keys(t3f).length + (sleepKpi ? 1 : 0))},minmax(0,1fr));gap:20px">${cells}${sleepKpi}</div></div>`);
    }

    // ── fasting + food quality, side by side ──
    const half = [];
    if (!f) pending.push({ t: "Overnight fast", r: "needs two consecutive days with meals logged on both sides of a night" });
    else {
      const toPct = (clock) => { const [h, m] = String(clock).split(":").map(Number); return ((h * 60 + m) / 1440) * 100; };
      const s = toPct(f.avgFirstMeal), e = toPct(f.avgLastMeal);
      half.push(`<div style="background:${H.card};border:1px solid ${H.line};border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};font-size:28px;margin:0">Overnight fast</h2>
          <p style="font-size:15px;color:${H.muted};margin:0">${f.nights} night${f.nights !== 1 ? "s" : ""} with meals logged on both sides</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="${LABEL}">Your typical day</div>
          <div style="position:relative;height:44px;border-radius:10px;background:#DDE5E1;overflow:hidden">
            <div style="position:absolute;left:${s}%;width:${Math.max(e - s, 2)}%;top:0;height:44px;background:${H.green}"></div>
            <div style="position:absolute;left:${s}%;width:${Math.max(e - s, 2)}%;top:0;height:44px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:14px;font-weight:600">eating window</div>
          </div>
          <div style="position:relative;height:18px;font-size:13px;color:${H.muted}">
            <span style="position:absolute;left:0">00:00</span>
            <span style="position:absolute;left:${s}%;transform:translateX(-50%);font-weight:600;color:${H.ink}">${esc(f.avgFirstMeal)}</span>
            <span style="position:absolute;left:${e}%;transform:translateX(-50%);font-weight:600;color:${H.ink}">${esc(f.avgLastMeal)}</span>
            <span style="position:absolute;right:0">24:00</span>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
          <div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:13px;color:${H.muted}">Shortest</div><div style="${serif};font-size:22px;font-weight:600">${esc(f.shortestText)}</div></div>
          <div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:13px;color:${H.muted}">Average</div><div style="${serif};font-size:22px;font-weight:600;color:${H.green}">${esc(f.avgText)}</div></div>
          <div style="display:flex;flex-direction:column;gap:2px"><div style="font-size:13px;color:${H.muted}">Longest</div><div style="${serif};font-size:22px;font-weight:600">${esc(f.longestText)}</div></div>
        </div>
        <p style="font-size:13px;color:${H.faint};margin:0">Nights where either day had nothing logged are left out, so gaps in tracking are not counted as fasts.</p>
      </div>`);
    }
    if (!q) pending.push({ t: "Food quality rating", r: "needs at least 10 logged meals" });
    else {
      const against = [];
      if (q.processedCount) against.push(`${q.processedCount} processed or sugary`);
      if (q.lateCount) against.push(`${q.lateCount} eaten at or after 22:00`);
      const stars = Math.round(q.stars * 2) / 2;
      half.push(`<div style="background:${H.card};border:1px solid ${H.line};border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};font-size:28px;margin:0">Food quality</h2>
          <p style="font-size:15px;color:${H.muted};margin:0">Read from the words in your meal names — a guide, not an audit</p>
        </div>
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="${serif};font-size:56px;font-weight:600;line-height:1;color:${stars >= 4 ? H.green : stars >= 2.5 ? "#B7791F" : H.orange}">${stars}</span>
          <span style="font-size:20px;color:${H.muted}">/ 5 stars</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;font-size:14px"><span>Whole foods</span><span style="font-weight:600">${q.wholePct}%</span></div>
          <div style="height:12px;border-radius:6px;background:${H.track};overflow:hidden"><div style="height:12px;width:${clamp(q.wholePct, 0, 100)}%;background:${H.green}"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:14px"><span>Processed or sugary</span><span style="font-weight:600;color:${H.orange}">${q.processedPct}%</span></div>
          <div style="height:12px;border-radius:6px;background:${H.track};overflow:hidden"><div style="height:12px;width:${clamp(q.processedPct, 0, 100)}%;background:${H.orange}"></div></div>
        </div>
        ${against.length ? `<p style="font-size:15px;line-height:1.55;color:${H.soft};margin:0">${against.join("; ")} — out of ${q.totalItems} foods logged${q.worstOffenders.length ? `. Most often: ${q.worstOffenders.slice(0, 3).map((o) => esc(o.name) + (o.n > 1 ? ` ×${o.n}` : "")).join(", ")}` : ""}.</p>` : `<p style="font-size:15px;color:${H.green};margin:0">All ${q.totalItems} foods came through clean.</p>`}
        <div style="display:flex;gap:14px;align-items:flex-start;background:${H.greenPale};border-radius:12px;padding:16px 18px">
          <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:${H.greenDeep};padding-top:2px;flex-shrink:0">Do</div>
          <p style="font-size:15px;line-height:1.55;color:${H.soft};margin:0">${q.stars >= 4.5 ? "Nothing to change — keep the balance you have." : q.processedCount >= q.lateCount ? `Swapping out ${q.worstOffenders[0] ? esc(q.worstOffenders[0].name.toLowerCase()) : "the processed items"} would move this rating the most.` : "Moving your last meal earlier than 22:00 would move this rating the most."}</p>
        </div>
      </div>`);
    }
    if (half.length) parts.push(`<div style="display:grid;grid-template-columns:repeat(${half.length},minmax(0,1fr));gap:24px">${half.join("")}</div>`);

    // ── nutrient tables ──
    if (!n) pending.push({ t: "Macro and micronutrient tables", r: "needs at least 3 logged days" });
    else {
      const row = (r, big) => {
        const col = statusColor(r.status.tone);
        const w = clamp((r.pct || 0) / 1.25, 0, 100);       // 125% of target fills the bar
        return `<div style="display:grid;grid-template-columns:${big ? "180px minmax(0,1fr) 150px 110px" : "150px minmax(0,1fr) 190px 110px"};gap:24px;align-items:center;height:${big ? 64 : 46}px;border-bottom:1px solid ${H.hair}">
          <div style="font-size:${big ? 18 : 16}px;font-weight:600">${esc(r.label)}</div>
          <div style="display:flex;align-items:center;gap:14px">
            <div style="position:relative;flex-grow:1;height:${big ? 16 : 14}px;background:${big ? H.track : H.trackSoft};border-radius:8px">
              <div style="position:absolute;left:0;top:0;height:${big ? 16 : 14}px;border-radius:8px;width:${w}%;background:${col}"></div>
              <div style="position:absolute;left:80%;top:-5px;width:2px;height:${big ? 26 : 22}px;background:${H.ink}"></div>
            </div>
            <div style="width:52px;font-size:${big ? 18 : 16}px;font-weight:600;text-align:right;color:${col}">${r.pct === null ? "—" : r.pct + "%"}</div>
          </div>
          <div style="text-align:right;font-size:15px;color:${H.soft}">${num(r.avg)} / ${num(r.target)}${esc(r.unit)}</div>
          <div>${statusChip(r.status)}</div>
        </div>`;
      };
      const head = (cols) => `<div style="display:grid;grid-template-columns:${cols};gap:24px;padding:0 0 10px;border-bottom:1px solid ${H.rule};font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:${H.muted}"><div>Nutrient</div><div>% of target</div><div style="text-align:right">Avg / target</div><div>Status</div></div>`;
      parts.push(`<div style="${CARD}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};${H2};margin:0">Macronutrients</h2>
          <p style="${SUB};margin:0">Daily averages across ${n.days} logged day${n.days !== 1 ? "s" : ""}. The marker sits at 80% of target.</p>
        </div>
        <div style="display:flex;flex-direction:column">${head("180px minmax(0,1fr) 150px 110px")}${n.macros.map((r) => row(r, true)).join("")}</div></div>`);
      parts.push(`<div style="${CARD}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};${H2};margin:0">Micronutrients</h2>
          <p style="${SUB};margin:0">Deficient below 70%, low 70–89%, on target 90–110%, high 111–200%, excess above 200%.</p>
        </div>
        <div style="display:flex;flex-direction:column">${head("150px minmax(0,1fr) 190px 110px")}${n.micros.map((r) => row(r, false)).join("")}</div></div>`);

      if (n.opportunities.length) parts.push(`<div style="${CARD}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="${serif};${H2};margin:0">Closing the gaps with meals you already eat</h2>
          <p style="${SUB};margin:0">Strongest sources of what you are short on. More often, or bigger portions, moves these fastest.</p>
        </div>
        <div style="display:flex;flex-direction:column">
          <div style="display:grid;grid-template-columns:minmax(0,1.5fr) 150px 120px minmax(0,1fr);gap:24px;padding:0 0 10px;border-bottom:1px solid ${H.rule};font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:${H.muted}"><div>Meal</div><div>Fills</div><div style="text-align:right">Per serving</div><div>Share of daily target</div></div>
          ${n.opportunities.map((g) => g.nutrients.map((x, j) => `<div style="display:grid;grid-template-columns:minmax(0,1.5fr) 150px 120px minmax(0,1fr);gap:24px;align-items:center;min-height:60px;border-bottom:1px solid ${H.hair};padding:8px 0">
            <div style="font-size:15px;font-weight:600;line-height:1.4">${j === 0 ? `${esc(g.meal)} <span style="font-weight:400;color:${H.muted}">(logged ${g.count}×)</span>` : ""}</div>
            <div style="font-size:15px"><span style="font-weight:600">${esc(x.label)}</span> <span style="color:${H.muted}">· now ${x.pct}%</span></div>
            <div style="text-align:right;font-size:15px">${num(x.per)}${esc(x.unit)}</div>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="position:relative;flex-grow:1;height:12px;background:${H.track};border-radius:6px;overflow:hidden"><div style="position:absolute;left:0;top:0;height:12px;width:${clamp(x.sharePct, 0, 100)}%;background:${H.green}"></div></div>
              <div style="width:48px;text-align:right;font-size:15px;font-weight:600">${x.sharePct}%</div>
            </div></div>`).join("")).join("")}
        </div></div>`);
    }

    // ── lifestyle factors that did not fit elsewhere ──
    const t2Rest = Object.entries(t2).filter(([k]) => k !== "sleep");
    if (!Object.keys(t2).length) pending.push({ t: "Lifestyle factors", r: "needs at least 3 sessions with and 3 without each of sun, hydration and good sleep, and a clear gap between them" });
    else if (t2Rest.length) parts.push(`<div style="${CARD}">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h2 style="${serif};${H2};margin:0">Lifestyle factors</h2>
        <p style="${SUB};margin:0">Average session performance on the days you logged each, against the days you did not.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${Math.min(3, t2Rest.length)},minmax(0,1fr));gap:20px">
        ${t2Rest.map(([k, d]) => `<div style="border:1px solid ${H.line};border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px">
          <h3 style="${serif};font-size:20px;margin:0">${esc(k === "sun" ? "Sun exposure" : k === "hydration" ? "Hydration" : k)}</h3>
          <div style="${serif};font-size:40px;font-weight:600;line-height:1;color:${d.delta > 0 ? H.green : H.orange}">${d.delta > 0 ? "+" : ""}${d.delta}</div>
          <p style="font-size:14px;color:${H.muted};margin:0">${d.meanTrue} on the ${d.nTrue} days you logged it vs ${d.meanFalse} on the ${d.nFalse} without</p>
          ${pill(d.confidence)}</div>`).join("")}
      </div></div>`);

    // ── habit changes ──
    const t4 = report.tier4;
    if (!t4 || !t4.changes.length) pending.push({ t: "Habit changes over time", r: (t4 && t4.note) ? t4.note.replace(/^Need /, "needs ").replace(/\.$/, "") : "no sustained change in your habits detected yet" });
    else parts.push(`<div style="${CARD}">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h2 style="${serif};${H2};margin:0">Habit changes over time</h2>
        <p style="${SUB};margin:0">Sustained shifts in what you log, and what your performance did across them.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${t4.changes.map((c) => `<div style="border-left:3px solid ${c.rppDelta > 0 ? H.green : H.orange};padding:6px 0 6px 18px">
          <div style="${LABEL}">${esc(formatDate(c.date))}</div>
          <p style="font-size:16px;line-height:1.5;margin:4px 0 0">${esc(tier4Sentence(c))}</p></div>`).join("")}
      </div></div>`);

    // ── digestive ──
    if (!report.gi) pending.push({ t: "Digestive notes", r: "no GI distress logged yet, so there is nothing to trace back to food" });
    else if (report.gi.triggers && report.gi.triggers.length) parts.push(`<div style="${CARD}">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h2 style="${serif};${H2};margin:0">Digestive notes</h2>
        <p style="${SUB};margin:0">Food words that appeared disproportionately in the 24 hours before you logged GI distress, on ${report.gi.giDays} of ${report.gi.totalDays} tracked days.</p>
      </div>
      <div style="display:flex;flex-direction:column">
        ${report.gi.triggers.map((t) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 200px 126px;gap:24px;align-items:center;min-height:54px;border-bottom:1px solid ${H.hair}">
          <div style="font-size:16px"><span style="font-weight:600">“${esc(t.word)}”</span> <span style="color:${H.muted}">appeared in ${t.total} meals</span></div>
          <div style="font-size:15px;color:${H.soft}">${t.giCount} of those (${Math.round((t.giCount / t.total) * 100)}%) on GI days</div>
          ${pill(t.confidence)}</div>`).join("")}
      </div>
      <p style="font-size:13px;color:${H.faint};margin:0">A keyword pattern, not a diagnosis.</p></div>`);
    else pending.push({ t: "Digestive notes", r: report.gi.belowThreshold ? `logged on ${report.gi.giDays} of ${report.gi.totalDays} tracked days; ${report.gi.minDays} days with GI distress are needed before food keywords mean anything` : `logged on ${report.gi.giDays} of ${report.gi.totalDays} tracked days, but no food keyword has appeared often enough to stand out` });

    // ── still waiting ──
    if (pending.length) parts.push(`<div style="${CARD}">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h2 style="${serif};${H2};margin:0">Still waiting on data</h2>
        <p style="${SUB};margin:0">These unlock on their own as you keep logging.</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">
        ${pending.map((p) => `<div style="border:1px solid ${H.line};border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px">
          <h3 style="${serif};font-size:19px;margin:0">${esc(p.t)}</h3>
          <p style="font-size:15px;line-height:1.5;color:${H.soft};margin:0">${esc(p.r)}.</p></div>`).join("")}
      </div></div>`);

    parts.push(`<div style="display:flex;justify-content:space-between;font-size:13px;color:${H.muted};border-top:1px solid ${H.rule};padding-top:20px">
      <span>Performance Report · ${esc(formatDate(new Date().toISOString().slice(0, 10)))} · Confidence: high · medium · low</span>
      <span>Every figure is measured from what you logged. Associations, not causes.</span></div>`);

    return `<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance Report — ${esc(formatDate(new Date().toISOString().slice(0, 10)))}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:${H.bg};font-family:'IBM Plex Sans',system-ui,sans-serif;color:${H.ink};font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
@media print{body{background:#fff}.sheet{padding:24px 28px!important}}
</style></head>
<body><div class="sheet" style="width:1280px;box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;gap:40px;background:${H.bg};margin:0 auto">
${parts.join("\n")}
</div></body></html>`;
  }
  window.renderReportHTML = renderHTML;
  window.renderReportPDF = renderPDF;
})();
</script>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;
// Same-origin: the app and its API are one Worker (see wrangler.jsonc). Static assets
// are served for asset paths; /analyze, /sync, /quota and /fetch-url fall through to
// the Worker. Left as a constant so it can be pointed elsewhere for local testing.

function calcTDEE(p){
  let bmr;
  if(p.gender==="male")bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)+5;
  else bmr=(10*p.weight)+(6.25*p.height)-(5*p.age)-161;
  const h=p.trainingHours||0;
  const af=h<=0.5?1.4:h<=1?1.6:h<=1.5?1.7:h<=2?1.8:h<=3?1.9:2.0;
  return Math.round(bmr*af);
}
function calcHydration(p){return Math.round((35*p.weight+600*(p.trainingHours||0))/100)/10}

function calcTargets(p){
  const goal=GOALS.find(g=>g.id===p.goal)||GOALS[0];
  const baseCal=calcTDEE(p);
  const cal=baseCal+goal.calAdj;
  const prot=Math.round(p.weight*goal.protMult);
  const fat=Math.round(cal*0.25/9);
  const carbs=Math.max(Math.round((cal-prot*4-fat*9)/4),50);
  const fiber=p.gender==="male"?35:28;
  const t={calories:cal,protein:prot,fat,carbs,fiber};
  MICROS.forEach(m=>{t[m.key]=m.target});
  if(p.gender==="female"){t.iron=18;t.vitaminA=700;t.vitaminC=75}
  // Overlay any user-set macro targets on top of the automatic calculation.
  // Protein is stored as g/kg so it rescales if weight changes; fat/carbs are stored as grams.
  // Fiber and micros are never overridden — they always stay automatic.
  if(p.custom){
    if(p.custom.protein!=null)t.protein=Math.round(p.custom.protein*p.weight);
    if(p.custom.fat!=null)t.fat=Math.round(p.custom.fat);
    if(p.custom.carbs!=null)t.carbs=Math.round(p.custom.carbs);
    t.calories=Math.round(t.protein*4+t.carbs*4+t.fat*9);
  }
  return t;
}

function today(){return new Date().toISOString().slice(0,10)}
function nowTime(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function minsOf(t){if(!t)return null;const[h,m]=String(t).split(":").map(Number);return(isNaN(h)||isNaN(m))?null:h*60+m}
// People usually log a main meal a while after eating it, so the first main meal logged
// in each window gets that meal's canonical time rather than the moment it was typed in.
// Everything else is stamped with the entry time. Two guards keep this honest:
//   - a canonical time is only used once it has passed, so nothing is stamped in the
//     future (logging at 00:30 stays 00:30 instead of jumping to 08:00);
//   - a light snack is always stamped with the entry time and never claims a window,
//     so an apple at 11:45 doesn't stop the real lunch from being placed at 12:30.
// Snacks are detected by calories, which works regardless of the language meals are
// typed in. Every time remains editable afterwards.
// A meal's separate foods. Analyses before items existed have none, so they fall back to
// the meal itself as a single item — every reader can then treat all meals the same way.
// Meal-level totals stay the source of truth for targets and charts; items are for display
// and for the report's name-based analysis.
function mealItems(m){
  if(!m)return[];
  if(Array.isArray(m.items)&&m.items.length)return m.items.filter(it=>it&&it.name);
  return[{name:m.mealName||"meal",calories:m.calories,protein:m.protein,fat:m.fat,carbs:m.carbs,fiber:m.fiber}];
}
const isSplitMeal=m=>Array.isArray(m&&m.items)&&m.items.length>1;

const SNACK_MAX_CALORIES=250;
const MEAL_WINDOWS=[
  {end:11*60+30,at:8*60},      // morning   -> breakfast 08:00
  {end:19*60,   at:12*60+30},  // midday    -> lunch     12:30
  {end:23*60+30,at:19*60},     // evening   -> dinner    19:00
];
const hhmm=mins=>String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
const isSnack=m=>{const c=Number(m&&m.calories);return c>0&&c<SNACK_MAX_CALORIES};
function defaultMealTime(todayMeals,meal){
  if(isSnack(meal))return nowTime();
  const d=new Date();const now=d.getHours()*60+d.getMinutes();
  let start=0;
  for(const w of MEAL_WINDOWS){
    if(now<w.end){
      // Only a main meal claims the window — snacks already logged in it don't count.
      const taken=(todayMeals||[]).some(m=>{const v=minsOf(m.time);return v!==null&&v>=start&&v<w.end&&!isSnack(m)});
      if(taken||now<w.at)return nowTime();
      return hhmm(w.at);
    }
    start=w.end;
  }
  return nowTime();
}
// Slots used to learn this user's own habitual meal times. The first meal logged inside a
// window is that day's instance of that slot. Deliberately separate from MEAL_WINDOWS,
// which drives past-day backfill and stays as it is.
const MEAL_SLOTS=[
  {key:"breakfast",label:"Breakfast",from:4*60,    to:11*60+30,fallback:8*60},
  {key:"lunch",    label:"Lunch",    from:11*60+30,to:17*60,   fallback:12*60+30},
  {key:"dinner",   label:"Dinner",   from:17*60,   to:24*60,   fallback:19*60},
];
const slotForMinutes=mins=>MEAL_SLOTS.find(s=>mins>=s.from&&mins<s.to)||null;

// Average time per slot across every logged day. A day contributes at most one meal to a
// slot — the earliest inside that window — so a late snack can't drag the average, and a
// day with nothing in a window simply doesn't count toward it. With no history for a slot
// the fallback stands in, so a brand-new user still gets a sensible suggestion.
function averageMealTimes(history){
  const acc={};MEAL_SLOTS.forEach(s=>acc[s.key]={sum:0,n:0});
  Object.keys(history||{}).forEach(d=>{
    const firsts={};
    (history[d]||[]).forEach(m=>{
      const v=minsOf(m.time);if(v===null)return;
      const slot=slotForMinutes(v);if(!slot)return;
      if(firsts[slot.key]===undefined||v<firsts[slot.key])firsts[slot.key]=v;
    });
    Object.keys(firsts).forEach(k=>{acc[k].sum+=firsts[k];acc[k].n++});
  });
  const out={};
  MEAL_SLOTS.forEach(s=>{out[s.key]=acc[s.key].n>0?Math.round(acc[s.key].sum/acc[s.key].n):s.fallback});
  return out;
}
// What the time box is pre-filled with once a meal has been analysed. Snacks, and a slot
// that already holds a main meal today, get the clock instead — the slot average would be
// a poor guess for either. The user can always change it before confirming.
function suggestMealTime(history,todayMeals,meal){
  const d=new Date();const now=d.getHours()*60+d.getMinutes();
  const slot=slotForMinutes(now);
  if(!slot||isSnack(meal))return nowTime();
  const taken=(todayMeals||[]).some(m=>{const v=minsOf(m.time);return v!==null&&v>=slot.from&&v<slot.to&&!isSnack(m)});
  if(taken)return nowTime();
  // The usual time is only a sensible guess once it has passed. Logging at 11:45 when
  // lunch is normally 12:30 would otherwise suggest a time that hasn't happened yet.
  const avg=averageMealTimes(history)[slot.key];
  return now>=avg?hhmm(avg):nowTime();
}
// Backfilling a past day has no meaningful "entry time", so main meals are placed by
// position instead: first is breakfast, second lunch, third dinner. Anything beyond
// that is left blank for the user to set. Snacks don't claim a main-meal slot (so a
// mid-morning apple can't push the real breakfast into lunch) and aren't counted when
// working out which slot is next — the same rule defaultMealTime applies to today.
// A snack lands just after the last main meal the day holds, rather than blank: a
// meal without a time is skipped by the report's training and GI windows entirely.
const PAST_SNACK_SLOTS=[10*60,16*60,21*60];   // after breakfast / after lunch / after dinner
function defaultPastMealTime(dayMeals,meal){
  const mains=(dayMeals||[]).filter(m=>!isSnack(m)).length;
  if(isSnack(meal))return hhmm(PAST_SNACK_SLOTS[Math.min(Math.max(mains-1,0),PAST_SNACK_SLOTS.length-1)]);
  return mains<MEAL_WINDOWS.length?hhmm(MEAL_WINDOWS[mains].at):"";
}
// Sleep quality is a three-level scale. Stored as "bad" | "mediocre" | "good"; nights
// logged before the middle level existed are booleans, so every read normalises first.
const SLEEP_LEVELS=["bad","mediocre","good"];
const SLEEP_META={
  bad:     {label:"Bad",      color:"var(--bad)",  soft:"var(--bad-soft)"},
  mediocre:{label:"Mediocre", color:"var(--warn)", soft:"var(--warn-soft)"},
  good:    {label:"Good",     color:"var(--good)", soft:"var(--good-soft)"},
};
function sleepLevel(v){
  if(v===true)return"good";
  if(v===false)return"bad";
  return SLEEP_LEVELS.includes(v)?v:undefined;
}
// Tapping the check-in box walks bad -> mediocre -> good -> bad; an unlogged box starts at bad.
function nextSleepLevel(v){
  const cur=sleepLevel(v);
  return cur===undefined?SLEEP_LEVELS[0]:SLEEP_LEVELS[(SLEEP_LEVELS.indexOf(cur)+1)%SLEEP_LEVELS.length];
}
// Report cadence, shared: the Report page shows it as a button label, the Log page as a
// banner. One source so the two can never disagree about whether a report is due.
const REPORT_CADENCE_DAYS=7;    // days between reports
const REPORT_GRACE_DAYS=2;      // how long an unlocked report stays downloadable
// Every user's report unlocks on this date. A window opened before it is ignored once, so
// the count restarts from that user's next download without touching any stored data.
// Bump this date to unlock everyone again.
const REPORT_EPOCH="2026-09-20";
function reportAvailability(history,lastReportWindowStart){
  const activeDaysLogged=Object.keys(history||{}).filter(d=>history[d]&&history[d].length>0).length;
  // ISO dates compare correctly as strings.
  const start=(lastReportWindowStart&&lastReportWindowStart>=REPORT_EPOCH)?lastReportWindowStart:null;
  if(!start){
    if(activeDaysLogged<REPORT_CADENCE_DAYS){const x=REPORT_CADENCE_DAYS-activeDaysLogged;return{enabled:false,activeDaysLogged,label:`First report available in ${x} day${x!==1?"s":""}`}}
    return{enabled:true,activeDaysLogged,label:"Report available — download now"};
  }
  const daysSince=Math.floor((new Date(today()+"T12:00:00")-new Date(start+"T12:00:00"))/86400000);
  if(daysSince<REPORT_CADENCE_DAYS){const z=REPORT_CADENCE_DAYS-daysSince;return{enabled:false,activeDaysLogged,label:`Next report available in ${z} day${z!==1?"s":""}`}}
  if(daysSince<REPORT_CADENCE_DAYS+REPORT_GRACE_DAYS){const y=REPORT_CADENCE_DAYS+REPORT_GRACE_DAYS-daysSince;return{enabled:true,activeDaysLogged,label:`Report available (expires in ${y} day${y!==1?"s":""})`}}
  return{enabled:true,activeDaysLogged,label:"Report available — download now"};
}

async function doAnalyze(text,img,prompt){
  const c=[];
  if(img){const mt=img.startsWith("data:image/png")?"image/png":"image/jpeg";c.push({type:"image",source:{type:"base64",media_type:mt,data:img.split(",")[1]}})}
  let cleanText=text?cleanUrl(text):text;
  // If URL found, fetch its content and include as context
  const urlMatch=cleanText&&cleanText.match(/https?:\/\/[^\s]+/);
  let pageContext="";
  if(urlMatch){
    const content=await fetchUrlContent(urlMatch[0]);
    if(content)pageContext=`\n\nPRODUCT PAGE CONTENT (use this for exact nutritional values):\n${content}`;
    cleanText=cleanText.replace(urlMatch[0],"").trim();
  }
  c.push({type:"text",text:`${prompt}${pageContext}\n\nMeal: ${cleanText}`});
  const body={model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:c}],userKey:currentUserKey,kind:"meal_analysis"};
  const r=await fetch(`${API_URL}/analyze`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  const allText=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  // The response object now nests an items array, so scan for the matching brace rather
  // than using a flat regex — a "no inner braces" pattern can no longer match it.
  const start=allText.indexOf("{");
  if(start!==-1){
    let depth=0,inStr=false,esc=false;
    for(let i=start;i<allText.length;i++){
      const ch=allText[i];
      if(inStr){ if(esc)esc=false; else if(ch==="\\")esc=true; else if(ch==='"')inStr=false; continue }
      if(ch==='"')inStr=true;
      else if(ch==="{")depth++;
      else if(ch==="}"){ depth--; if(depth===0){ try{return JSON.parse(allText.slice(start,i+1))}catch{break} } }
    }
  }
  const broad=allText.match(/\{[\s\S]*\}/);
  if(broad)return JSON.parse(broad[0]);
  throw new Error("Analysis failed. Try describing the product manually.");
}
